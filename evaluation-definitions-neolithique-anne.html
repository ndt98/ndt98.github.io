<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Évaluation définitions Néolithique – Anne</title><style>body{margin:0;background:#f3efe6;color:#26221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0000000d}h1{font-size:1.5rem;margin:0 0 6px}.muted{color:#6d655e}.q{margin-top:18px}.q label{display:block;font-weight:700;margin-bottom:7px}.q textarea{width:100%;min-height:86px;border:1px solid #d8ccc1;border-radius:13px;padding:12px;font:inherit;box-sizing:border-box}.btn{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:750;background:#765035;color:white;margin-top:20px}.hidden{display:none}.score{text-align:center;font-size:3rem;font-weight:850;margin:12px 0}.review{border-top:1px solid #eadfd5;padding:12px 0;line-height:1.45}.ok{color:#175929}.bad{color:#821f1f}.model{margin-top:6px;color:#5f564f}</style></head><body><main><section class="card"><h1>✍️ Évaluation – Définitions du Néolithique</h1><div class="muted">Anne • 10 réponses écrites • aucun QCM</div><p>Écris avec tes propres mots. La correction cherche les idées essentielles, pas une phrase apprise mot pour mot.</p></section><section class="card" id="exam"></section><section class="card hidden" id="result"><div class="score" id="score"></div><div id="review"></div><button class="btn" onclick="location.reload()">Nouvelle tentative</button></section></main><script>const data=[['Révolution néolithique','Passage progressif du nomadisme de chasse-cueillette à une vie sédentaire fondée sur agriculture et élevage.',['nomad','sedentar','agric','elev'],3],['Sédentaire','Personne qui vit dans un habitat fixe.',['fixe','habitat'],2],['Agriculture','Activité qui consiste à cultiver la terre et des plantes.',['cultiv','terre'],2],['Élevage','Activité qui consiste à élever des animaux domestiques.',['elev','animal','domesti'],2],['Artisan','Personne qui fabrique des objets à la main.',['fabri','objet','main'],2],['Mégalithe','Construction faite de grandes pierres, souvent liée à une tombe collective.',['pierre','grand','tombe','collectif'],2],['Menhir','Grande pierre dressée verticalement.',['pierre','dresse'],2],['Dolmen','Construction de grandes pierres servant notamment de tombe collective.',['pierre','tombe','collectif'],2],['Défricher','Enlever la végétation pour mettre une terre en culture.',['veget','enlev','cultiv','terre'],2],['Foyer néolithique / zone de diffusion','Un foyer est une région où agriculture et élevage apparaissent ; une zone de diffusion les reçoit ensuite.',['foyer','appar','diffusion','recoit','arriv'],2]];function n(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}const exam=document.getElementById('exam');data.forEach((d,i)=>exam.insertAdjacentHTML('beforeend','<div class="q"><label>'+(i+1)+'. Définis « '+d[0]+' ».</label><textarea id="r'+i+'"></textarea></div>'));exam.insertAdjacentHTML('beforeend','<button class="btn" onclick="corriger()">Terminer et corriger</button>');function corriger(){let s=0,h='<h3>Correction détaillée</h3>';data.forEach((d,i)=>{const a=document.getElementById('r'+i).value.trim(),t=n(a);let hits=0;d[2].forEach(k=>{if(t.includes(n(k)))hits++});const ok=hits>=d[3];if(ok)s++;h+='<div class="review"><b class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✅':'❌')+' '+d[0]+'</b><br><b>Réponse d’Anne :</b> '+(a||'Aucune réponse')+'<div class="model"><b>Réponse attendue :</b> '+d[1]+'</div></div>'});exam.classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=s+' / 10';document.getElementById('review').innerHTML=h;window.scrollTo(0,0)}</script></body></html>
