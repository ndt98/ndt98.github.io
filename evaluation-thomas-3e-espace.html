<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Évaluation 3e – Espace – Thomas</title>
<style>
:root { --bg:#f4f6f8; --card:#ffffff; --text:#171717; --muted:#62666b; --line:#d9dde2; --ok:#eaf7ed; --bad:#fdecec; --accent:#111827; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%; }
main { max-width:760px; margin:0 auto; padding:18px 14px 48px; }
header { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:14px; }
h1 { margin:0 0 8px; font-size:26px; line-height:1.2; }
.subtitle { color:var(--muted); font-size:16px; line-height:1.4; margin:0; }
.notice { margin-top:14px; padding:12px 14px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); font-weight:650; }
.qcard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
.qtext { font-size:18px; line-height:1.35; font-weight:700; margin:0 0 12px; }
.option { display:block; padding:12px 12px; margin:8px 0; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:16px; line-height:1.3; }
.option input { transform:scale(1.18); margin-right:9px; }
.correct { background:var(--ok); border-color:#9cc8a5; }
.incorrect { background:var(--bad); border-color:#e2a0a0; }
.explain { display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:15px; line-height:1.4; }
.actions { position:sticky; bottom:0; padding:12px 0 calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, rgba(244,246,248,0)); }
button { width:100%; border:0; border-radius:14px; padding:15px 16px; font-size:18px; font-weight:750; background:var(--accent); color:#fff; }
button.secondary { margin-top:9px; background:#e5e7eb; color:#111; }
#result { display:none; background:var(--card); border:2px solid var(--accent); border-radius:18px; padding:18px; margin:14px 0; }
#score { font-size:30px; font-weight:800; margin:0 0 6px; }
#feedback { font-size:16px; color:var(--muted); margin:0; line-height:1.4; }
@media (max-width:430px) { h1 { font-size:23px; } .qtext { font-size:17px; } }
</style>
</head>
<body>
<main>
<header>
<h1>Évaluation – 3e</h1>
<p class="subtitle">Système solaire, course à l’espace, exploration de Mars et exoplanètes.</p>
<div class="notice">Dates à connaître par cœur : <strong>1957</strong> · <strong>1961</strong> · <strong>1969</strong>. Aucune autre date n’est demandée.</div>
</header>
<div id="result"><p id="score"></p><p id="feedback"></p><div id="sendStatus" class="small" style="margin-top:12px"></div></div>
<form id="quiz"></form>
<div class="actions"><button type="button" id="submitBtn">Corriger l’évaluation</button><button type="button" id="resetBtn" class="secondary" style="display:none">Recommencer</button></div>
</main>
<script>
const questions = [{"q":"1. Pendant longtemps, quelle idée l’être humain avait-il de la place de la Terre dans l’Univers ?","choices":["La Terre était au centre de l’Univers","Le Soleil était au centre de l’Univers","Mars était au centre de l’Univers","La Terre tournait autour de la Lune"],"answer":0,"explain":"Pendant longtemps, on a pensé que la Terre était au centre de l’Univers."},{"q":"2. À la Renaissance, qu’a observé Galilée ?","choices":["Le mouvement des planètes autour du Soleil","La présence d’eau liquide sur Mars","La première exoplanète","Le fonctionnement d’un réacteur nucléaire"],"answer":0,"explain":"Galilée observe le mouvement des planètes autour du Soleil."},{"q":"3. Quelle théorie Isaac Newton formule-t-il à la fin du XVIIe siècle ?","choices":["La théorie de la gravitation universelle","La théorie de la relativité","La théorie des plaques tectoniques","La théorie de l’évolution"],"answer":0,"explain":"Newton formule la théorie de la gravitation universelle."},{"q":"4. La gravitation universelle permet notamment de…","choices":["Calculer les trajectoires des planètes et expliquer les marées","Fabriquer de l’oxygène sur Mars","Mesurer la température du Soleil","Transformer l’énergie nucléaire en énergie solaire"],"answer":0,"explain":"La synthèse indique qu’elle permet de calculer les trajectoires des planètes et satellites et d’expliquer les marées."},{"q":"5. Pourquoi la guerre froide a-t-elle joué un rôle important dans la conquête spatiale ?","choices":["Le développement des missiles intercontinentaux a conduit au développement des fusées spatiales","Les fusées ont été inventées pour transporter des touristes","La guerre froide a supprimé l’attraction terrestre","Les satellites servaient uniquement à observer la Lune"],"answer":0,"explain":"La conception de missiles intercontinentaux USA-URSS a contribué au développement des fusées spatiales."},{"q":"6. En quelle année Spoutnik 1, premier satellite artificiel cité dans la fiche, est-il mis en orbite ?","choices":["1957","1961","1969","1972"],"answer":0,"explain":"À retenir : Spoutnik 1 → 1957."},{"q":"7. Qui est le premier homme dans l’espace ?","choices":["Youri Gagarine","Neil Armstrong","Isaac Newton","J. F. Kennedy"],"answer":0,"explain":"Youri Gagarine est le premier homme dans l’espace."},{"q":"8. En quelle année Youri Gagarine devient-il le premier homme dans l’espace ?","choices":["1957","1961","1969","1975"],"answer":1,"explain":"À retenir : Gagarine → 1961."},{"q":"9. Qui marche sur la Lune lors de la mission Apollo 11 ?","choices":["Neil Armstrong","Youri Gagarine","Galilée","Sojourner"],"answer":0,"explain":"Neil Armstrong marche sur la Lune lors de la mission Apollo 11."},{"q":"10. En quelle année le premier homme marche-t-il sur la Lune ?","choices":["1957","1961","1969","1981"],"answer":2,"explain":"À retenir : premier homme sur la Lune → 1969."},{"q":"11. Au début de la course à l’espace, quel pays est en avance dans le domaine des fusées et de l’exploration spatiale ?","choices":["L’URSS","Les États-Unis","La Chine","La France"],"answer":0,"explain":"La fiche indique que les Soviétiques sont alors en avance sur les Américains."},{"q":"12. Comment les astromobiles des dernières missions Apollo étaient-elles alimentées ?","choices":["Par des moteurs électriques alimentés par des batteries","Par des panneaux solaires uniquement","Par un réacteur nucléaire","Par un moteur diesel"],"answer":0,"explain":"Les astromobiles Apollo utilisaient des moteurs électriques alimentés par des batteries."},{"q":"13. Pourquoi l’exploration de Mars est-elle plus difficile que celle de la Lune ?","choices":["À cause de la distance et des conditions atmosphériques à la surface de Mars","Parce que Mars n’a pas de gravité","Parce que Mars tourne autour de la Terre","Parce qu’aucun engin ne peut se poser sur Mars"],"answer":0,"explain":"La fiche insiste sur la distance et les conditions atmosphériques martiennes."},{"q":"14. Quelle affirmation décrit correctement Mars 3 ?","choices":["C’est une sonde soviétique qui s’est posée sans s’écraser mais n’a fonctionné que quelques secondes","C’est le premier homme à avoir marché sur Mars","C’est un rover chinois à énergie nucléaire","C’est le nom d’une mission Apollo"],"answer":0,"explain":"Mars 3 est la première sonde citée à s’être posée sans s’écraser, mais elle ne fonctionne que quelques secondes."},{"q":"15. Quel point commun énergétique ont Sojourner, Spirit et Opportunity ?","choices":["Ils utilisent des panneaux solaires","Ils utilisent tous un réacteur nucléaire","Ils utilisent des batteries rechargeables sur Terre","Ils fonctionnent avec du carburant diesel"],"answer":0,"explain":"Sojourner, Spirit et Opportunity utilisent des panneaux solaires pour fournir l’énergie aux moteurs électriques."},{"q":"16. Quelle source d’énergie utilisent Curiosity et Perseverance ?","choices":["Un réacteur nucléaire","Uniquement des panneaux solaires","Des piles jetables","Un moteur à essence"],"answer":0,"explain":"Curiosity et Perseverance sont équipés d’un réacteur nucléaire fournissant l’énergie électrique."},{"q":"17. Quand la distance Terre–Mars est-elle la plus faible ?","choices":["Lors d’une opposition","Lors d’une conjonction","Quand Mars est immobile","Quand la Terre est entre la Lune et le Soleil"],"answer":0,"explain":"Une opposition correspond à une période favorable où la distance Terre–Mars est la plus faible."},{"q":"18. Lors d’une conjonction Terre–Mars…","choices":["La distance Terre–Mars est maximale","La distance Terre–Mars est minimale","Mars s’arrête de tourner autour du Soleil","La Terre met plus de deux ans à faire une révolution"],"answer":0,"explain":"La fiche indique qu’en conjonction, la distance Terre–Mars est maximale."},{"q":"19. Qu’est-ce qu’une exoplanète ?","choices":["Une planète située dans un autre système solaire","Une planète située entre la Terre et la Lune","Un satellite artificiel","Un véhicule destiné à rouler sur Mars"],"answer":0,"explain":"Une exoplanète est une planète appartenant à un autre système solaire."},{"q":"20. Quelle comparaison des temps de voyage correspond à la fiche ?","choices":["Environ 3 jours pour la Lune, quelques mois pour Mars, et des dizaines de milliers d’années vers le système solaire le plus proche avec les vaisseaux actuels","Quelques heures pour la Lune et 3 jours pour Mars","Quelques mois pour la Lune et quelques années pour Mars","Le voyage vers une exoplanète est déjà plus rapide que le voyage vers Mars"],"answer":0,"explain":"La fiche compare environ 3 jours vers la Lune, quelques mois vers Mars et plusieurs dizaines de milliers d’années vers le système solaire le plus proche."}];
const quiz=document.getElementById('quiz'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),feedbackEl=document.getElementById('feedback'),submitBtn=document.getElementById('submitBtn'),resetBtn=document.getElementById('resetBtn'),sendStatus=document.getElementById('sendStatus');
function render(){quiz.innerHTML='';questions.forEach((item,idx)=>{const card=document.createElement('section');card.className='qcard';card.id='q'+idx;const p=document.createElement('p');p.className='qtext';p.textContent=item.q;card.appendChild(p);item.choices.forEach((choice,cidx)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+idx;input.value=cidx;label.appendChild(input);label.appendChild(document.createTextNode(choice));card.appendChild(label);});const exp=document.createElement('div');exp.className='explain';exp.textContent=item.explain;card.appendChild(exp);quiz.appendChild(card);});}
async function sendResult(score,pct){sendStatus.textContent='Envoi de la note par e-mail…';try{const response=await fetch('https://formsubmit.co/ajax/ndt2004@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Résultat évaluation Espace – Thomas : '+score+'/20','Élève':'Thomas','Score':score+'/20','Pourcentage':pct+' %'})});if(!response.ok)throw new Error('Erreur');sendStatus.textContent='✅ Note envoyée par e-mail.';}catch(e){sendStatus.textContent='⚠️ Quiz terminé, mais l’envoi de la note a échoué.';}}
function correctQuiz(){let score=0,unanswered=0;questions.forEach((item,idx)=>{const card=document.getElementById('q'+idx),labels=card.querySelectorAll('.option'),selected=card.querySelector('input:checked');labels.forEach(l=>l.classList.remove('correct','incorrect'));if(!selected){unanswered++;}else{const val=Number(selected.value);if(val===item.answer){score++;selected.closest('.option').classList.add('correct');}else selected.closest('.option').classList.add('incorrect');}labels[item.answer].classList.add('correct');card.querySelector('.explain').style.display='block';});const pct=Math.round(score/questions.length*100);scoreEl.textContent=`${score} / ${questions.length} — ${pct} %`;let msg='';if(score>=18)msg='Très bon niveau : la fiche est bien maîtrisée.';else if(score>=15)msg='Bon niveau : relire seulement les points signalés en rouge.';else if(score>=12)msg='Ensemble correct, mais plusieurs notions doivent encore être consolidées.';else msg='Il faut relire la fiche de synthèse puis refaire l’évaluation.';if(unanswered)msg+=` ${unanswered} question(s) non répondue(s).`;feedbackEl.textContent=msg;result.style.display='block';submitBtn.style.display='none';resetBtn.style.display='block';result.scrollIntoView({behavior:'smooth',block:'start'});sendResult(score,pct);}
function resetQuiz(){document.getElementById('quiz').reset();document.querySelectorAll('.option').forEach(l=>l.classList.remove('correct','incorrect'));document.querySelectorAll('.explain').forEach(e=>e.style.display='none');result.style.display='none';sendStatus.textContent='';submitBtn.style.display='block';resetBtn.style.display='none';window.scrollTo({top:0,behavior:'smooth'});}
submitBtn.addEventListener('click',correctQuiz);resetBtn.addEventListener('click',resetQuiz);render();
</script>
</body>
</html>
