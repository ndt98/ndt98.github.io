<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Examen ciblé Néolithique – Anne</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#26221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0000000d}h1{font-size:1.45rem;margin:0 0 6px}.muted{color:#6d655e}.progress{height:10px;background:#eee5dc;border-radius:99px;overflow:hidden;margin-top:14px}#bar{height:100%;background:#765035;width:0}.qnum{color:#6d655e;margin-bottom:8px}.question{font-weight:750;font-size:1.15rem;line-height:1.35;margin-bottom:14px}.answers{display:grid;gap:10px}.choice{width:100%;border:1px solid #d8ccc1;border-radius:14px;background:white;padding:13px;text-align:left;font:inherit}.choice.selected{background:#f1e3d3;border-color:#765035}.letter{font-weight:800;margin-right:7px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;border:0;border-radius:13px;padding:13px;font:inherit;font-weight:750}.secondary{background:#eee7df}.primary{background:#765035;color:white}.hidden{display:none!important}.error{margin-top:12px;padding:10px;border-radius:11px;background:#fdecec;color:#821f1f}.score{text-align:center;font-size:3rem;font-weight:850;margin:12px 0}.review{border-top:1px solid #eadfd5;padding:10px 0}</style></head><body><main><section class="card"><h1>🎯 Examen ciblé – Révolution néolithique</h1><div class="muted">Anne • 20 questions • niveau difficile</div><div class="muted">Ciblé sur : défrichement, foyers/diffusion, activités de production vs techniques.</div><div class="progress"><div id="bar"></div></div></section><section class="card" id="quiz"><div id="qnum" class="qnum"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="error" class="error hidden"></div><div class="actions"><button type="button" id="prev" class="secondary">← Précédent</button><button type="button" id="next" class="primary">Suivant</button></div></section><section class="card hidden" id="result"><div class="muted" style="text-align:center">Résultat</div><div id="score" class="score"></div><div id="message" style="text-align:center"></div><div id="mailStatus" class="muted" style="text-align:center;margin-top:12px"></div><div class="actions"><button type="button" id="restart" class="primary">Nouvelle tentative</button></div><div id="review"></div></section></main><script>
const base=[
{q:"Que signifie exactement « défricher » ?",o:["Enlever ou détruire la végétation avant de mettre une terre en culture","Polir une pierre pour fabriquer un outil","Domestiquer un animal","Construire un mégalithe"],a:0,e:"Défricher, c’est enlever la végétation afin de préparer une terre à la culture."},
{q:"Quel enchaînement est correct ?",o:["Défricher → cultiver → produire","Cultiver → défricher → nomadiser","Polir → défricher → élever","Défricher → construire → dolmen"],a:0,e:"On défriche avant de cultiver."},
{q:"On enlève arbres et arbustes pour semer du blé. Quelle action réalise-t-on ?",o:["Défricher","Polir","Tisser","Domestiquer"],a:0,e:"Enlever la végétation avant la culture est un défrichement."},
{q:"Quelle phrase est FAUSSE ?",o:["Défricher signifie polir la pierre","Défricher prépare une terre à la culture","Défricher concerne la végétation","Défricher peut précéder l’agriculture"],a:0,e:"Le polissage est une technique différente du défrichement."},
{q:"Pourquoi défricher une parcelle au Néolithique ?",o:["Pour rendre le terrain cultivable","Pour fabriquer de la céramique","Pour dresser un menhir","Pour rendre les hommes nomades"],a:0,e:"Le défrichement prépare la mise en culture."},
{q:"Quel couple est correctement associé ?",o:["Défricher → agriculture","Défricher → polissage","Défricher → tissage","Défricher → croyances"],a:0,e:"Le défrichement est lié à la mise en culture."},
{q:"Quelle action ne relève PAS du défrichement ?",o:["Polir une hache de pierre","Couper des arbustes avant de semer","Enlever la végétation d’une parcelle","Préparer un terrain pour la culture"],a:0,e:"Polir une pierre est une technique."},
{q:"Quel raisonnement est le plus cohérent ?",o:["La sédentarisation favorise la culture ; cultiver nécessite parfois de défricher","Le défrichement rend les hommes forcément nomades","Le défrichement remplace l’élevage","Défricher signifie construire des tombes"],a:0,e:"Défricher s’inscrit dans la mise en culture des terres."},
{q:"Quel énoncé correspond au planisphère étudié ?",o:["Proche-Orient = foyer ; Europe = diffusion ; autres foyers ailleurs","Europe = foyer unique ; aucun autre foyer","Proche-Orient = diffusion seulement","Tous les foyers sont en Europe"],a:0,e:"Le Proche-Orient est un foyer étudié et l’Europe une zone de diffusion."},
{q:"Une flèche de diffusion vers l’Europe signifie quoi ?",o:["L’agriculture et l’élevage y arrivent progressivement depuis d’autres foyers","L’Europe est forcément le premier foyer mondial","L’Europe abandonne l’agriculture","La flèche représente seulement des migrations animales"],a:0,e:"La diffusion correspond à l’arrivée progressive de pratiques apparues ailleurs."},
{q:"Quelle affirmation est correcte ?",o:["Il existe plusieurs foyers néolithiques indépendants","Un seul foyer existe et il se situe en Europe","La Chine n’est jamais un foyer","La Nouvelle-Guinée est seulement une zone de diffusion"],a:0,e:"Le cours présente plusieurs foyers indépendants."},
{q:"Quel ensemble ne contient que des foyers étudiés ?",o:["Proche-Orient, Chine, Nouvelle-Guinée, Mexique","Europe, Groenland, Japon, Scandinavie","Europe, Inde, Japon, Madagascar","Australie, Europe, Groenland, Japon"],a:0,e:"Ces régions font partie des foyers étudiés."},
{q:"Quelle différence entre foyer et zone de diffusion ?",o:["Le foyer est une zone d’apparition ; la zone de diffusion reçoit ensuite ces pratiques","Le foyer est une tombe ; la diffusion est un village","Le foyer est toujours une ville","Les deux mots ont exactement le même sens"],a:0,e:"La carte distingue origine et propagation."},
{q:"Pourquoi l’Europe est-elle surtout une zone de diffusion dans le cours ?",o:["Parce que les pratiques y arrivent progressivement depuis d’autres régions","Parce qu’on n’y pratique jamais l’agriculture","Parce qu’elle n’est pas habitée","Parce qu’elle reste entièrement nomade jusqu’à l’écriture"],a:0,e:"L’Europe reçoit progressivement les pratiques néolithiques."},
{q:"Quel groupe correspond à des activités de production ?",o:["Cultiver • élever • produire de la nourriture","Polir • modeler la céramique • tisser","Menhir • dolmen • chef","Chasser • cueillir • nomadiser"],a:0,e:"Agriculture et élevage sont des activités de production."},
{q:"Quel groupe correspond uniquement à des techniques ?",o:["Pierre polie • céramique • filage/tissage","Agriculture • élevage • défrichement","Chef • artisan • croyances","Village • sédentarité • nomadisme"],a:0,e:"Pierre polie, céramique, filage et tissage sont des techniques."},
{q:"Quelle association est correcte ?",o:["Agriculture = activité ; polissage de la pierre = technique","Agriculture = technique ; polissage = activité","Élevage = technique ; tissage = activité","Céramique = activité agricole"],a:0,e:"L’agriculture est une activité de production ; le polissage est une technique."},
{q:"La céramique appartient à quelle catégorie ?",o:["Nouvelle technique","Activité d’élevage","Mode de vie nomade","Foyer de diffusion"],a:0,e:"La fabrication de céramique est une technique."},
{q:"Le filage et le tissage de la laine sont surtout…",o:["des techniques","des foyers néolithiques","des activités agricoles","des formes de nomadisme"],a:0,e:"Filage et tissage sont des techniques."},
{q:"Quelle distinction est la plus juste ?",o:["Agriculture/élevage = activités ; pierre polie/céramique/filage-tissage = techniques","Agriculture/élevage = techniques ; pierre polie/céramique = activités","Tout cela désigne seulement des techniques","Tout cela désigne seulement des activités"],a:0,e:"Il faut distinguer les nouvelles activités des nouvelles techniques."}
];
const letters=["A","B","C","D"];function makeQuestions(){return base.map(q=>{const arr=q.o.map((text,i)=>({text,good:i===q.a}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return{q:q.q,o:arr,e:q.e,a:arr.findIndex(x=>x.good)}})}let questions=makeQuestions(),idx=0,answers=Array(questions.length).fill(null),shown=false,sent=false,sending=false;const $=id=>document.getElementById(id);
function render(){const q=questions[idx];$("qnum").textContent=`Question ${idx+1} sur ${questions.length}`;$("question").textContent=q.q;$("answers").innerHTML="";q.o.forEach((x,n)=>{const b=document.createElement("button");b.type="button";b.className="choice"+(answers[idx]===n?" selected":"");b.innerHTML=`<span class='letter'>${letters[n]}.</span>${x.text}`;b.addEventListener("click",()=>{answers[idx]=n;$("error").classList.add("hidden");render()});$("answers").appendChild(b)});$("prev").disabled=idx===0;$("next").textContent=idx===questions.length-1?"Terminer":"Suivant";$("bar").style.width=`${idx/questions.length*100}%`}
$("next").addEventListener("click",()=>{if(answers[idx]===null){$("error").textContent="Choisis d’abord une réponse.";$("error").classList.remove("hidden");return}$("error").classList.add("hidden");if(idx<questions.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else showResult()});
$("prev").addEventListener("click",()=>{if(idx>0){idx--;render()}});
function total(){return answers.reduce((s,a,i)=>s+(a===questions[i].a?1:0),0)}
function details(){return questions.map((q,i)=>`${i+1}. ${answers[i]===q.a?"OK":"ERREUR"} | Anne : ${answers[i]==null?"Aucune":q.o[answers[i]].text} | Bonne réponse : ${q.o[q.a].text}`).join("\n")}
async function sendMail(){if(sent||sending)return;sending=true;$("mailStatus").textContent="Envoi automatique du résultat…";try{const score=total();const r=await fetch("https://formsubmit.co/ajax/ndt2004@gmail.com",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({"_subject":`Examen ciblé Néolithique – Anne : ${score}/20`,"Élève":"Anne","Score":`${score}/20`,"Détail":details()})});if(!r.ok)throw new Error("mail");sent=true;$("mailStatus").textContent="✅ Résultat envoyé par e-mail."}catch(e){$("mailStatus").textContent="⚠️ Résultat affiché, mais l’envoi du mail a échoué."}finally{sending=false}}
function showResult(){if(shown)return;shown=true;$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("bar").style.width="100%";const t=total();$("score").textContent=`${t} / 20`;$("message").textContent=t>=18?"Très bien : les points faibles sont désormais bien maîtrisés.":t>=15?"Bon niveau : revois seulement les erreurs.":"Il faut encore consolider ces trois thèmes.";$("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>`<div class='review'><b>${i+1}. ${answers[i]===q.a?"✅":"❌"}</b> ${q.e}${answers[i]===q.a?"":`<br><b>Bonne réponse :</b> ${q.o[q.a].text}`}</div>`).join("");sendMail()}
$("restart").addEventListener("click",()=>{questions=makeQuestions();idx=0;answers=Array(questions.length).fill(null);shown=false;sent=false;sending=false;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");$("mailStatus").textContent="";render()});render();
</script></body></html>
