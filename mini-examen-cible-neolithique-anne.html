<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Examen ciblé Néolithique – Anne</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#26221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0000000d}h1{font-size:1.45rem;margin:0 0 6px}.muted{color:#6d655e}.progress{height:10px;background:#eee5dc;border-radius:99px;overflow:hidden;margin-top:14px}#bar{height:100%;background:#765035;width:0}.qnum{color:#6d655e;margin-bottom:8px}.question{font-weight:750;font-size:1.15rem;line-height:1.35;margin-bottom:14px}.answers{display:grid;gap:10px}.choice{width:100%;border:1px solid #d8ccc1;border-radius:14px;background:#fff;padding:13px;text-align:left;font:inherit}.choice.sel{background:#f1e3d3;border-color:#765035}.letter{font-weight:800;margin-right:7px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;border:0;border-radius:13px;padding:13px;font:inherit;font-weight:750}.secondary{background:#eee7df}.primary{background:#765035;color:#fff}.hidden{display:none!important}.error{margin-top:12px;padding:10px;border-radius:11px;background:#fdecec;color:#821f1f}.score{text-align:center;font-size:3rem;font-weight:850;margin:12px 0}.review{border-top:1px solid #eadfd5;padding:10px 0}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🎯 Examen ciblé – Révolution néolithique</h1>
<div class="muted">Anne • 20 questions • niveau difficile</div>
<div class="muted">Défrichement • foyers/diffusion • activités vs techniques</div>
<div class="progress"><div id="bar"></div></div>
</section>
<section class="card" id="quiz">
<div id="qnum" class="qnum"></div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<div id="error" class="error hidden">Choisis d’abord une réponse.</div>
<div class="actions">
<button type="button" id="prevBtn" class="secondary" onclick="previousQuestion()">← Précédent</button>
<button type="button" id="nextBtn" class="primary" onclick="nextQuestion()">Suivant</button>
</div>
</section>
<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat ciblé</div>
<div id="score" class="score"></div>
<div id="message" style="text-align:center"></div>
<div id="mailStatus" class="muted" style="text-align:center;margin-top:12px"></div>
<div class="actions"><button type="button" class="primary" onclick="restartQuiz()">Nouvelle tentative</button></div>
<div id="review"></div>
</section>
</main>
<script>
var sourceQuestions=[
["Que signifie exactement « défricher » ?",["Enlever ou détruire la végétation avant de mettre une terre en culture","Polir une pierre pour fabriquer un outil","Domestiquer un animal","Construire un mégalithe"],0,"Défricher = enlever la végétation pour préparer une terre à la culture."],
["Quel enchaînement est correct ?",["Défricher → cultiver → produire","Cultiver → défricher → nomadiser","Polir → défricher → élever","Défricher → construire → dolmen"],0,"On défriche avant de cultiver."],
["On enlève arbres et arbustes pour semer du blé. Quelle action réalise-t-on ?",["Défricher","Polir","Tisser","Domestiquer"],0,"Enlever la végétation avant la culture est un défrichement."],
["Quelle phrase est FAUSSE ?",["Défricher signifie polir la pierre","Défricher prépare une terre à la culture","Défricher concerne la végétation","Défricher peut précéder l’agriculture"],0,"Le polissage est une technique différente du défrichement."],
["Pourquoi défricher une parcelle au Néolithique ?",["Pour rendre le terrain cultivable","Pour fabriquer de la céramique","Pour dresser un menhir","Pour rendre les hommes nomades"],0,"Le défrichement prépare la mise en culture."],
["Quel couple est correctement associé ?",["Défricher → agriculture","Défricher → polissage","Défricher → tissage","Défricher → croyances"],0,"Le défrichement est lié à la mise en culture."],
["Quelle action ne relève PAS du défrichement ?",["Polir une hache de pierre","Couper des arbustes avant de semer","Enlever la végétation d’une parcelle","Préparer un terrain pour la culture"],0,"Polir une pierre est une technique."],
["Quel raisonnement est le plus cohérent ?",["La sédentarisation favorise la culture ; cultiver nécessite parfois de défricher","Le défrichement rend les hommes forcément nomades","Le défrichement remplace l’élevage","Défricher signifie construire des tombes"],0,"Défricher s’inscrit dans la mise en culture des terres."],
["Quel énoncé correspond au planisphère étudié ?",["Proche-Orient = foyer ; Europe = diffusion ; autres foyers ailleurs","Europe = foyer unique ; aucun autre foyer","Proche-Orient = diffusion seulement","Tous les foyers sont en Europe"],0,"Le Proche-Orient est un foyer étudié et l’Europe une zone de diffusion."],
["Une flèche de diffusion vers l’Europe signifie quoi ?",["L’agriculture et l’élevage y arrivent progressivement depuis d’autres foyers","L’Europe est forcément le premier foyer mondial","L’Europe abandonne l’agriculture","La flèche représente seulement des migrations animales"],0,"La diffusion correspond à l’arrivée progressive de pratiques apparues ailleurs."],
["Quelle affirmation est correcte ?",["Il existe plusieurs foyers néolithiques indépendants","Un seul foyer existe et il se situe en Europe","La Chine n’est jamais un foyer","La Nouvelle-Guinée est seulement une zone de diffusion"],0,"Le cours présente plusieurs foyers indépendants."],
["Quel ensemble ne contient que des foyers étudiés ?",["Proche-Orient, Chine, Nouvelle-Guinée, Mexique","Europe, Groenland, Japon, Scandinavie","Europe, Inde, Japon, Madagascar","Australie, Europe, Groenland, Japon"],0,"Ces régions font partie des foyers étudiés."],
["Quelle différence entre foyer et zone de diffusion ?",["Le foyer est une zone d’apparition ; la zone de diffusion reçoit ensuite ces pratiques","Le foyer est une tombe ; la diffusion est un village","Le foyer est toujours une ville","Les deux mots ont exactement le même sens"],0,"La carte distingue origine et propagation."],
["Pourquoi l’Europe est-elle surtout une zone de diffusion dans le cours ?",["Parce que les pratiques y arrivent progressivement depuis d’autres régions","Parce qu’on n’y pratique jamais l’agriculture","Parce qu’elle n’est pas habitée","Parce qu’elle reste entièrement nomade jusqu’à l’écriture"],0,"L’Europe reçoit progressivement les pratiques néolithiques."],
["Quel groupe correspond à des activités de production ?",["Cultiver • élever • produire de la nourriture","Polir • modeler la céramique • tisser","Menhir • dolmen • chef","Chasser • cueillir • nomadiser"],0,"Agriculture et élevage sont des activités de production."],
["Quel groupe correspond uniquement à des techniques ?",["Pierre polie • céramique • filage/tissage","Agriculture • élevage • défrichement","Chef • artisan • croyances","Village • sédentarité • nomadisme"],0,"Pierre polie, céramique, filage et tissage sont des techniques."],
["Quelle association est correcte ?",["Agriculture = activité ; polissage de la pierre = technique","Agriculture = technique ; polissage = activité","Élevage = technique ; tissage = activité","Céramique = activité agricole"],0,"L’agriculture est une activité de production ; le polissage est une technique."],
["La céramique appartient à quelle catégorie ?",["Nouvelle technique","Activité d’élevage","Mode de vie nomade","Foyer de diffusion"],0,"La fabrication de céramique est une technique."],
["Le filage et le tissage de la laine sont surtout…",["des techniques","des foyers néolithiques","des activités agricoles","des formes de nomadisme"],0,"Filage et tissage sont des techniques."],
["Quelle distinction est la plus juste ?",["Agriculture/élevage = activités ; pierre polie/céramique/filage-tissage = techniques","Agriculture/élevage = techniques ; pierre polie/céramique = activités","Tout cela désigne seulement des techniques","Tout cela désigne seulement des activités"],0,"Il faut distinguer les nouvelles activités des nouvelles techniques."]
];
var letters=["A","B","C","D"];
var questions=[];var answers=[];var current=0;var mailSent=false;var mailSending=false;
function buildQuestions(){questions=[];for(var i=0;i<sourceQuestions.length;i++){var src=sourceQuestions[i];var opts=[];for(var j=0;j<src[1].length;j++){opts.push({text:src[1][j],good:(j===src[2])});}for(var k=opts.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var tmp=opts[k];opts[k]=opts[r];opts[r]=tmp;}var goodIndex=0;for(var m=0;m<opts.length;m++){if(opts[m].good){goodIndex=m;break;}}questions.push({q:src[0],opts:opts,a:goodIndex,e:src[3]});}answers=new Array(questions.length);for(var n=0;n<answers.length;n++){answers[n]=null;}}
function byId(id){return document.getElementById(id);}
function renderQuestion(){var q=questions[current];byId("qnum").innerHTML="Question "+(current+1)+" sur "+questions.length;byId("question").innerHTML=q.q;var box=byId("answers");box.innerHTML="";for(var i=0;i<q.opts.length;i++){var b=document.createElement("button");b.type="button";b.className="choice"+(answers[current]===i?" sel":"");b.setAttribute("data-index",String(i));b.onclick=function(){chooseAnswer(parseInt(this.getAttribute("data-index"),10));};b.innerHTML="<span class='letter'>"+letters[i]+".</span> "+q.opts[i].text;box.appendChild(b);}byId("prevBtn").disabled=(current===0);byId("nextBtn").innerHTML=(current===questions.length-1?"Terminer":"Suivant");byId("bar").style.width=((current/questions.length)*100)+"%";byId("error").className="error hidden";}
function chooseAnswer(i){answers[current]=i;renderQuestion();}
function nextQuestion(){if(answers[current]===null){byId("error").className="error";return false;}if(current<questions.length-1){current=current+1;renderQuestion();window.scrollTo(0,0);return false;}showResult();return false;}
function previousQuestion(){if(current>0){current=current-1;renderQuestion();window.scrollTo(0,0);}return false;}
function totalScore(){var s=0;for(var i=0;i<questions.length;i++){if(answers[i]===questions[i].a){s++;}}return s;}
function resultDetails(){var out=[];for(var i=0;i<questions.length;i++){var q=questions[i];var chosen=(answers[i]===null?"Aucune":q.opts[answers[i]].text);out.push((i+1)+". "+(answers[i]===q.a?"OK":"ERREUR")+" | Anne : "+chosen+" | Bonne réponse : "+q.opts[q.a].text);}return out.join("\n");}
function showResult(){byId("quiz").className="card hidden";byId("result").className="card";byId("bar").style.width="100%";var s=totalScore();byId("score").innerHTML=s+" / 20";byId("message").innerHTML=(s>=18?"Très bien : les points faibles sont désormais bien maîtrisés.":s>=15?"Bon niveau : revois seulement les erreurs.":"Il faut encore consolider ces trois thèmes.");var html="<h3>Correction</h3>";for(var i=0;i<questions.length;i++){var q=questions[i];var ok=(answers[i]===q.a);html+="<div class='review'><b>"+(i+1)+". "+(ok?"✅":"❌")+"</b> "+q.e+(ok?"":"<br><b>Bonne réponse :</b> "+q.opts[q.a].text)+"</div>";}byId("review").innerHTML=html;sendResultMail();}
function sendResultMail(){if(mailSent||mailSending){return;}mailSending=true;byId("mailStatus").innerHTML="Envoi automatique du résultat…";var payload={"_subject":"Examen ciblé Néolithique – Anne : "+totalScore()+"/20","Élève":"Anne","Score":totalScore()+"/20","Détail":resultDetails()};fetch("https://formsubmit.co/ajax/ndt2004@gmail.com",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)}).then(function(r){if(!r.ok){throw new Error("mail");}mailSent=true;byId("mailStatus").innerHTML="✅ Résultat envoyé par e-mail.";}).catch(function(){byId("mailStatus").innerHTML="⚠️ Résultat affiché, mais l’envoi du mail a échoué.";}).then(function(){mailSending=false;});}
function restartQuiz(){mailSent=false;mailSending=false;current=0;buildQuestions();byId("result").className="card hidden";byId("quiz").className="card";byId("mailStatus").innerHTML="";renderQuestion();window.scrollTo(0,0);}
buildQuestions();renderQuestion();
</script>
</body>
</html>
