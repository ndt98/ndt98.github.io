<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calcul astucieux – Anne</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#171717;--muted:#666;--line:#dcdfe4;--ok:#e9f7ed;--bad:#fdecec;--accent:#172033}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:720px;margin:auto;padding:16px 14px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h1{margin:0 0 8px;font-size:25px}.intro{line-height:1.5;color:#444}.rule{background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px;line-height:1.55}.q{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:21px;font-weight:750}.q input{width:125px;max-width:38vw;font-size:20px;padding:10px;text-align:center;border:1px solid #bbb;border-radius:11px;background:#fff}.tip{display:none;margin-top:9px;color:var(--muted);font-size:14px;line-height:1.4}.ok{background:var(--ok);border-color:#9fc9aa}.bad{background:var(--bad);border-color:#e0a0a0}button{width:100%;border:0;border-radius:13px;padding:14px 15px;margin-top:9px;font-size:18px;font-weight:800;background:var(--accent);color:#fff}button.secondary{background:#e7eaf0;color:#111}#result{display:none}.small{font-size:14px;color:var(--muted)}@media(max-width:430px){.q{font-size:19px}.q input{width:105px}}</style></head><body><main><section class="card"><h1>Calcul astucieux – Anne</h1><div class="intro">Calcule sans poser l’opération. Le but est de repérer les nombres qui vont bien ensemble.</div><div class="rule"><b>Deux idées :</b><br>• dans un produit, on peut changer l’ordre et regrouper : 2 × 5 × 37 = 10 × 37<br>• avec un facteur commun : 14 × 5 + 14 × 4 = 14 × (5 + 4)</div></section><section id="result" class="card"></section><form id="quiz"></form><button type="button" id="correct">Corriger</button><button type="button" id="again" class="secondary">Nouvelle série</button></main><script>const EMAIL='ndt2004@gmail.com';const quiz=document.getElementById('quiz'),result=document.getElementById('result');let questions=[],sent=false,locked=false;const bank=[{q:'2 × 5 × 37',a:370,t:'Regroupe 2 × 5 = 10, puis 10 × 37.'},{q:'4 × 25 × 13',a:1300,t:'Regroupe 4 × 25 = 100, puis 100 × 13.'},{q:'5 × 2 × 46',a:460,t:'Regroupe 5 × 2 = 10, puis 10 × 46.'},{q:'20 × 5 × 7',a:700,t:'Regroupe 20 × 5 = 100, puis 100 × 7.'},{q:'8 × 125 × 3',a:3000,t:'Regroupe 8 × 125 = 1000, puis 1000 × 3.'},{q:'25 × 4 × 16',a:1600,t:'Regroupe 25 × 4 = 100, puis 100 × 16.'},{q:'14 × 5 + 14 × 4',a:126,t:'Factorise 14 : 14 × (5 + 4) = 14 × 9.'},{q:'18 × 7 + 18 × 3',a:180,t:'Factorise 18 : 18 × (7 + 3) = 18 × 10.'},{q:'25 × 12 + 25 × 8',a:500,t:'Factorise 25 : 25 × (12 + 8) = 25 × 20.'},{q:'17 × 9 + 17',a:170,t:'Écris 17 comme 17 × 1 : 17 × (9 + 1).'},{q:'32 × 6 − 32',a:160,t:'Écris 32 comme 32 × 1 : 32 × (6 − 1).'},{q:'15 × 11 − 15',a:150,t:'Factorise 15 : 15 × (11 − 1) = 15 × 10.'},{q:'24 × 6 + 24 × 4',a:240,t:'Factorise 24 : 24 × (6 + 4) = 24 × 10.'},{q:'7 × 18 + 3 × 18',a:180,t:'Factorise 18 : (7 + 3) × 18 = 10 × 18.'},{q:'48 × 5 + 48 × 5',a:480,t:'Factorise 48 : 48 × (5 + 5) = 48 × 10.'},{q:'36 × 12 − 36 × 2',a:360,t:'Factorise 36 : 36 × (12 − 2) = 36 × 10.'}];function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){questions=shuffled(bank).slice(0,10);quiz.innerHTML='';result.style.display='none';sent=false;locked=false;questions.forEach((x,i)=>{quiz.insertAdjacentHTML('beforeend','<section class="card" id="c'+i+'"><div class="q"><span>'+x.q+' =</span><input type="number" inputmode="numeric" id="a'+i+'" aria-label="Réponse"></div><div id="s'+i+'"></div><div class="tip" id="t'+i+'">Astuce : '+x.t+'</div></section>')})}async function send(score,details){if(sent)return;sent=true;try{const r=await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Calcul astucieux – Anne – '+score+'/10','Élève':'Anne','Score':score+'/10','Détail':details})});if(!r.ok)throw new Error('mail')}catch(e){}}document.getElementById('correct').onclick=()=>{if(locked)return;locked=true;let score=0,details=[];questions.forEach((x,i)=>{const input=document.getElementById('a'+i),card=document.getElementById('c'+i),sol=document.getElementById('s'+i),tip=document.getElementById('t'+i),v=input.value.trim();if(v!==''&&Number(v)===x.a){score++;card.classList.add('ok');sol.textContent='Juste.'}else{card.classList.add('bad');sol.textContent='Réponse : '+x.a}tip.style.display='block';input.disabled=true;details.push(x.q+' = '+(v===''?'—':v)+' ; attendu '+x.a)});result.style.display='block';result.innerHTML='<h2>'+score+' / 10</h2><p>'+(score===10?'Excellent : les regroupements et la distributivité sont bien compris.':score>=8?'Très bien. Refaire une série pour automatiser les réflexes.':'Regarde surtout les astuces sous les erreurs puis refais une série.')+'</p><p class="small">Résultat envoyé par e-mail.</p>';send(score,details.join('\n'));scrollTo({top:0,behavior:'smooth'})};document.getElementById('again').onclick=render;render();</script></body></html>
