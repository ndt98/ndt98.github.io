<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calcul astucieux facile – Anne</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#171717;--muted:#666;--line:#dcdfe4;--ok:#e9f7ed;--bad:#fdecec;--accent:#172033}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:720px;margin:auto;padding:16px 14px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h1{margin:0 0 8px;font-size:25px}.intro{line-height:1.5;color:#444}.rule{background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px;line-height:1.55}.q{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:21px;font-weight:750}.q input{width:125px;max-width:38vw;font-size:20px;padding:10px;text-align:center;border:1px solid #bbb;border-radius:11px;background:#fff}.tip{display:none;margin-top:9px;color:var(--muted);font-size:14px;line-height:1.4}.ok{background:var(--ok);border-color:#9fc9aa}.bad{background:var(--bad);border-color:#e0a0a0}button{width:100%;border:0;border-radius:13px;padding:14px 15px;margin-top:9px;font-size:18px;font-weight:800;background:var(--accent);color:#fff}button.secondary{background:#e7eaf0;color:#111}#result{display:none}.small{font-size:14px;color:var(--muted)}@media(max-width:430px){.q{font-size:19px}.q input{width:105px}}</style></head><body><main><section class="card"><h1>Calcul astucieux – Anne</h1><div class="intro">Version plus simple. Le but est juste de repérer deux nombres faciles à regrouper.</div><div class="rule"><b>Deux réflexes :</b><br>• 2 × 5 = 10 et 4 × 25 = 100<br>• avec le même nombre répété : 12 × 6 + 12 × 4 = 12 × (6 + 4)</div></section><section id="result" class="card"></section><form id="quiz"></form><button type="button" id="correct">Corriger</button><button type="button" id="again" class="secondary">Nouvelle série</button></main><script>const EMAIL='ndt2004@gmail.com';const quiz=document.getElementById('quiz'),result=document.getElementById('result');let questions=[],sent=false,locked=false;const bank=[{q:'2 × 5 × 7',a:70,t:'Commence par 2 × 5 = 10.'},{q:'2 × 5 × 12',a:120,t:'Commence par 2 × 5 = 10.'},{q:'5 × 2 × 9',a:90,t:'Regroupe 5 × 2 = 10.'},{q:'4 × 25 × 3',a:300,t:'Regroupe 4 × 25 = 100.'},{q:'25 × 4 × 6',a:600,t:'Regroupe 25 × 4 = 100.'},{q:'10 × 3 × 4',a:120,t:'Calcule 10 × 3 = 30, puis × 4.'},{q:'12 × 6 + 12 × 4',a:120,t:'12 × (6 + 4) = 12 × 10.'},{q:'8 × 7 + 8 × 3',a:80,t:'8 × (7 + 3) = 8 × 10.'},{q:'15 × 2 + 15 × 3',a:75,t:'15 × (2 + 3) = 15 × 5.'},{q:'9 × 6 + 9 × 4',a:90,t:'9 × (6 + 4) = 9 × 10.'},{q:'7 × 5 + 7 × 5',a:70,t:'7 × (5 + 5) = 7 × 10.'},{q:'6 × 8 + 6 × 2',a:60,t:'6 × (8 + 2) = 6 × 10.'},{q:'11 × 7 + 11 × 3',a:110,t:'11 × (7 + 3) = 11 × 10.'},{q:'20 × 5 × 2',a:200,t:'20 × 5 = 100, puis × 2.'}];function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){questions=shuffled(bank).slice(0,10);quiz.innerHTML='';result.style.display='none';sent=false;locked=false;questions.forEach((x,i)=>{quiz.insertAdjacentHTML('beforeend','<section class="card" id="c'+i+'"><div class="q"><span>'+x.q+' =</span><input type="number" inputmode="numeric" id="a'+i+'" aria-label="Réponse"></div><div id="s'+i+'"></div><div class="tip" id="t'+i+'">Astuce : '+x.t+'</div></section>')})}async function send(score,details){if(sent)return;sent=true;try{const r=await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Calcul astucieux facile – Anne – '+score+'/10','Élève':'Anne','Score':score+'/10','Détail':details})});if(!r.ok)throw new Error('mail')}catch(e){}}document.getElementById('correct').onclick=()=>{if(locked)return;locked=true;let score=0,details=[];questions.forEach((x,i)=>{const input=document.getElementById('a'+i),card=document.getElementById('c'+i),sol=document.getElementById('s'+i),tip=document.getElementById('t'+i),v=input.value.trim();if(v!==''&&Number(v)===x.a){score++;card.classList.add('ok');sol.textContent='Juste.'}else{card.classList.add('bad');sol.textContent='Réponse : '+x.a}tip.style.display='block';input.disabled=true;details.push(x.q+' = '+(v===''?'—':v)+' ; attendu '+x.a)});result.style.display='block';result.innerHTML='<h2>'+score+' / 10</h2><p>'+(score===10?'Très bien : les regroupements simples sont acquis.':score>=8?'Bien. Refais une série pour automatiser les réflexes.':'Regarde les astuces sous les erreurs et refais une série tranquillement.')+'</p><p class="small">Résultat envoyé par e-mail.</p>';send(score,details.join('\n'));scrollTo({top:0,behavior:'smooth'})};document.getElementById('again').onclick=render;render();</script></body></html>
