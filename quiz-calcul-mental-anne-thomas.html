<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul mental Anne et Thomas</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#171717}main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700;gap:12px}.q input{width:110px;font-size:20px;padding:9px;text-align:center;border:1px solid #bbb;border-radius:10px}.tip{font-size:14px;color:#666;margin-top:8px;display:none}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:700;background:#172033;color:#fff;margin-top:10px}.ok{background:#e9f7ed}.bad{background:#fdecec}#result{display:none}.rules{line-height:1.55;color:#444}</style></head><body><main><div class="card"><h1>Calcul mental</h1><p>Anne & Thomas — 10 calculs simples, une seule opération.</p><div class="rules"><b>Astuces à automatiser :</b><br>+9 = +10 puis −1<br>−9 = −10 puis +1<br>×2 = doubler<br>×5 = ×10 puis ÷2<br>÷2 = prendre la moitié<br>÷5 = ÷10 puis ×2<br>÷10 = déplacer la virgule d’un rang</div></div><div id="result" class="card"></div><form id="quiz"></form><button type="button" id="correct">Corriger</button><button type="button" id="again">Nouvelle série</button></main><script>const q=document.getElementById('quiz'),r=document.getElementById('result');let questions=[];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function addRound(){let a=rnd(20,90),b=[9,19,20,30][rnd(0,3)];return [a+' + '+b,a+b,b===9?'+9 = +10 puis −1':b===19?'+19 = +20 puis −1':'Ajouter les dizaines d’abord']}function subRound(){let b=[9,19,20,30][rnd(0,3)],a=rnd(Math.max(50,b+10),150);return [a+' − '+b,a-b,b===9?'−9 = −10 puis +1':b===19?'−19 = −20 puis +1':'Retirer les dizaines d’abord']}function mulSimple(){let m=[2,5,10][rnd(0,2)],a=rnd(3,20);let tip=m===2?'×2 = doubler':m===5?'×5 = ×10 puis ÷2':'×10 = ajouter un zéro';return [a+' × '+m,a*m,tip]}function divSimple(){let d=[2,5,10][rnd(0,2)],res=rnd(2,20),a=d*res;let tip=d===2?'÷2 = prendre la moitié':d===5?'÷5 = ÷10 puis ×2':'÷10 = enlever un zéro';return [a+' ÷ '+d,res,tip]}function make(){questions=[addRound(),addRound(),addRound(),subRound(),subRound(),subRound(),mulSimple(),mulSimple(),divSimple(),divSimple()].sort(()=>Math.random()-.5);q.innerHTML='';r.style.display='none';questions.forEach((x,i)=>{q.insertAdjacentHTML('beforeend','<div class="card" id="c'+i+'"><div class="q"><span>'+x[0]+' =</span><input inputmode="numeric" type="number" id="a'+i+'"></div><div id="s'+i+'"></div><div class="tip" id="t'+i+'">Astuce : '+x[2]+'</div></div>')})}document.getElementById('correct').onclick=()=>{let score=0;questions.forEach((x,i)=>{let v=document.getElementById('a'+i).value,c=document.getElementById('c'+i),s=document.getElementById('s'+i),t=document.getElementById('t'+i);if(v!==''&&Number(v)===x[1]){score++;c.classList.add('ok');s.textContent='Juste'}else{c.classList.add('bad');s.textContent='Réponse : '+x[1]}t.style.display='block'});r.style.display='block';r.innerHTML='<h2>'+score+' / 10</h2><p>'+(score===10?'Parfait. Refaire une série pour gagner en vitesse.':score>=8?'Très bien. Encore une série pour automatiser les astuces.':'Refaire tranquillement les astuces affichées sous les erreurs.')+'</p>';scrollTo({top:0,behavior:'smooth'})};document.getElementById('again').onclick=make;make();</script></body></html>
