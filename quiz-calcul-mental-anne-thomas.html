<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul mental Anne et Thomas</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#171717}main{max-width:680px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700}.q input{width:110px;font-size:20px;padding:9px;text-align:center;border:1px solid #bbb;border-radius:10px}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:700;background:#172033;color:white;margin-top:10px}.ok{background:#e9f7ed}.bad{background:#fdecec}#result{display:none}</style></head><body><main><div class="card"><h1>Calcul mental</h1><p>Anne & Thomas — 10 calculs, une seule opération par question. Sans calculatrice.</p></div><div id="result" class="card"></div><form id="quiz"></form><button type="button" id="correct">Corriger</button><button type="button" id="again">Nouvelle série</button></main><script>const q=document.getElementById('quiz'),r=document.getElementById('result');let questions=[];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function add(){let a=rnd(25,350),b=rnd(12,150);return [a+' + '+b,a+b]}function sub(){let a=rnd(70,500),b=rnd(12,180);if(b>a)[a,b]=[b,a];return [a+' − '+b,a-b]}function mul(){let a=rnd(6,19),b=rnd(3,12);return [a+' × '+b,a*b]}function div(){let b=rnd(2,12),c=rnd(3,25);return [b*c+' ÷ '+b,c]}function make(){questions=[add(),add(),add(),sub(),sub(),sub(),mul(),mul(),div(),div()].sort(()=>Math.random()-.5);q.innerHTML='';r.style.display='none';questions.forEach((x,i)=>{q.insertAdjacentHTML('beforeend','<div class="card" id="c'+i+'"><div class="q"><span>'+(i+1)+'. '+x[0]+' =</span><input inputmode="numeric" type="number" id="a'+i+'"></div><div id="s'+i+'"></div></div>')})}document.getElementById('correct').onclick=()=>{let score=0;questions.forEach((x,i)=>{let v=document.getElementById('a'+i).value,c=document.getElementById('c'+i),s=document.getElementById('s'+i);if(v!==''&&Number(v)===x[1]){score++;c.classList.add('ok');s.textContent='Juste'}else{c.classList.add('bad');s.textContent='Réponse : '+x[1]}});r.style.display='block';r.innerHTML='<h2>'+score+' / 10</h2><p>'+(score===10?'Excellent. Refais une nouvelle série en essayant d’aller plus vite.':'Refais une nouvelle série pour automatiser les calculs.')+'</p>';scrollTo({top:0,behavior:'smooth'})};document.getElementById('again').onclick=make;make();</script></body></html>
