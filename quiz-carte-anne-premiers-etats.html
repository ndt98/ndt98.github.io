<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne – Placement sur carte</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4efe7;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.4rem;margin:0 0 6px}.muted{color:#6b625b;line-height:1.45}.prompt{font-size:1.25rem;font-weight:850;text-align:center;margin:10px 0 12px}
.progress{font-size:.9rem;color:#6b625b;text-align:center}.mapWrap{border:1px solid #d9cec3;border-radius:16px;overflow:hidden;background:#dcecf4}
svg{display:block;width:100%;height:auto;touch-action:manipulation}.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:850;margin-top:10px}
.primary{background:#765035;color:#fff}.secondary{background:#eee7df;color:#2d2723}.btn:disabled{opacity:.45}.hidden{display:none!important}
.score{text-align:center;font-size:3rem;font-weight:900;margin:8px 0}.review{border-top:1px solid #eadfd5;padding:14px 0;line-height:1.45}
.reviewQ{font-weight:800;margin-bottom:5px}.ok{color:#17632e;font-weight:800}.bad{color:#8a2020;font-weight:800}
.legend{display:flex;gap:12px;justify-content:center;font-size:.85rem;color:#5e554e;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Histoire 6e – Placement sur carte</h1>
<div class="muted">Repères demandés par la fiche : Mésopotamie, Égypte, mer Rouge, mer Méditerranée, Nil, Euphrate, Tigre.</div>
</section>

<section class="card" id="play">
<div class="progress" id="progress"></div>
<div class="prompt" id="prompt"></div>
<div class="mapWrap">
<svg id="map" viewBox="0 0 600 520" aria-label="Carte du Proche-Orient et de l'Égypte">
  <rect x="0" y="0" width="600" height="520" fill="#dcecf4"/>
  <!-- Afrique du Nord / Egypte / Arabie -->
  <path d="M0 290 L70 278 L120 282 L145 300 L160 330 L178 365 L198 395 L220 430 L250 470 L285 520 L600 520 L600 245 L540 235 L490 220 L450 205 L410 195 L370 182 L335 170 L300 160 L270 155 L245 165 L225 185 L210 215 L198 250 L185 285 L170 310 L150 305 L120 292 L70 300 Z"
        fill="#efe6c8" stroke="#6f6a5d" stroke-width="2"/>
  <!-- Anatolie / Levant -->
  <path d="M55 55 L245 40 L330 55 L390 80 L430 110 L445 140 L420 160 L390 168 L355 170 L320 162 L292 150 L270 145 L250 150 L225 165 L205 190 L190 225 L180 260 L168 285 L150 294 L120 285 L95 275 L75 260 L60 235 L48 200 L45 160 L48 115 Z"
        fill="#efe6c8" stroke="#6f6a5d" stroke-width="2"/>
  <!-- golfe persique -->
  <path d="M455 198 C490 205 525 218 560 235 C540 250 515 255 485 250 C468 235 458 217 455 198 Z" fill="#dcecf4" stroke="#6f6a5d" stroke-width="2"/>
  <!-- Mer Rouge -->
  <path d="M184 315 C205 326 220 345 232 370 C244 395 258 430 278 470 C254 456 235 438 220 415 C202 387 190 354 184 315 Z"
        fill="#dcecf4" stroke="#6f6a5d" stroke-width="2"/>
  <!-- Sinai -->
  <path d="M155 300 L188 318 L170 352 L145 330 Z" fill="#efe6c8" stroke="#6f6a5d" stroke-width="2"/>
  <!-- Nil -->
  <path d="M150 465 C150 420 148 385 145 350 C143 325 145 305 150 286" fill="none" stroke="#2e7dab" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 286 C142 272 134 260 125 250 M150 286 C157 272 166 260 176 250" fill="none" stroke="#2e7dab" stroke-width="4" stroke-linecap="round"/>
  <!-- Euphrate -->
  <path d="M330 70 C318 98 312 126 322 150 C336 178 354 204 385 230" fill="none" stroke="#2e7dab" stroke-width="6" stroke-linecap="round"/>
  <!-- Tigre -->
  <path d="M395 65 C390 95 392 126 405 152 C420 178 438 205 458 232" fill="none" stroke="#2e7dab" stroke-width="6" stroke-linecap="round"/>
  <!-- croissant fertile discret -->
  <path d="M155 285 C190 220 220 170 270 145 C320 115 390 120 465 220" fill="none" stroke="#9cad68" stroke-width="24" opacity=".18" stroke-linecap="round"/>
  <!-- north -->
  <path d="M540 75 L540 120" stroke="#222" stroke-width="3"/><path d="M540 60 L530 78 L550 78 Z" fill="#222"/>
  <text x="540" y="50" text-anchor="middle" font-size="18" font-weight="700">N</text>
  <g id="tapMarker"></g>
  <g id="correctionLayer"></g>
</svg>
</div>
<div class="legend"><span><span class="dot" style="background:#b44a3c"></span>ton placement</span><span><span class="dot" style="background:#2e7d32"></span>bonne zone au corrigé</span></div>
<button class="btn primary" id="validate" type="button" disabled>Valider ce placement</button>
</section>

<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<div class="mapWrap" style="margin-top:14px">
<svg id="resultMap" viewBox="0 0 600 520"></svg>
</div>
<div id="review"></div>
<button class="btn secondary" id="retryWrong" type="button">Refaire uniquement mes erreurs</button>
<button class="btn primary" id="restart" type="button">Recommencer les 7 repères</button>
</section>
</main>

<script>
const baseSvg = document.getElementById("map").innerHTML.replace('<g id="tapMarker"></g>','').replace('<g id="correctionLayer"></g>','');

const targets = [
 {id:"mesopotamie", label:"la Mésopotamie", kind:"circle", x:405,y:165,r:65, desc:"entre les deux grands fleuves, dans la partie orientale du Croissant fertile"},
 {id:"egypte", label:"l’Égypte", kind:"circle", x:150,y:365,r:62, desc:"autour de la vallée du Nil, au nord-est de l’Afrique"},
 {id:"mediterranee", label:"la mer Méditerranée", kind:"circle", x:105,y:225,r:90, desc:"à l’ouest du Proche-Orient et au nord de l’Égypte"},
 {id:"rouge", label:"la mer Rouge", kind:"circle", x:225,y:380,r:55, desc:"à l’est de l’Égypte"},
 {id:"nil", label:"le Nil", kind:"line", pts:[[150,465],[150,420],[148,385],[145,350],[143,325],[145,305],[150,286]], tol:30, desc:"le fleuve qui traverse l’Égypte du sud vers le nord"},
 {id:"euphrate", label:"l’Euphrate", kind:"line", pts:[[330,70],[318,98],[312,126],[322,150],[336,178],[354,204],[385,230]], tol:30, desc:"le fleuve occidental des deux grands fleuves mésopotamiens"},
 {id:"tigre", label:"le Tigre", kind:"line", pts:[[395,65],[390,95],[392,126],[405,152],[420,178],[438,205],[458,232]], tol:30, desc:"le fleuve oriental des deux grands fleuves mésopotamiens"}
];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function segDist(p,a,b){
 const vx=b[0]-a[0], vy=b[1]-a[1], wx=p.x-a[0], wy=p.y-a[1];
 const c1=vx*wx+vy*wy;
 if(c1<=0)return Math.hypot(p.x-a[0],p.y-a[1]);
 const c2=vx*vx+vy*vy;
 if(c2<=c1)return Math.hypot(p.x-b[0],p.y-b[1]);
 const t=c1/c2, px=a[0]+t*vx, py=a[1]+t*vy;
 return Math.hypot(p.x-px,p.y-py);
}
function isCorrect(t,p){
 if(t.kind==="circle") return dist(p,t)<=t.r;
 let d=9999;
 for(let i=0;i<t.pts.length-1;i++) d=Math.min(d,segDist(p,t.pts[i],t.pts[i+1]));
 return d<=t.tol;
}
function targetById(id){return targets.find(t=>t.id===id)}

let order=shuffle(targets.map(t=>t.id));
let idx=0;
let currentPoint=null;
let answers={};
let wrong=[];

const map=document.getElementById("map");
const marker=document.getElementById("tapMarker");
const validate=document.getElementById("validate");

function showQuestion(){
 const t=targetById(order[idx]);
 document.getElementById("progress").textContent="Repère "+(idx+1)+" / "+order.length;
 document.getElementById("prompt").textContent="Place "+t.label+" sur la carte";
 currentPoint=null;
 marker.innerHTML="";
 validate.disabled=true;
}

map.addEventListener("pointerdown",e=>{
 const r=map.getBoundingClientRect();
 const x=(e.clientX-r.left)*600/r.width;
 const y=(e.clientY-r.top)*520/r.height;
 currentPoint={x,y};
 marker.innerHTML='<circle cx="'+x+'" cy="'+y+'" r="10" fill="#b44a3c" stroke="white" stroke-width="3"/>';
 validate.disabled=false;
});

validate.addEventListener("click",()=>{
 if(!currentPoint)return;
 const id=order[idx];
 answers[id]=currentPoint;
 idx++;
 if(idx<order.length) showQuestion();
 else finish();
});

function correctionShape(t){
 if(t.kind==="circle") return '<circle cx="'+t.x+'" cy="'+t.y+'" r="'+Math.min(t.r,45)+'" fill="none" stroke="#2e7d32" stroke-width="5" opacity=".85"/>';
 let pts=t.pts.map(p=>p.join(",")).join(" ");
 return '<polyline points="'+pts+'" fill="none" stroke="#2e7d32" stroke-width="10" opacity=".75" stroke-linecap="round" stroke-linejoin="round"/>';
}

function finish(){
 let score=0; wrong=[];
 let html="<h2>Correction détaillée</h2>";
 order.forEach((id,i)=>{
   const t=targetById(id), p=answers[id], ok=isCorrect(t,p);
   if(ok)score++; else wrong.push(id);
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓ Bon placement':'✗ À revoir')+'</div>'+
         '<div class="reviewQ">Question : place '+t.label+' sur la carte.</div>'+
         '<div><b>Bonne zone :</b> '+t.desc+'.</div></div>';
 });
 document.getElementById("play").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / "+order.length;
 document.getElementById("message").textContent=
   score===7?"Parfait : les 7 repères sont maîtrisés.":
   score>=6?"Très bien : revois seulement le repère manqué.":
   score>=5?"Bon niveau : refais uniquement les erreurs.":
   "Refais les erreurs avant de reprendre les 7 repères.";
 document.getElementById("review").innerHTML=html;
 document.getElementById("retryWrong").style.display=wrong.length?"block":"none";
 drawResultMap();
 window.scrollTo(0,0);
}

function drawResultMap(){
 const rm=document.getElementById("resultMap");
 let overlay="";
 targets.forEach(t=>{
   overlay+=correctionShape(t);
   const p=answers[t.id];
   if(p){
     const ok=isCorrect(t,p);
     overlay+='<circle cx="'+p.x+'" cy="'+p.y+'" r="8" fill="'+(ok?'#2e7d32':'#b44a3c')+'" stroke="white" stroke-width="2"/>';
   }
   const lx=t.kind==="circle"?t.x:t.pts[Math.floor(t.pts.length/2)][0];
   const ly=t.kind==="circle"?t.y:t.pts[Math.floor(t.pts.length/2)][1];
   overlay+='<text x="'+(lx+12)+'" y="'+(ly-10)+'" font-size="16" font-weight="800" fill="#1e3557">'+t.label+'</text>';
 });
 rm.innerHTML=baseSvg+overlay;
}

document.getElementById("retryWrong").addEventListener("click",()=>{
 order=shuffle(wrong.slice()); idx=0; currentPoint=null;
 const kept={}; wrong.forEach(id=>{});
 answers={};
 document.getElementById("result").classList.add("hidden");
 document.getElementById("play").classList.remove("hidden");
 showQuestion(); window.scrollTo(0,0);
});

document.getElementById("restart").addEventListener("click",()=>{
 order=shuffle(targets.map(t=>t.id)); idx=0; currentPoint=null; answers={}; wrong=[];
 document.getElementById("result").classList.add("hidden");
 document.getElementById("play").classList.remove("hidden");
 showQuestion(); window.scrollTo(0,0);
});

showQuestion();
</script>
</body>
</html>
