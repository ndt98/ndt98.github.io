<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thomas géométrie progressif</title><style>body{font-family:Arial;background:#f5f7fb;max-width:720px;margin:auto;padding:14px}.c{background:white;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.o{display:block;padding:9px;border:1px solid #ddd;border-radius:9px;margin:6px 0}.ok{background:#e9f7ed}.bad{background:#fdecec}.e{display:none;color:#666}button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;background:#172033;color:white;font-size:18px}#r{display:none}</style><h1>Géométrie – Thomas</h1><div class=c><b>Étape 1 : consolidation progressive</b><p>Hypoténuse connue → soustraire les carrés. Opposés → égaux. Adjacent sur une droite → 180° − angle.</p></div><div id=r class=c></div><form id=q></form><button id=b type=button>Corriger et envoyer la note</button><button id=n type=button>Nouvelle série</button><script src="quiz-mail-thomas.js"></script><script>const Q=[['N1','Hypoténuse 13 cm, autre côté 5 cm. Côté manquant ?',['12 cm','18 cm','8 cm','√194 cm'],'12 cm','13²−5²=144, donc 12 cm.'],['N1','Un angle vaut 124°. Son opposé par le sommet ?',['124°','56°','62°','90°'],'124°','Opposés par le sommet = égaux.'],['N1','Un angle vaut 124°. Son adjacent ?',['56°','124°','62°','90°'],'56°','180−124=56.'],['N1','Hypoténuse 25 cm, autre côté 7 cm. Côté manquant ?',['24 cm','32 cm','18 cm','√674 cm'],'24 cm','25²−7²=576, donc 24 cm.'],['N2','Angle 122°. Son adjacent puis l’opposé de cet adjacent ?',['58° puis 58°','58° puis 122°','122° puis 58°','122° puis 122°'],'58° puis 58°','Adjacent=58°, puis son opposé vaut aussi 58°.'],['N2','Parallèles+sécante : angle 132°. Son correspondant=A, puis adjacent de A=B.',['A=132°, B=48°','A=48°, B=132°','A=132°, B=132°','A=48°, B=48°'],'A=132°, B=48°','Correspondant=132°, puis adjacent=48°.'],['N2','ABC rectangle en C. AB=29, AC=20. BC ?',['21 cm','49 cm','9 cm','√1241 cm'],'21 cm','BC²=29²−20²=441, donc 21 cm.'],['N2','Angle alterne-interne 67°. Angle égal=A, puis adjacent=B.',['A=67°, B=113°','A=113°, B=67°','A=67°, B=67°','A=113°, B=113°'],'A=67°, B=113°','A=67°, B=180−67=113°.'],['N3','Angles adjacents : (4x+10)° et (2x+20)°. x ?',['25','20','30','15'],'25','6x+30=180, donc x=25.'],['N3','Angles opposés : (5x−8)° et (3x+28)°. x ?',['18','20','16','14'],'18','Ils sont égaux, donc x=18.']];let L=false;function sh(a){return [...a].sort(()=>Math.random()-.5)}function draw(){q.innerHTML='';r.style.display='none';L=false;Q.forEach((x,i)=>{let d=document.createElement('div');d.className='c';d.id='c'+i;d.innerHTML='<b>'+x[0]+'</b><p>'+x[1]+'</p>';sh(x[2]).forEach(v=>{let z=document.createElement('label');z.className='o';z.innerHTML='<input type=radio name=x'+i+'> '+v;z.firstChild.value=v;d.appendChild(z)});let e=document.createElement('div');e.className='e';e.textContent=x[4];d.appendChild(e);q.appendChild(d)})}b.onclick=()=>{if(L)return;L=true;let s=0,d=[];Q.forEach((x,i)=>{let c=document.getElementById('c'+i),a=c.querySelector('input:checked'),v=a?a.value:'—';c.querySelectorAll('.o').forEach(o=>{if(o.firstChild.value===x[3])o.classList.add('ok')});if(v===x[3])s++;else if(a)a.parentNode.classList.add('bad');c.querySelector('.e').style.display='block';d.push(x[0]+' | '+x[1]+' | réponse Thomas : '+v+' | attendu : '+x[3])});r.style.display='block';r.innerHTML='<h2>'+s+'/10</h2><p>'+(s===10?'Étape 1 maîtrisée : on pourra monter le niveau.':s>=8?'Très bien, encore une série pour automatiser.':'On reste sur cette étape pour consolider.')+'</p><p>Résultat envoyé par e-mail.</p>';if(window.sendThomasQuiz)window.sendThomasQuiz(s,d.join('\n'));scrollTo(0,0)};n.onclick=draw;draw();</script>
