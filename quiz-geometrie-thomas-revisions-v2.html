<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Révisions géométrie – Thomas – niveau difficile</title><style>:root{--bg:#f5f7fb;--card:#fff;--line:#d9dee6;--text:#17191d;--muted:#646b75;--accent:#172033;--ok:#eaf7ed;--bad:#fdecec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:760px;margin:auto;padding:16px 14px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.qtext{font-size:19px;font-weight:760;line-height:1.42}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;background:#fff;font-size:17px}.option input{margin-right:8px;transform:scale(1.15)}.correct{background:var(--ok)}.incorrect{background:var(--bad)}.explain{display:none;margin-top:10px;color:var(--muted);font-size:14px}.actions{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(to top,var(--bg) 75%,rgba(245,247,251,0))}button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:800;background:var(--accent);color:#fff;margin-top:8px}.secondary{background:#e5e9ef;color:#111}#result{display:none;border:2px solid var(--accent)}#mail{margin-top:10px;font-size:14px;color:var(--muted)}#retryMail{display:none}</style></head><body><main>
<section class="card"><h1>Révisions géométrie – Thomas</h1><p><b>Niveau difficile.</b> 10 questions aléatoires : Pythagore, réciproque/contraposée et angles.</p><p><b>Méthode :</b> identifier l’hypoténuse, comparer les carrés, puis appliquer les propriétés d’angles avant de calculer.</p></section>
<section id="result" class="card"><h2 id="score"></h2><p id="feedback"></p><div id="mail"></div><button type="button" id="retryMail" class="secondary">Renvoyer la note par e-mail</button></section>
<form id="quiz"></form><div class="actions"><button type="button" id="correctBtn">Corriger et envoyer la note</button><button type="button" id="againBtn" class="secondary">Nouvelle série</button></div>
<script>
const EMAIL='ndt2004@gmail.com';
const STABLE_FORM_URL='https://ndt98.github.io/quiz-calcul-mental-anne-thomas.html';
const bank=[
{q:'ABC est rectangle en A. AB = 7,2 cm et AC = 9,6 cm. Quelle est la longueur BC ?',c:['12 cm','16,8 cm','8,4 cm','14,4 cm'],a:'12 cm',e:'BC² = 7,2² + 9,6² = 144, donc BC = 12 cm.'},
{q:'ABC est rectangle en C. AB = 17 cm et AC = 8 cm. Quelle est la longueur BC ?',c:['15 cm','9 cm','25 cm','√353 cm'],a:'15 cm',e:'AB est l’hypoténuse. BC² = 17² − 8² = 225, donc BC = 15 cm.'},
{q:'Un triangle rectangle a pour hypoténuse 13 cm et un côté de 5 cm. L’autre côté mesure…',c:['12 cm','8 cm','18 cm','√194 cm'],a:'12 cm',e:'x² = 13² − 5² = 144, donc x = 12 cm.'},
{q:'Un triangle rectangle a pour côtés de l’angle droit 11 cm et 60 cm. Son hypoténuse mesure…',c:['61 cm','71 cm','49 cm','√3481 cm'],a:'61 cm',e:'11² + 60² = 3721 = 61².'},
{q:'Un triangle a pour côtés 7 cm, 24 cm et 25 cm. Quelle conclusion est correcte ?',c:['Il est rectangle, par la réciproque de Pythagore','Il n’est pas rectangle, par la contraposée','On ne peut pas conclure','Il est rectangle car 7 + 24 = 31'],a:'Il est rectangle, par la réciproque de Pythagore',e:'25² = 625 et 7² + 24² = 625.'},
{q:'Un triangle a pour côtés 8 cm, 15 cm et 16 cm. Quelle conclusion est correcte ?',c:['Il n’est pas rectangle, par la contraposée','Il est rectangle, par la réciproque','On ne peut pas conclure','Il est rectangle car 8 + 15 > 16'],a:'Il n’est pas rectangle, par la contraposée',e:'16² = 256 alors que 8² + 15² = 289.'},
{q:'Un triangle a pour côtés 6,5 cm, 7,2 cm et 9,7 cm. Est-il rectangle ?',c:['Oui','Non','Impossible à déterminer','Seulement si 7,2 cm est l’hypoténuse'],a:'Oui',e:'9,7² = 94,09 et 6,5² + 7,2² = 94,09.'},
{q:'ABC a pour côtés AB = 9 cm, AC = 12 cm et BC = 15 cm. En quel sommet est-il rectangle ?',c:['En A','En B','En C','Il n’est pas rectangle'],a:'En A',e:'BC est l’hypoténuse car 15² = 9² + 12² ; elle est opposée à A.'},
{q:'DEF a pour côtés DE = 7 cm, EF = 24 cm et DF = 25 cm. En quel sommet est-il rectangle ?',c:['En E','En D','En F','Il n’est pas rectangle'],a:'En E',e:'DF est l’hypoténuse ; elle est opposée au sommet E.'},
{q:'Pour tester un triangle de côtés 10 cm, 24 cm et 26 cm, quelle égalité faut-il vérifier ?',c:['26² = 10² + 24²','24² = 10² + 26²','10² = 24² + 26²','26 = 10 + 24'],a:'26² = 10² + 24²',e:'On place le carré du plus grand côté seul.'},
{q:'Un triangle a deux angles de 47° et 68°. Le troisième mesure…',c:['65°','75°','55°','115°'],a:'65°',e:'180° − 47° − 68° = 65°.'},
{q:'Dans un triangle rectangle, un angle aigu mesure 37°. L’autre angle aigu mesure…',c:['53°','143°','63°','47°'],a:'53°',e:'Les deux angles aigus sont complémentaires : 90° − 37° = 53°.'},
{q:'Un triangle isocèle a un angle au sommet de 38°. Chacun des deux autres angles mesure…',c:['71°','76°','142°','52°'],a:'71°',e:'(180° − 38°) ÷ 2 = 71°.'},
{q:'Deux angles sont complémentaires. L’un mesure 27°. L’autre mesure…',c:['63°','153°','73°','117°'],a:'63°',e:'90° − 27° = 63°.'},
{q:'Deux angles sont supplémentaires. L’un mesure 127°. L’autre mesure…',c:['53°','63°','37°','233°'],a:'53°',e:'180° − 127° = 53°.'},
{q:'Deux droites se coupent. Un angle mesure 112°. L’angle opposé par le sommet mesure…',c:['112°','68°','90°','248°'],a:'112°',e:'Les angles opposés par le sommet sont égaux.'},
{q:'Deux droites se coupent. Un angle mesure 112°. Un angle adjacent mesure…',c:['68°','112°','56°','78°'],a:'68°',e:'180° − 112° = 68°.'},
{q:'Deux droites parallèles sont coupées par une sécante. Un angle alterne-interne vaut 64°. Son alterne-interne vaut…',c:['64°','116°','32°','90°'],a:'64°',e:'Les angles alternes-internes sont égaux.'},
{q:'Deux droites parallèles sont coupées par une sécante. Un angle correspondant vaut 118°. Un angle adjacent vaut…',c:['62°','118°','72°','28°'],a:'62°',e:'180° − 118° = 62°.'},
{q:'Deux droites coupées par une sécante forment deux angles alternes-internes égaux à 73°. Conclusion ?',c:['Les droites sont parallèles','Les droites sont perpendiculaires','Aucune conclusion','Les angles sont complémentaires'],a:'Les droites sont parallèles',e:'Des angles alternes-internes égaux permettent de conclure au parallélisme.'},
{q:'Deux droites coupées par une sécante forment deux angles correspondants égaux à 121°. Conclusion ?',c:['Les droites sont parallèles','Les droites sont perpendiculaires','On ne peut pas conclure','Les angles sont supplémentaires'],a:'Les droites sont parallèles',e:'Des angles correspondants égaux permettent de conclure au parallélisme.'},
{q:'On sait que XY² = XZ² + YZ². Quelle conclusion est correcte ?',c:['XYZ est rectangle en Z','XYZ est rectangle en X','XYZ est rectangle en Y','On ne peut rien conclure'],a:'XYZ est rectangle en Z',e:'XY est l’hypoténuse, donc l’angle droit est en Z.'},
{q:'On sait que AB² ≠ AC² + BC² et que AB est le plus grand côté. Conclusion ?',c:['ABC n’est pas rectangle','ABC est rectangle en C','ABC est rectangle en B','ABC est isocèle'],a:'ABC n’est pas rectangle',e:'Le carré du plus grand côté n’est pas égal à la somme des deux autres : contraposée de Pythagore.'}
];
const quiz=document.getElementById('quiz'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),feedback=document.getElementById('feedback'),mail=document.getElementById('mail'),retryMail=document.getElementById('retryMail');
let questions=[],locked=false,lastScore=null,lastDetails='';
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newSeries(){questions=shuffle(bank).slice(0,10);locked=false;lastScore=null;lastDetails='';quiz.innerHTML='';result.style.display='none';retryMail.style.display='none';questions.forEach((item,i)=>{const card=document.createElement('section');card.className='card';card.id='card'+i;const p=document.createElement('p');p.className='qtext';p.textContent=item.q;card.appendChild(p);shuffle(item.c).forEach(choice=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=choice;label.appendChild(input);const span=document.createElement('span');span.textContent=choice;label.appendChild(span);card.appendChild(label)});const ex=document.createElement('div');ex.className='explain';ex.textContent=item.e;card.appendChild(ex);quiz.appendChild(card)})}
async function sendMail(score,details){mail.textContent='Envoi de la note par e-mail…';retryMail.style.display='none';try{const r=await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Géométrie difficile – Thomas – '+score+'/10','Élève':'Thomas','Thème':'Pythagore et angles – niveau difficile','Score':score+'/10','Détail':details,'_url':STABLE_FORM_URL})});const data=await r.json().catch(()=>({}));if(!r.ok || !(data.success===true || data.success==='true'))throw new Error(data.message||'Envoi non confirmé');mail.textContent='✅ FormSubmit a confirmé l’envoi de la note.';}catch(e){mail.textContent='⚠️ Envoi non confirmé. Appuie sur « Renvoyer la note par e-mail ».';retryMail.style.display='block';}}
retryMail.onclick=()=>{if(lastScore!==null)sendMail(lastScore,lastDetails)};
document.getElementById('correctBtn').onclick=()=>{if(locked)return;locked=true;let score=0,details=[];questions.forEach((item,i)=>{const card=document.getElementById('card'+i),opts=card.querySelectorAll('.option'),sel=card.querySelector('input:checked');let chosen='—';opts.forEach(l=>{const inp=l.querySelector('input');if(inp.value===item.a)l.classList.add('correct')});if(sel){chosen=sel.value;if(sel.value===item.a)score++;else sel.closest('.option').classList.add('incorrect')}card.querySelectorAll('input').forEach(x=>x.disabled=true);card.querySelector('.explain').style.display='block';details.push(item.q+' | réponse Thomas : '+chosen+' | attendu : '+item.a)});lastScore=score;lastDetails=details.join('\n');scoreEl.textContent=score+' / 10';feedback.textContent=score>=9?'Excellent niveau.':score>=7?'Bon niveau. Refais une série pour gagner en rapidité et en rigueur.':score>=5?'Les bases sont présentes, mais certains raisonnements restent à consolider.':'Reprendre les méthodes puis refaire une série.';result.style.display='block';sendMail(score,lastDetails);result.scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('againBtn').onclick=newSeries;newSeries();
</script></main></body></html>
