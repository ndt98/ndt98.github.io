<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f7">
<title>Quiz Grammaire – Anne</title>
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#20252b;--muted:#67727d;--accent:#355f7a;--accent2:#e2edf4;--ok:#24753a;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#dfe7ed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted);line-height:1.35}
.progress{height:10px;background:#dde6ec;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.4;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #cad6de;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink);line-height:1.35}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750;min-height:48px}
.secondary{background:#e4ebef;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f5f8fa;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}.actions{flex-direction:column-reverse}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>✏️ Quiz Grammaire – Anne</h1>
<div class="sub">Les classes de mots variables • noms, déterminants, adjectifs, verbes et pronoms • 10 questions</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Dans « Le chat observe les oiseaux puis il les suit », quelle analyse des deux mots « les » est correcte ?",c:["Les deux sont des déterminants","Le premier est un déterminant et le second est un pronom","Le premier est un pronom et le second est un déterminant","Les deux sont des pronoms"],a:1,e:"Le premier « les » accompagne le nom « oiseaux » : c’est un déterminant. Le second remplace « les oiseaux » : c’est un pronom."},
 {q:"Dans « Tu termines ton travail, mais nous terminons le nôtre », pourquoi le verbe « terminer » change-t-il de forme ?",c:["Parce que le sujet change de personne et de nombre","Parce que « travail » est masculin","Parce que le mot placé après le verbe change","Parce que le déterminant change"],a:0,e:"Le verbe s’accorde avec son sujet : « tu » est à la 2e personne du singulier et « nous » à la 1re personne du pluriel."},
 {q:"Complète correctement : « Ces vieilles maisons sont très … » L’adjectif donné est « beau ».",c:["beau","belle","beaux","belles"],a:3,e:"« Maisons » est féminin pluriel : l’adjectif « beau » devient « belles »."},
 {q:"Dans « Je prends leur ballon puis je leur parle », quelle analyse des deux mots « leur » est correcte ?",c:["Le premier est un déterminant et le second est un pronom","Les deux sont des déterminants","Les deux sont des pronoms","Le premier est un pronom et le second est un déterminant"],a:0,e:"Le premier « leur » accompagne le nom « ballon » : c’est un déterminant. Le second représente les personnes auxquelles je parle : c’est un pronom."},
 {q:"Dans « La maîtresse appelle les élèves. Elle les félicite », quels mots de la deuxième phrase sont des pronoms ?",c:["« Elle » seulement","« les » seulement","« Elle » et « les »","« félicite » et « les »"],a:2,e:"« Elle » remplace « la maîtresse » et « les » remplace « les élèves » : ce sont deux pronoms."},
 {q:"Dans « Mes jeunes cousins semblent fatigués », quelle analyse est entièrement correcte ?",c:["« Mes » déterminant ; « cousins » nom ; « jeunes » et « fatigués » adjectifs ; « semblent » verbe","« Mes » pronom ; « cousins » adjectif ; « jeunes » nom ; « semblent » déterminant","« Mes » adjectif ; « cousins » verbe ; « jeunes » déterminant ; « semblent » nom","« Mes » nom ; « cousins » déterminant ; « jeunes » pronom ; « semblent » adjectif"],a:0,e:"« Mes » accompagne le nom « cousins », « jeunes » et « fatigués » le caractérisent, et « semblent » est un verbe d’état conjugué."},
 {q:"Complète correctement : « Mon oncle et ma tante sont très … » L’adjectif donné est « patient ».",c:["patient","patiente","patients","patientes"],a:2,e:"L’adjectif caractérise deux personnes, dont l’une est masculine. Dans la règle scolaire traditionnelle, on écrit donc « patients » au masculin pluriel."},
 {q:"Dans « Les petites filles les regardent », quelle analyse des deux mots « les » est correcte ?",c:["Le premier est un déterminant et le second est un pronom","Les deux sont des déterminants","Les deux sont des pronoms","Le premier est un pronom et le second est un déterminant"],a:0,e:"Le premier « les » accompagne le nom « filles ». Le second ne précède pas un nom : il remplace des personnes ou des choses déjà connues."},
 {q:"Dans « Vous prenez vos manteaux et vous les mettez », quelle affirmation est correcte ?",c:["« Vous » et « les » sont des pronoms, « vos » est un déterminant et « manteaux » est un nom","« Vous » est un déterminant, « vos » un pronom et « manteaux » un adjectif","« Vos » et « les » sont tous les deux des déterminants","« Manteaux » est un adjectif et « mettez » un nom"],a:0,e:"« Vous » est un pronom sujet, « vos » accompagne le nom « manteaux », et « les » remplace « vos manteaux »."},
 {q:"Dans « Cette élève sérieuse range ses cahiers. Elle les ferme soigneusement », quelle analyse réunit correctement les cinq classes étudiées ?",c:["« Cette » déterminant ; « élève » nom ; « sérieuse » adjectif ; « range » verbe ; « Elle » et « les » pronoms","« Cette » pronom ; « élève » adjectif ; « sérieuse » nom ; « range » déterminant ; « Elle » verbe","« Cette » adjectif ; « élève » verbe ; « sérieuse » pronom ; « range » nom ; « les » déterminant","« Cette » nom ; « élève » déterminant ; « sérieuse » verbe ; « range » pronom ; « Elle » adjectif"],a:0,e:"Cette phrase contient bien les cinq classes : déterminant, nom, adjectif, verbe et pronoms."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   } else {
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 } else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()} else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz Grammaire – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"Grammaire – Les classes de mots variables",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques points sont à revoir.":"Il faut encore revoir le cours.";
 $("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
