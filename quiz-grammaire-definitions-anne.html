<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f7">
<title>Quiz Grammaire Définitions – Anne</title>
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#20252b;--muted:#67727d;--accent:#355f7a;--accent2:#e2edf4;--ok:#24753a;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#dfe7ed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted);line-height:1.35}
.progress{height:10px;background:#dde6ec;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.4;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #cad6de;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink);line-height:1.35}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750;min-height:48px}
.secondary{background:#e4ebef;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f5f8fa;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}.actions{flex-direction:column-reverse}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>📘 Quiz Grammaire – Définitions</h1>
<div class="sub">Anne • Les classes de mots variables • 10 questions centrées sur les définitions</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Qu’est-ce qu’un mot variable ?",c:["Un mot dont l’orthographe peut changer","Un mot toujours placé au début d’une phrase","Un mot qui désigne uniquement une personne","Un mot qui ne change jamais"],a:0,e:"Un mot variable peut changer de forme, notamment selon le genre, le nombre, la personne ou le temps."},
 {q:"Quelle définition correspond au nom ?",c:["Il sert à nommer une personne, un animal, une chose, un lieu, un sentiment ou une idée","Il remplace toujours un verbe","Il indique seulement une action","Il accompagne toujours un adjectif"],a:0,e:"Le nom sert à désigner ou nommer ce qui nous entoure ou ce que nous ressentons : personnes, animaux, objets, lieux, sentiments, idées…"},
 {q:"Quelle définition correspond au déterminant ?",c:["Il remplace un nom déjà cité","Il accompagne un nom et apporte des informations comme le genre et le nombre","Il indique uniquement une action","Il donne une précision sur un verbe"],a:1,e:"Le déterminant accompagne le nom. Il aide notamment à connaître son genre et son nombre : le, la, les, un, une, des, ce, cette, mes…"},
 {q:"Quelle définition correspond à l’adjectif ?",c:["Il caractérise un nom ou un pronom en apportant une précision","Il sert uniquement à remplacer un nom","Il se place toujours devant un verbe","Il désigne une personne ou un objet"],a:0,e:"L’adjectif apporte une information ou une précision sur un nom ou un pronom et s’accorde avec lui."},
 {q:"Quelle définition correspond au verbe ?",c:["C’est un mot qui exprime une action ou un état et qui se conjugue","C’est un mot qui accompagne toujours un nom","C’est un mot qui remplace un groupe nominal","C’est un mot qui ne varie jamais"],a:0,e:"Le verbe peut exprimer une action ou un état. Sa forme varie notamment selon le temps, la personne et le nombre."},
 {q:"Quelle définition correspond au pronom ?",c:["Il accompagne toujours un nom","Il remplace un nom ou un groupe de mots pour éviter une répétition","Il indique obligatoirement une action","Il précise uniquement la couleur d’un objet"],a:1,e:"Le pronom remplace un nom ou un groupe de mots. Par exemple : « Les élèves arrivent. Ils entrent. »"},
 {q:"Quelles sont les cinq classes de mots variables étudiées dans la leçon ?",c:["Noms, déterminants, adjectifs, verbes et pronoms","Noms, adverbes, prépositions, verbes et conjonctions","Déterminants, adverbes, prépositions, verbes et interjections","Noms, adjectifs, adverbes, prépositions et conjonctions"],a:0,e:"Les cinq classes de mots variables étudiées sont : le nom, le déterminant, l’adjectif, le verbe et le pronom."},
 {q:"Que signifie « l’adjectif s’accorde avec le nom qu’il caractérise » ?",c:["Il prend le même genre et le même nombre que ce nom","Il prend toujours la forme masculine singulière","Il se conjugue comme un verbe","Il remplace le nom dans la phrase"],a:0,e:"L’adjectif varie pour correspondre au genre et au nombre du nom : petit garçon, petite fille, petits garçons, petites filles."},
 {q:"Selon quoi un verbe peut-il varier ?",c:["Selon le genre du nom placé après lui seulement","Selon le temps, la personne et le nombre","Selon la longueur de la phrase","Selon la place du déterminant"],a:1,e:"Le verbe varie en fonction du temps et de son sujet, notamment de la personne et du nombre : je chante, nous chantons, ils chantaient."},
 {q:"Qu’est-ce qu’un verbe d’état ?",c:["Un verbe qui exprime seulement un déplacement","Un verbe qui sert à présenter un état ou une manière d’être du sujet","Un verbe qui remplace un adjectif","Un verbe qui ne peut jamais être conjugué"],a:1,e:"Un verbe d’état indique un état ou une manière d’être du sujet. « Être », « sembler » et « paraître » en sont des exemples."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   } else {
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 } else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()} else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz Grammaire Définitions – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"Grammaire – Définitions des classes de mots variables",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques définitions sont à revoir.":"Il faut encore revoir les définitions du cours.";
 $("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
