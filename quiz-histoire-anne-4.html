<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Quiz Histoire 4 – Anne</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#24211f;--muted:#6e665f;--accent:#865632;--accent2:#f2e2d1;--ok:#24753a;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#e9e0d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted)}
.progress{height:10px;background:#eee5db;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.35;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #d9cec3;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink)}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}
.secondary{background:#eee7df;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f7f4f0;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🏺 Quiz Histoire 4 – Anne</h1>
<div class="sub">Les débuts de l’humanité • 10 nouvelles questions</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Quel événement marque la fin de la Préhistoire ?",c:["La maîtrise du feu","L’apparition de l’écriture","La fabrication des premiers outils","Le début des migrations"],a:1,e:"La Préhistoire se termine avec l’apparition de l’écriture, vers 3500 av. J.-C."},
 {q:"Quel personnage est le plus récent parmi ces trois ?",c:["Toumaï","Lucy","Homo sapiens","Ils ont le même âge"],a:2,e:"Homo sapiens apparaît bien après Toumaï et Lucy, il y a environ 300 000 ans."},
 {q:"Quelle association est correcte ?",c:["Homo habilis → premiers outils en pierre","Homo erectus → invention de l’écriture","Lucy → agriculture","Toumaï → maîtrise du feu"],a:0,e:"Homo habilis est associé à la fabrication des premiers outils en pierre."},
 {q:"Quel mode de vie correspond le mieux aux humains du Paléolithique ?",c:["Ils vivent dans des villes permanentes","Ils se déplacent selon les ressources disponibles","Ils pratiquent surtout l’agriculture","Ils utilisent l’écriture pour commercer"],a:1,e:"Les humains du Paléolithique sont souvent nomades et se déplacent selon les saisons et les ressources."},
 {q:"Pourquoi la maîtrise du feu est-elle importante pour les humains préhistoriques ?",c:["Elle permet notamment de se chauffer, de s’éclairer et de cuire des aliments","Elle permet d’inventer immédiatement l’écriture","Elle remplace tous les outils en pierre","Elle rend les humains sédentaires"],a:0,e:"Le feu apporte notamment chaleur, lumière et cuisson des aliments ; il peut aussi contribuer à la protection du groupe."},
 {q:"Quel type de trace peut être étudié par un archéologue ?",c:["Des outils anciens retrouvés lors de fouilles","Uniquement des textes écrits","Seulement des os de dinosaures","Uniquement des bâtiments encore habités"],a:0,e:"Les archéologues étudient les vestiges du passé, notamment les outils et autres objets découverts lors de fouilles."},
 {q:"Que permet d’affirmer la découverte de fossiles très anciens en Afrique ?",c:["Que l’Afrique est considérée comme le berceau de l’humanité","Que l’écriture est née en Afrique il y a 7 millions d’années","Que tous les humains sont restés en Afrique","Que Lucy est plus ancienne que Toumaï"],a:0,e:"Les plus anciens fossiles d’hominidés et d’humains connus retrouvés en Afrique expliquent l’expression « berceau de l’humanité »."},
 {q:"Parmi ces propositions, laquelle décrit correctement l’art rupestre ?",c:["Des peintures ou gravures sur des parois rocheuses","Des bijoux fabriqués uniquement en métal","Des textes écrits sur papier","Des maisons décorées avec des briques"],a:0,e:"L’art rupestre comprend notamment des peintures et des gravures réalisées sur des parois rocheuses."},
 {q:"Quel enchaînement est chronologiquement correct ?",c:["Lucy → Toumaï → Homo habilis","Toumaï → Lucy → Homo habilis","Homo habilis → Toumaï → Lucy","Homo sapiens → Lucy → Homo erectus"],a:1,e:"Toumaï est le plus ancien, puis vient Lucy, puis Homo habilis."},
 {q:"Qu’est-ce qui distingue surtout un nomade d’un sédentaire ?",c:["Le nomade change régulièrement de lieu de vie","Le nomade ne sait pas fabriquer d’outils","Le nomade ne vit jamais en groupe","Le nomade se nourrit uniquement de viande"],a:0,e:"Un nomade se déplace régulièrement et n’a pas d’habitat fixe permanent."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   }else{
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 }else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()}else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz Histoire 4 – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"Histoire 4 – Les débuts de l’humanité",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques points sont à revoir.":"Il faut encore revoir le cours.";
 $("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
