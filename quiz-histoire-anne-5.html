<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Quiz Histoire 5 – Anne</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#24211f;--muted:#6e665f;--accent:#865632;--accent2:#f2e2d1;--ok:#24753a;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#e9e0d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted)}
.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:#f8f2ea;font-size:.94rem}
.progress{height:10px;background:#eee5db;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.35;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #d9cec3;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink)}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}
.secondary{background:#eee7df;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f7f4f0;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>📚 Quiz Histoire 5 – Anne</h1>
<div class="sub">Définitions + dates à connaître par cœur • 10 questions</div>
<div class="note"><b>Objectif :</b> connaître précisément les définitions et associer chaque hominidé / humain à sa période.</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Quelle est la définition de la Préhistoire ?",c:["La période qui commence avec les premiers humains et se termine avec l’apparition de l’écriture","La période qui commence avec l’écriture et se termine avec l’agriculture","La période réservée à Homo sapiens","La période qui correspond uniquement aux dinosaures"],a:0,e:"La Préhistoire commence avec l’apparition des premiers humains et se termine avec l’apparition de l’écriture, vers 3500 av. J.-C."},
 {q:"Qu’est-ce que le Paléolithique ?",c:["La première et la plus longue période de la Préhistoire","La période qui commence avec l’écriture","La période des premières villes modernes","La dernière période de l’Antiquité"],a:0,e:"Le Paléolithique est la première et la plus longue période de la Préhistoire."},
 {q:"Qu’est-ce qu’un fossile ?",c:["Un reste ou une trace d’un être vivant ancien conservé dans le sol ou la roche","Un objet moderne enterré volontairement","Un dessin réalisé par un archéologue","Une pierre utilisée uniquement pour faire du feu"],a:0,e:"Un fossile est un reste ou une trace d’un être vivant ancien conservé dans le sol ou la roche."},
 {q:"Que signifie « nomade » ?",c:["Une personne qui se déplace régulièrement et n’a pas d’habitat fixe","Une personne qui vit toujours au même endroit","Une personne qui pratique obligatoirement l’agriculture","Une personne qui sait écrire"],a:0,e:"Un nomade se déplace régulièrement et n’a pas d’habitat fixe permanent."},
 {q:"Qu’est-ce que l’art rupestre ?",c:["Des peintures, dessins ou gravures réalisés sur des parois rocheuses","Des outils en pierre taillée","Des textes gravés sur des pièces de monnaie","Des maisons construites dans la roche"],a:0,e:"L’art rupestre correspond notamment aux peintures, dessins et gravures réalisés sur des parois rocheuses."},
 {q:"À quelle période correspond Toumaï ?",c:["Environ 7 millions d’années","Environ 3,2 millions d’années","Environ 2,5 millions d’années","Environ 300 000 ans"],a:0,e:"Toumaï date d’environ 7 millions d’années."},
 {q:"À quelle période correspond Lucy ?",c:["Environ 2 millions d’années","Environ 3,2 millions d’années","Environ 7 millions d’années","Environ 300 000 ans"],a:1,e:"Lucy date d’environ 3,2 millions d’années."},
 {q:"À quelle période apparaît Homo habilis ?",c:["Environ 300 000 ans","Environ 2 millions d’années","Environ 2,5 millions d’années","Environ 7 millions d’années"],a:2,e:"Homo habilis apparaît il y a environ 2,5 millions d’années."},
 {q:"À quelle période apparaît Homo erectus ?",c:["Environ 2 millions d’années","Environ 3,2 millions d’années","Environ 300 000 ans","Environ 7 millions d’années"],a:0,e:"Homo erectus apparaît il y a environ 2 millions d’années."},
 {q:"À quelle période apparaît Homo sapiens ?",c:["Environ 2,5 millions d’années","Environ 2 millions d’années","Environ 300 000 ans","Environ 7 millions d’années"],a:2,e:"Homo sapiens apparaît il y a environ 300 000 ans."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   }else{
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À apprendre par cœur.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 }else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()}else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz Histoire 5 – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"Histoire 5 – Définitions et périodes",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total===10?"Parfait : définitions et dates maîtrisées !":total>=8?"Très bien, revois seulement les erreurs.":total>=6?"Encore quelques définitions ou dates à mémoriser.":"Il faut refaire ce quiz jusqu’à connaître les réponses par cœur.";
 $("review").innerHTML="<h3>À retenir</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
