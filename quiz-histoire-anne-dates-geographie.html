<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne – Dates et géographie</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe7;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px}
.muted{color:#6b625b;line-height:1.45}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee7df;color:#5e554e;font-size:.78rem;font-weight:800;margin-bottom:8px}
.q{padding:16px 0;border-top:1px solid #ece4dc}.q:first-child{border-top:0}
.statement{font-weight:780;line-height:1.42;margin-bottom:10px}
.choices{display:grid;gap:8px}
.choice{border:1px solid #d7cbc0;border-radius:13px;padding:12px;background:#fff;font:inherit;text-align:left}
.choice.selected{background:#ead8c6;border-color:#765035}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:850;margin-top:10px}
.primary{background:#765035;color:#fff}.secondary{background:#eee7df;color:#2d2723}
.hidden{display:none!important}.score{text-align:center;font-size:3rem;font-weight:850;margin:10px 0}
.review{border-top:1px solid #eadfd5;padding:14px 0;line-height:1.45}
.reviewQ{font-weight:800;margin:5px 0 8px}.reviewAns{margin:3px 0}.reviewExp{margin-top:7px;color:#5e554e}
.ok{color:#17632e;font-weight:800}.bad{color:#8a2020;font-weight:800}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Histoire 6e – Dates et géographie</h1>
<div class="muted">Premiers États et premières écritures • 16 questions difficiles</div>
<div class="muted">8 questions de chronologie + 8 questions de repères géographiques. Les formulations sont proches pour éviter les réponses au hasard.</div>
</section>

<section class="card" id="quiz"></section>

<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<button class="btn secondary" id="retryWrong" type="button">Refaire uniquement mes erreurs</button>
<button class="btn primary" id="restart" type="button">Nouvelle tentative complète</button>
<div id="review"></div>
</section>
</main>

<script>
const ALL=[
{cat:"DATES",q:"Vers quelle date l’Égypte prend-elle la forme d’un royaume unifié dans le cahier ?",o:["Vers 3500 av. J.-C.","Vers 3300 av. J.-C.","Vers 3150 av. J.-C.","Vers 2500 av. J.-C."],a:2,e:"Le cahier indique que l’Égypte devient un royaume unifié vers 3150 av. J.-C."},
{cat:"DATES",q:"Selon la leçon, vers quelle date l’écriture naît-elle en Mésopotamie ?",o:["Vers 4000 av. J.-C.","Vers 3500 av. J.-C.","Vers 3150 av. J.-C.","Vers 2600 av. J.-C."],a:1,e:"La leçon indique que l’écriture naît en Mésopotamie vers 3500 av. J.-C."},
{cat:"DATES",q:"Le document étudié place l’écriture cunéiforme vers 3300 av. J.-C.",o:["Vrai","Faux"],a:0,e:"Le tableau de documents donne environ 3300 av. J.-C. pour l’écriture cunéiforme."},
{cat:"DATES",q:"Le document étudié place les hiéroglyphes vers 3200 av. J.-C.",o:["Vrai","Faux"],a:0,e:"Le tableau de documents donne environ 3200 av. J.-C. pour les hiéroglyphes."},
{cat:"DATES",q:"Quel ordre chronologique est correct d’après les repères du cours ?",o:["Hiéroglyphes → cunéiforme → royaume égyptien unifié","Cunéiforme → hiéroglyphes → royaume égyptien unifié","Royaume égyptien unifié → hiéroglyphes → cunéiforme","Hiéroglyphes → royaume égyptien unifié → cunéiforme"],a:1,e:"Les repères sont environ 3300 pour le cunéiforme, 3200 pour les hiéroglyphes, puis 3150 pour l’unification de l’Égypte."},
{cat:"DATES",q:"Les hiéroglyphes apparaissent, d’après le tableau, avant l’écriture cunéiforme.",o:["Vrai","Faux"],a:1,e:"Le cunéiforme est placé vers 3300 av. J.-C. et les hiéroglyphes vers 3200 av. J.-C. : le cunéiforme est donc antérieur."},
{cat:"DATES",q:"Quel événement est le plus ancien parmi ces trois repères ?",o:["L’unification de l’Égypte vers 3150 av. J.-C.","Les hiéroglyphes vers 3200 av. J.-C.","L’écriture cunéiforme vers 3300 av. J.-C.","Ils sont contemporains exactement"],a:2,e:"En dates avant J.-C., 3300 est plus ancien que 3200 et 3150."},
{cat:"DATES",q:"Entre 3300 av. J.-C. et 3150 av. J.-C., quel repère se situe chronologiquement entre les deux ?",o:["Les hiéroglyphes vers 3200 av. J.-C.","La naissance du royaume unifié vers 3500 av. J.-C.","Aucun repère du cours","La naissance du Nil"],a:0,e:"Les hiéroglyphes sont placés vers 3200 av. J.-C., donc entre 3300 et 3150 av. J.-C."},

{cat:"GÉOGRAPHIE",q:"Quel fleuve traverse l’Égypte ?",o:["Le Tigre","L’Euphrate","Le Nil","Le Jourdain"],a:2,e:"Le Nil traverse l’Égypte et constitue le grand repère fluvial du pays."},
{cat:"GÉOGRAPHIE",q:"Quels deux fleuves sont associés à la Mésopotamie dans la carte du cours ?",o:["Nil et Tigre","Tigre et Euphrate","Nil et Euphrate","Tigre et mer Rouge"],a:1,e:"La Mésopotamie est associée au Tigre et à l’Euphrate."},
{cat:"GÉOGRAPHIE",q:"Sur la carte du cours, la mer Rouge se situe à l’est de l’Égypte.",o:["Vrai","Faux"],a:0,e:"La mer Rouge borde l’Égypte à l’est."},
{cat:"GÉOGRAPHIE",q:"La mer Méditerranée se situe au nord de l’Égypte.",o:["Vrai","Faux"],a:0,e:"La côte nord de l’Égypte donne sur la mer Méditerranée."},
{cat:"GÉOGRAPHIE",q:"Par rapport à l’Euphrate, le Tigre est placé plus à l’est sur la carte.",o:["Vrai","Faux"],a:0,e:"Sur la carte, le Tigre est le fleuve situé le plus à l’est des deux grands fleuves mésopotamiens."},
{cat:"GÉOGRAPHIE",q:"La Mésopotamie se situe autour de la vallée du Nil.",o:["Vrai","Faux"],a:1,e:"La vallée du Nil correspond à l’Égypte. La Mésopotamie est liée au Tigre et à l’Euphrate."},
{cat:"GÉOGRAPHIE",q:"Quel repère est situé entre l’Afrique du Nord et la péninsule Arabique sur la carte ?",o:["La mer Rouge","La mer Méditerranée","Le Tigre","L’Euphrate"],a:0,e:"La mer Rouge sépare l’Afrique du Nord-Est de la péninsule Arabique."},
{cat:"GÉOGRAPHIE",q:"Quelle association géographique est entièrement correcte ?",o:["Égypte → Nil ; Mésopotamie → Tigre et Euphrate","Égypte → Tigre ; Mésopotamie → Nil et Euphrate","Égypte → Euphrate ; Mésopotamie → mer Rouge","Égypte → mer Méditerranée seulement ; Mésopotamie → Nil"],a:0,e:"L’Égypte est associée au Nil ; la Mésopotamie est associée au Tigre et à l’Euphrate."}
];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let questions=shuffle(ALL.map((x,i)=>({...x,id:i}))), answers={}, wrongIds=[];

function draw(){
 const box=document.getElementById("quiz"); box.innerHTML="";
 questions.forEach((q,i)=>{
   const d=document.createElement("div"); d.className="q";
   d.innerHTML='<div class="tag">'+q.cat+'</div><div class="statement">'+(i+1)+'. '+q.q+'</div><div class="choices"></div>';
   const ch=d.querySelector(".choices");
   q.o.forEach((opt,j)=>{
     const b=document.createElement("button"); b.type="button"; b.className="choice"+(answers[q.id]===j?" selected":""); b.textContent=opt;
     b.onclick=()=>{answers[q.id]=j;draw();};
     ch.appendChild(b);
   });
   box.appendChild(d);
 });
 const b=document.createElement("button"); b.type="button"; b.className="btn primary"; b.textContent="Corriger le quiz"; b.onclick=finish; box.appendChild(b);
}

function finish(){
 if(questions.some(q=>answers[q.id]===undefined)){alert("Réponds à toutes les questions avant de corriger.");return;}
 let score=0; wrongIds=[]; let html="<h2>Correction détaillée</h2>";
 questions.forEach((q,i)=>{
   const user=answers[q.id], ok=user===q.a;
   if(ok)score++; else wrongIds.push(q.id);
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓ Bonne réponse':'✗ Erreur')+'</div>'+
   '<div class="reviewQ">'+q.q+'</div>'+
   '<div class="reviewAns"><b>Réponse d’Anne :</b> '+q.o[user]+'</div>'+
   '<div class="reviewAns"><b>Bonne réponse :</b> '+q.o[q.a]+'</div>'+
   '<div class="reviewExp"><b>Pourquoi :</b> '+q.e+'</div></div>';
 });
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / "+questions.length;
 document.getElementById("message").textContent=
   score===16?"Parfait : dates et repères maîtrisés.":
   score>=14?"Excellent niveau : quelques détails à revoir seulement.":
   score>=12?"Très bon niveau : refais les erreurs pour consolider.":
   score>=9?"Bon début, mais dates et repères doivent encore être sécurisés.":
   "Il faut reprendre les dates et les repères avant de retenter.";
 document.getElementById("retryWrong").style.display=wrongIds.length?"block":"none";
 document.getElementById("review").innerHTML=html; window.scrollTo(0,0);
}

document.getElementById("retryWrong").onclick=()=>{
 questions=shuffle(wrongIds.map(id=>({...ALL[id],id}))); answers={};
 document.getElementById("result").classList.add("hidden"); document.getElementById("quiz").classList.remove("hidden"); draw(); window.scrollTo(0,0);
};
document.getElementById("restart").onclick=()=>{
 questions=shuffle(ALL.map((x,i)=>({...x,id:i}))); answers={}; wrongIds=[];
 document.getElementById("result").classList.add("hidden"); document.getElementById("quiz").classList.remove("hidden"); draw(); window.scrollTo(0,0);
};
draw();
</script>
</body>
</html>
