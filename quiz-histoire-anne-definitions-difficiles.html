<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne – Définitions difficiles</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe7;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px}
.muted{color:#6b625b;line-height:1.45}
.q{padding:16px 0;border-top:1px solid #ece4dc}.q:first-child{border-top:0}
.statement{font-weight:760;line-height:1.42;margin-bottom:10px}
.choices{display:grid;gap:8px}
.choice{border:1px solid #d7cbc0;border-radius:13px;padding:12px;background:#fff;font:inherit;text-align:left}
.choice.selected{background:#ead8c6;border-color:#765035}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:850;margin-top:10px}
.primary{background:#765035;color:#fff}.secondary{background:#eee7df;color:#2d2723}
.hidden{display:none!important}.score{text-align:center;font-size:3rem;font-weight:850;margin:10px 0}
.review{border-top:1px solid #eadfd5;padding:14px 0;line-height:1.45}
.reviewQ{font-weight:800;margin:5px 0 8px}.reviewAns{margin:3px 0}.reviewExp{margin-top:7px;color:#5e554e}
.ok{color:#17632e;font-weight:800}.bad{color:#8a2020;font-weight:800}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Histoire 6e – Définitions difficiles</h1>
<div class="muted">Premiers États et premières écritures • 10 questions</div>
</section>
<section class="card" id="quiz"></section>
<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<button class="btn secondary" id="retryWrong" type="button">Refaire uniquement mes erreurs</button>
<button class="btn primary" id="restart" type="button">Nouvelle tentative complète</button>
<div id="review"></div>
</section>
</main>
<script>
const ALL=[
{q:"Quelle définition correspond exactement à un État dans le cahier ?",o:["Un territoire indépendant dirigé par un chef qui le gouverne.","Une ville fortifiée entourée de campagnes et dirigée par un roi.","L’ensemble des personnes qui aident au gouvernement d’un territoire.","Un territoire où tous les habitants pratiquent la même religion."],a:0,e:"État : territoire indépendant dirigé par un chef qui le gouverne."},
{q:"Quelle définition correspond exactement à une cité-État ?",o:["Un territoire comprenant une ville fortifiée et les campagnes qui l’entourent, dont les habitants obéissent au même gouvernement et aux mêmes lois.","Une grande ville indépendante sans territoire agricole autour d’elle.","Un royaume composé de plusieurs villes dirigées par un seul pharaon.","Une administration regroupant des scribes et des fonctionnaires."],a:0,e:"La cité-État comprend une ville fortifiée et les campagnes qui l’entourent ; ses habitants obéissent au même gouvernement et aux mêmes lois."},
{q:"Un fonctionnaire est une personne qui travaille pour l’État.",o:["Vrai","Faux"],a:0,e:"C’est la définition exacte du cahier."},
{q:"Quelle définition du mot « administration » est celle du cours ?",o:["L’ensemble des personnes qui aident au gouvernement d’un État.","L’ensemble des lois qui organisent la vie dans un État.","Le territoire sur lequel un chef exerce son pouvoir.","L’ensemble des habitants qui obéissent au pharaon."],a:0,e:"Administration : ensemble des personnes qui aident au gouvernement d’un État."},
{q:"Quelle définition du scribe respecte le cahier ?",o:["Un personnage savant spécialiste de l’écriture et du calcul dans l’Antiquité.","Un fonctionnaire spécialisé uniquement dans les cérémonies religieuses.","Un artisan qui grave seulement les hiéroglyphes dans les tombeaux.","Un roi capable de lire et d’écrire les lois de sa cité."],a:0,e:"Le scribe est un personnage savant spécialiste de l’écriture et du calcul dans l’Antiquité."},
{q:"Le polythéisme est la croyance en plusieurs dieux.",o:["Vrai","Faux"],a:0,e:"C’est la définition exacte du cours."},
{q:"Qu’est-ce qu’un pictogramme selon le cours ?",o:["Un dessin qui représente un objet ou une idée.","Un signe en forme de clou représentant uniquement un son.","Une image sacrée représentant uniquement un dieu.","Une lettre utilisée pour former un alphabet."],a:0,e:"Pictogramme : dessin qui représente un objet, une idée."},
{q:"Quelle proposition définit correctement l’écriture cunéiforme ?",o:["Une écriture composée de signes en forme de clou ou de coin.","Une écriture composée uniquement d’images représentant des personnages et des objets.","Une écriture composée de dessins représentant seulement des idées.","Une écriture faite uniquement de lettres gravées dans la pierre."],a:0,e:"L’écriture cunéiforme est composée de signes en forme de clou ou de coin."},
{q:"Quelle définition des hiéroglyphes correspond au cahier ?",o:["Des caractères formés d’images représentant un personnage, un objet, une action ou un son.","Des signes en forme de clou ou de coin servant uniquement à compter.","Des dessins représentant seulement des objets concrets.","Des lettres sacrées qui forment un alphabet identique au nôtre."],a:0,e:"Les hiéroglyphes sont des caractères formés d’images représentant un personnage, un objet, une action ou un son."},
{q:"Quelles associations sont exactes ?",o:["Fonctionnaire → personne qui travaille pour l’État.","Administration → ensemble des personnes qui aident au gouvernement d’un État.","Pictogramme → signe en forme de clou ou de coin.","Polythéisme → croyance en plusieurs dieux."],multi:[0,1,3],e:"Les trois associations exactes sont Fonctionnaire, Administration et Polythéisme. Le signe en forme de clou ou de coin correspond au cunéiforme."}
];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let questions=shuffle(ALL.map((x,i)=>({...x,id:i}))), answers={}, wrongIds=[];

function draw(){
 const box=document.getElementById("quiz"); box.innerHTML="";
 questions.forEach((q,i)=>{
   const d=document.createElement("div"); d.className="q";
   d.innerHTML='<div class="statement">'+(i+1)+'. '+q.q+'</div><div class="choices"></div>';
   const ch=d.querySelector(".choices");
   q.o.forEach((opt,j)=>{
      const b=document.createElement("button"); b.type="button"; b.className="choice";
      const cur=answers[q.id];
      if(Array.isArray(cur)?cur.includes(j):cur===j)b.classList.add("selected");
      b.textContent=opt;
      b.onclick=()=>{
        if(q.multi){
          let arr=Array.isArray(answers[q.id])?[...answers[q.id]]:[];
          arr=arr.includes(j)?arr.filter(x=>x!==j):[...arr,j];
          answers[q.id]=arr;
        } else answers[q.id]=j;
        draw();
      };
      ch.appendChild(b);
   });
   box.appendChild(d);
 });
 const b=document.createElement("button"); b.type="button"; b.className="btn primary"; b.textContent="Corriger le quiz"; b.onclick=finish; box.appendChild(b);
}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function finish(){
 if(questions.some(q=>answers[q.id]===undefined || (q.multi&&answers[q.id].length===0))){alert("Réponds à toutes les questions.");return;}
 let score=0; wrongIds=[]; let html="<h2>Correction détaillée</h2>";
 questions.forEach((q,i)=>{
   const user=answers[q.id];
   const ok=q.multi?sameSet(user,q.multi):user===q.a;
   if(ok)score++; else wrongIds.push(q.id);
   const userTxt=q.multi?user.map(x=>q.o[x]).join(" + "):q.o[user];
   const goodTxt=q.multi?q.multi.map(x=>q.o[x]).join(" + "):q.o[q.a];
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓ Bonne réponse':'✗ Erreur')+'</div>'+
   '<div class="reviewQ">'+q.q+'</div>'+
   '<div class="reviewAns"><b>Réponse d’Anne :</b> '+userTxt+'</div>'+
   '<div class="reviewAns"><b>Bonne réponse :</b> '+goodTxt+'</div>'+
   '<div class="reviewExp"><b>Pourquoi :</b> '+q.e+'</div></div>';
 });
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / "+questions.length;
 document.getElementById("message").textContent=score===10?"Parfait. Définitions maîtrisées.":score>=8?"Très bon niveau. Refais seulement les erreurs.":"Encore quelques définitions à verrouiller.";
 document.getElementById("retryWrong").style.display=wrongIds.length?"block":"none";
 document.getElementById("review").innerHTML=html; window.scrollTo(0,0);
}
document.getElementById("retryWrong").onclick=()=>{
 questions=shuffle(wrongIds.map(id=>({...ALL[id],id}))); answers={};
 document.getElementById("result").classList.add("hidden"); document.getElementById("quiz").classList.remove("hidden"); draw(); window.scrollTo(0,0);
};
document.getElementById("restart").onclick=()=>{
 questions=shuffle(ALL.map((x,i)=>({...x,id:i}))); answers={}; wrongIds=[];
 document.getElementById("result").classList.add("hidden"); document.getElementById("quiz").classList.remove("hidden"); draw(); window.scrollTo(0,0);
};
draw();
</script>
</body></html>
