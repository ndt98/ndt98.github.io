<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne – Quiz 2 Premiers États et écritures</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe7;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} h2{font-size:1.12rem}
.muted{color:#6b625b;line-height:1.45}
.note{background:#f8f4ee;border-radius:12px;padding:12px;margin-top:12px}
.q{padding:16px 0;border-top:1px solid #ece4dc}.q:first-child{border-top:0}
.statement{font-weight:760;line-height:1.42;margin-bottom:10px}
.choices{display:flex;gap:10px}
.choice{flex:1;border:1px solid #d7cbc0;border-radius:13px;padding:13px;background:#fff;font:inherit;font-weight:800}
.choice.selected{background:#ead8c6;border-color:#765035}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:850;margin-top:10px}
.primary{background:#765035;color:#fff}.secondary{background:#eee7df;color:#2d2723}
.hidden{display:none!important}.score{text-align:center;font-size:3rem;font-weight:850;margin:10px 0}
.review{border-top:1px solid #eadfd5;padding:14px 0;line-height:1.45}
.reviewQ{font-weight:800;margin:5px 0 8px}.reviewAns{margin:3px 0}.reviewExp{margin-top:7px;color:#5e554e}
.ok{color:#17632e;font-weight:800}.bad{color:#8a2020;font-weight:800}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Histoire 6e – Quiz 2</h1>
<div class="muted">Premiers États et premières écritures • niveau difficile</div>
<div class="note"><b>Objectif :</b> consolider les pièges avant le contrôle. Les cartes ne sont pas testées ici.</div>
</section>

<section class="card" id="quiz"></section>

<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<button class="btn secondary" id="retryWrong" type="button">Refaire uniquement mes erreurs</button>
<button class="btn secondary" id="share" type="button">Partager le résultat</button>
<button class="btn primary" id="restart" type="button">Nouvelle tentative complète</button>
<div id="review"></div>
</section>
</main>

<script>
const ALL=[
{q:"Une cité-État comprend une ville fortifiée et les campagnes qui l’entourent.",a:true,e:"C’est la définition donnée dans le cahier."},
{q:"Deux cités-États différentes doivent forcément obéir au même gouvernement et aux mêmes lois.",a:false,e:"Les habitants d’une même cité-État obéissent au même gouvernement et aux mêmes lois ; chaque cité-État est distincte."},
{q:"Un fonctionnaire appartient à l’administration car il travaille pour l’État.",a:true,e:"Le cours définit le fonctionnaire comme une personne qui travaille pour l’État, et l’administration comme l’ensemble de ceux qui aident au gouvernement."},
{q:"Un scribe est surtout défini dans le cours comme un soldat chargé de protéger le roi.",a:false,e:"Le scribe est un personnage savant, spécialiste de l’écriture et du calcul."},
{q:"Le polythéisme signifie qu’un peuple croit en plusieurs dieux.",a:true,e:"C’est la définition exacte du cours."},
{q:"Vers 3150 av. J.-C., l’Égypte est présentée comme un royaume unifié.",a:true,e:"Le cahier indique l’unification de l’Égypte vers 3150 av. J.-C."},
{q:"En Égypte, le pharaon est placé à la tête de l’État et s’appuie sur une administration.",a:true,e:"La carte mentale montre le pharaon à la tête de l’État, entouré de fonctionnaires et de scribes."},
{q:"Dans la Mésopotamie du cours, toutes les villes sont gouvernées directement par le pharaon d’Égypte.",a:false,e:"La Mésopotamie est organisée en plusieurs cités-États dirigées chacune par un roi."},
{q:"Dans le cours, la majorité des habitants de l’Égypte ancienne sont des paysans.",a:true,e:"La carte mentale précise que la majorité des Égyptiens sont des paysans."},
{q:"L’administration est définie comme l’ensemble des personnes qui aident au gouvernement d’un État.",a:true,e:"C’est la définition du cahier."},
{q:"Un pictogramme est un signe qui représente uniquement un son et jamais une idée.",a:false,e:"Le cahier définit le pictogramme comme un dessin qui représente un objet ou une idée."},
{q:"L’écriture cunéiforme se reconnaît à ses signes en forme de clou ou de coin.",a:true,e:"C’est exactement la caractéristique donnée dans le cours."},
{q:"Les hiéroglyphes sont formés d’images pouvant représenter notamment un personnage, un objet, une action ou un son.",a:true,e:"Cette définition est donnée dans le cahier."},
{q:"Les hiéroglyphes appartiennent au système d’écriture mésopotamien étudié sur tablette d’argile.",a:false,e:"Les hiéroglyphes sont associés à l’Égypte ; la Mésopotamie utilise notamment l’écriture cunéiforme sur tablette d’argile."},
{q:"Le cahier indique que l’écriture naît en Mésopotamie vers 3500 av. J.-C.",a:true,e:"La leçon indique ce repère et précise que les pictogrammes apparaissent d’abord."},
{q:"Le document de cours situe l’écriture cunéiforme vers 3300 av. J.-C.",a:true,e:"Le tableau de documents donne environ 3300 av. J.-C. pour le cunéiforme."},
{q:"Le document de cours situe les hiéroglyphes vers 3200 av. J.-C.",a:true,e:"Le tableau de documents donne environ 3200 av. J.-C. pour les hiéroglyphes."},
{q:"L’écriture sert à conserver la trace des échanges et des activités agricoles.",a:true,e:"C’est l’un des rôles explicitement donnés dans le cours."},
{q:"Fixer des lois par écrit ne sert pas à gouverner : cela concerne uniquement la religion.",a:false,e:"Le cours précise que les lois écrites permettent d’organiser la vie au sein de l’État."},
{q:"Dans la leçon, l’apparition de l’écriture est présentée comme le passage des hommes dans l’Histoire.",a:true,e:"Le cahier conclut : « Avec l’écriture, les hommes sont entrés dans l’Histoire. »"}
];

function shuffle(a){
 a=[...a];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}

let questions=shuffle(ALL.map((x,i)=>({...x,id:i})));
let answers={};
let wrongIds=[];
let lastScore=0;

function draw(){
 const box=document.getElementById("quiz");
 box.innerHTML="";
 questions.forEach((q,i)=>{
   const d=document.createElement("div");
   d.className="q";
   const v=answers[q.id];
   d.innerHTML='<div class="statement">'+(i+1)+'. '+q.q+'</div><div class="choices">'+
   '<button type="button" class="choice '+(v===true?'selected':'')+'" data-id="'+q.id+'" data-v="true">Vrai</button>'+
   '<button type="button" class="choice '+(v===false?'selected':'')+'" data-id="'+q.id+'" data-v="false">Faux</button></div>';
   box.appendChild(d);
 });
 const b=document.createElement("button");
 b.type="button"; b.className="btn primary"; b.textContent="Corriger le quiz"; b.onclick=finish;
 box.appendChild(b);
 box.querySelectorAll(".choice").forEach(btn=>{
   btn.onclick=()=>{
     answers[Number(btn.dataset.id)]=btn.dataset.v==="true";
     draw();
   };
 });
}

function finish(){
 if(questions.some(q=>answers[q.id]===undefined)){
   alert("Réponds à toutes les affirmations avant de corriger.");
   return;
 }
 let score=0;
 wrongIds=[];
 let html="<h2>Correction détaillée</h2>";
 questions.forEach((q,i)=>{
   const ok=answers[q.id]===q.a;
   if(ok)score++; else wrongIds.push(q.id);
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓ Bonne réponse':'✗ Erreur')+'</div>'+
   '<div class="reviewQ">'+q.q+'</div>'+
   '<div class="reviewAns"><b>Réponse d’Anne :</b> '+(answers[q.id]?'Vrai':'Faux')+'</div>'+
   '<div class="reviewAns"><b>Bonne réponse :</b> '+(q.a?'Vrai':'Faux')+'</div>'+
   '<div class="reviewExp"><b>Pourquoi :</b> '+q.e+'</div></div>';
 });
 lastScore=score;
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / "+questions.length;
 document.getElementById("message").textContent=
   score===20?"Parfait. Très bonne maîtrise du chapitre.":
   score>=18?"Excellent. Revois seulement les deux ou trois pièges restants.":
   score>=16?"Très bon niveau. Refais uniquement les erreurs pour consolider.":
   score>=13?"Bon niveau, mais quelques notions doivent encore être fixées.":
   "Refais les erreurs puis retente le quiz complet.";
 document.getElementById("retryWrong").style.display=wrongIds.length?"block":"none";
 document.getElementById("review").innerHTML=html;
 window.scrollTo(0,0);
}

document.getElementById("retryWrong").onclick=()=>{
 questions=shuffle(wrongIds.map(id=>({...ALL[id],id})));
 answers={};
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 draw(); window.scrollTo(0,0);
};

document.getElementById("restart").onclick=()=>{
 questions=shuffle(ALL.map((x,i)=>({...x,id:i})));
 answers={}; wrongIds=[];
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 draw(); window.scrollTo(0,0);
};

document.getElementById("share").onclick=async()=>{
 const text="Anne – Quiz 2 Premiers États et premières écritures : "+lastScore+"/"+questions.length;
 if(navigator.share){try{await navigator.share({title:"Résultat quiz histoire",text});}catch(e){}}
 else alert(text);
};

draw();
</script>
</body>
</html>
