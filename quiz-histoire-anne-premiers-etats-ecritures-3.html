<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne – Quiz 3 très difficile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3efe8;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} h2{font-size:1.12rem}
.muted{color:#6b625b;line-height:1.45}
.note{background:#f8f4ee;border-radius:12px;padding:12px;margin-top:12px}
.q{padding:16px 0;border-top:1px solid #ece4dc}.q:first-child{border-top:0}
.statement{font-weight:780;line-height:1.42;margin-bottom:10px}
.choices{display:flex;gap:10px}
.choice{flex:1;border:1px solid #d7cbc0;border-radius:13px;padding:13px;background:#fff;font:inherit;font-weight:800}
.choice.selected{background:#ead8c6;border-color:#765035}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:850;margin-top:10px}
.primary{background:#765035;color:#fff}.secondary{background:#eee7df;color:#2d2723}
.hidden{display:none!important}.score{text-align:center;font-size:3rem;font-weight:850;margin:10px 0}
.review{border-top:1px solid #eadfd5;padding:14px 0;line-height:1.45}
.reviewQ{font-weight:800;margin:5px 0 8px}.reviewAns{margin:3px 0}.reviewExp{margin-top:7px;color:#5e554e}
.ok{color:#17632e;font-weight:800}.bad{color:#8a2020;font-weight:800}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Histoire 6e – Quiz 3 très difficile</h1>
<div class="muted">Premiers États et premières écritures • entraînement final</div>
<div class="note"><b>Attention :</b> les phrases sont volontairement très proches du cours. Un seul mot peut rendre toute l’affirmation fausse. Les cartes ne sont pas testées ici.</div>
</section>

<section class="card" id="quiz"></section>

<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<button class="btn secondary" id="retryWrong" type="button">Refaire uniquement mes erreurs</button>
<button class="btn secondary" id="share" type="button">Partager le résultat</button>
<button class="btn primary" id="restart" type="button">Nouvelle tentative complète</button>
<div id="review"></div>
</section>
</main>

<script>
const ALL=[
{q:"Un État est défini dans le cours comme un territoire indépendant dirigé par un chef qui le gouverne.",a:true,e:"C’est la définition exacte donnée dans le cahier."},
{q:"Une cité-État comprend la ville fortifiée, mais pas les campagnes qui l’entourent.",a:false,e:"La définition inclut la ville fortifiée ET les campagnes qui l’entourent."},
{q:"Dans une même cité-État, les habitants obéissent au même gouvernement et aux mêmes lois.",a:true,e:"C’est explicitement indiqué dans la définition du cahier."},
{q:"L’administration désigne le territoire sur lequel s’exerce le pouvoir du roi.",a:false,e:"L’administration est l’ensemble des personnes qui aident au gouvernement d’un État."},
{q:"Un fonctionnaire est une personne qui travaille pour l’État.",a:true,e:"C’est la définition exacte du cours."},
{q:"Le scribe est présenté comme un personnage savant, spécialiste de l’écriture et du calcul dans l’Antiquité.",a:true,e:"C’est la définition donnée dans le cahier."},
{q:"Le polythéisme correspond à la croyance en un seul dieu qui prend plusieurs formes.",a:false,e:"Le polythéisme signifie croire en plusieurs dieux."},
{q:"Vers 3150 av. J.-C., l’Égypte est présentée comme un royaume unifié.",a:true,e:"Le cahier donne ce repère chronologique pour l’unification de l’Égypte."},
{q:"Au moment où l’Égypte forme un royaume unifié, la Mésopotamie est organisée en plusieurs cités-États.",a:true,e:"Le cours oppose le royaume unifié égyptien à la multitude de cités-États mésopotamiennes."},
{q:"Chaque cité-État mésopotamienne est dirigée par un roi et dispose d’une administration.",a:true,e:"C’est ce que précise la leçon sur la Mésopotamie."},
{q:"Le pharaon est à la tête de l’État égyptien, mais il partage tous ses pouvoirs à égalité avec les scribes.",a:false,e:"Le pharaon est présenté comme un chef tout-puissant ; les scribes font partie de l’administration qui l’aide à gouverner."},
{q:"Dans la carte mentale du cours, la majorité des Égyptiens sont des paysans qui cultivent les terres du pharaon et lui obéissent.",a:true,e:"Cette idée figure dans la carte mentale du cahier."},
{q:"Un pictogramme est un dessin qui représente un objet ou une idée.",a:true,e:"C’est la définition du cahier."},
{q:"L’écriture cunéiforme tire son nom de signes en forme de clou ou de coin.",a:true,e:"Le cours relie cunéiforme au latin cuneus, « clou »."},
{q:"Les hiéroglyphes sont décrits comme des caractères formés uniquement de sons, sans images.",a:false,e:"Les hiéroglyphes sont formés d’images pouvant représenter un personnage, un objet, une action ou un son."},
{q:"Le cours situe la naissance de l’écriture en Mésopotamie vers 3500 av. J.-C.",a:true,e:"C’est le repère indiqué dans la leçon."},
{q:"Le document étudié place l’écriture cunéiforme vers 3300 av. J.-C. et les hiéroglyphes vers 3200 av. J.-C.",a:true,e:"Ces deux dates apparaissent dans le tableau de documents."},
{q:"D’après les documents étudiés, les hiéroglyphes apparaissent avant l’écriture cunéiforme.",a:false,e:"Le tableau place le cunéiforme vers 3300 av. J.-C. et les hiéroglyphes vers 3200 av. J.-C. ; le cunéiforme est donc antérieur."},
{q:"L’écriture sert à conserver la trace des échanges, des activités agricoles, à fixer des lois et à transmettre des œuvres littéraires.",a:true,e:"Ces fonctions sont toutes indiquées dans la leçon."},
{q:"La phrase « Avec l’écriture, les hommes sont entrés dans l’Histoire » signifie que l’écriture constitue un repère majeur entre Préhistoire et Histoire.",a:true,e:"C’est la conclusion donnée dans le cahier."}
];

function shuffle(a){
 a=[...a];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
let questions=shuffle(ALL.map((x,i)=>({...x,id:i})));
let answers={};
let wrongIds=[];
let lastScore=0;

function draw(){
 const box=document.getElementById("quiz");
 box.innerHTML="";
 questions.forEach((q,i)=>{
   const v=answers[q.id];
   const d=document.createElement("div");
   d.className="q";
   d.innerHTML='<div class="statement">'+(i+1)+'. '+q.q+'</div><div class="choices">'+
   '<button type="button" class="choice '+(v===true?'selected':'')+'" data-id="'+q.id+'" data-v="true">Vrai</button>'+
   '<button type="button" class="choice '+(v===false?'selected':'')+'" data-id="'+q.id+'" data-v="false">Faux</button></div>';
   box.appendChild(d);
 });
 const b=document.createElement("button");
 b.type="button"; b.className="btn primary"; b.textContent="Corriger le quiz"; b.onclick=finish;
 box.appendChild(b);
 box.querySelectorAll(".choice").forEach(btn=>{
   btn.onclick=()=>{
     answers[Number(btn.dataset.id)]=btn.dataset.v==="true";
     draw();
   };
 });
}

function finish(){
 if(questions.some(q=>answers[q.id]===undefined)){
   alert("Réponds à toutes les affirmations avant de corriger.");
   return;
 }
 let score=0;
 wrongIds=[];
 let html="<h2>Correction détaillée</h2>";
 questions.forEach((q,i)=>{
   const ok=answers[q.id]===q.a;
   if(ok) score++; else wrongIds.push(q.id);
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓ Bonne réponse':'✗ Erreur')+'</div>'+
   '<div class="reviewQ">'+q.q+'</div>'+
   '<div class="reviewAns"><b>Réponse d’Anne :</b> '+(answers[q.id]?'Vrai':'Faux')+'</div>'+
   '<div class="reviewAns"><b>Bonne réponse :</b> '+(q.a?'Vrai':'Faux')+'</div>'+
   '<div class="reviewExp"><b>Pourquoi :</b> '+q.e+'</div></div>';
 });
 lastScore=score;
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / "+questions.length;
 document.getElementById("message").textContent=
   score===20?"Parfait : niveau contrôle très solide.":
   score>=18?"Excellent : seulement quelques pièges à revoir.":
   score>=16?"Très bon niveau : refais les erreurs pour verrouiller les détails.":
   score>=13?"Bon niveau, mais plusieurs nuances du cours restent fragiles.":
   "Refais d’abord les erreurs, puis retente le quiz complet.";
 document.getElementById("retryWrong").style.display=wrongIds.length?"block":"none";
 document.getElementById("review").innerHTML=html;
 window.scrollTo(0,0);
}

document.getElementById("retryWrong").onclick=()=>{
 questions=shuffle(wrongIds.map(id=>({...ALL[id],id})));
 answers={};
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 draw(); window.scrollTo(0,0);
};

document.getElementById("restart").onclick=()=>{
 questions=shuffle(ALL.map((x,i)=>({...x,id:i})));
 answers={}; wrongIds=[];
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 draw(); window.scrollTo(0,0);
};

document.getElementById("share").onclick=async()=>{
 const text="Anne – Quiz 3 très difficile : "+lastScore+"/"+questions.length;
 if(navigator.share){try{await navigator.share({title:"Résultat quiz histoire",text});}catch(e){}}
 else alert(text);
};

draw();
</script>
</body>
</html>
