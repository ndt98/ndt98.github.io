<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Maths Anne - Priorités 2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef3f7;margin:0;color:#20252b}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0001}button{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd7df;border-radius:12px;background:#fff;font-size:1rem;text-align:left}.selected{background:#e2edf4;border-color:#355f7a}.primary{background:#355f7a;color:#fff;text-align:center;font-weight:700}.ok{color:#24753a}.bad{color:#a42828}.hidden{display:none}.score{font-size:3rem;font-weight:800;text-align:center}</style></head><body><main><div class="card"><h1>Quiz Maths – Priorités opératoires</h1><p>Anne • Niveau 6e • Série 2 • 10 questions</p><p>Parenthèses d’abord, puis multiplications/divisions, puis additions/soustractions. À priorité égale, on calcule de gauche à droite.</p></div><div class="card" id="quiz"><div id="num"></div><h2 id="q"></h2><div id="choices"></div><p id="fb"></p><button class="primary" id="next">Valider</button></div><div class="card hidden" id="result"><div class="score" id="score"></div><p id="msg" style="text-align:center"></p><div id="review"></div><button class="primary" onclick="location.reload()">Recommencer</button></div></main><script>const questions=[{q:"36 − 4 × 5 + 7",c:["16","23","27","32"],a:1,e:"4 × 5 = 20, puis 36 − 20 + 7 = 23."},{q:"(28 + 14) ÷ 7 + 6",c:["8","10","12","18"],a:2,e:"28 + 14 = 42, puis 42 ÷ 7 = 6 et 6 + 6 = 12."},{q:"9 × (11 − 7) − 8",c:["20","28","32","36"],a:1,e:"11 − 7 = 4, puis 9 × 4 = 36 et 36 − 8 = 28."},{q:"84 ÷ 7 × 2 − 3",c:["9","18","21","24"],a:2,e:"84 ÷ 7 = 12, puis 12 × 2 = 24 et 24 − 3 = 21."},{q:"60 − (18 + 6) ÷ 4",c:["36","48","54","56"],a:2,e:"18 + 6 = 24, puis 24 ÷ 4 = 6 et 60 − 6 = 54."},{q:"Quelle expression N’EST PAS égale à 18 ?",c:["3 × 8 − 6","42 ÷ 3 + 4","(5 + 4) × 2","48 − 8 × 3"],a:3,e:"48 − 8 × 3 = 24. Les trois autres valent 18."},{q:"96 ÷ (8 + 4) + 5 × 3",c:["18","20","23","27"],a:2,e:"96 ÷ 12 = 8 et 5 × 3 = 15, donc 8 + 15 = 23."},{q:"(40 − 16) ÷ 3 + 7",c:["13","15","17","21"],a:1,e:"40 − 16 = 24, puis 24 ÷ 3 = 8 et 8 + 7 = 15."},{q:"7 + 6 × 5 − 18 ÷ 3",c:["25","29","31","33"],a:2,e:"6 × 5 = 30 et 18 ÷ 3 = 6, donc 7 + 30 − 6 = 31."},{q:"120 − (9 + 6) × 4 + 12 ÷ 3",c:["56","60","64","76"],a:2,e:"15 × 4 = 60 et 12 ÷ 3 = 4, donc 120 − 60 + 4 = 64."}];let i=0,sel=null,score=0,answers=[];const $=x=>document.getElementById(x);function render(){const x=questions[i];$("num").textContent="Question "+(i+1)+" sur 10";$("q").textContent="Calcule : "+x.q;$("choices").innerHTML="";x.c.forEach((v,n)=>{const b=document.createElement("button");b.textContent=v;b.className=sel===n?"selected":"";b.onclick=()=>{sel=n;render()};$("choices").appendChild(b)});$("fb").textContent="";$("next").textContent="Valider"}$("next").onclick=()=>{if(sel===null){$("fb").textContent="Choisis une réponse.";return}const x=questions[i],ok=sel===x.a;answers.push({q:x.q,ok,chosen:x.c[sel],good:x.c[x.a],e:x.e});if(ok)score++;$("fb").className=ok?"ok":"bad";$("fb").textContent=(ok?"Bonne réponse. ":"À revoir. Bonne réponse : "+x.c[x.a]+". ")+x.e;$("next").textContent=i===9?"Voir le résultat":"Question suivante";$("next").onclick=()=>{if(i===9)return finish();i++;sel=null;render();$("next").onclick=arguments.callee}};function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+" / 10";$("msg").textContent=score>=9?"Excellent !":score>=7?"Très bien !":"Continue à t’entraîner.";$("review").innerHTML=answers.map((a,n)=>"<p><b>"+(n+1)+". "+(a.ok?"✅":"❌")+"</b> "+a.e+"</p>").join("")}render();</script></body></html>
