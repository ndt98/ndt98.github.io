<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Quiz maths 3e – Nombres premiers 2 – Thomas</title>
<style>
:root { --bg:#f4f6f8; --card:#ffffff; --text:#171717; --muted:#62666b; --line:#d9dde2; --ok:#eaf7ed; --bad:#fdecec; --accent:#111827; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%; }
main { max-width:760px; margin:0 auto; padding:18px 14px 48px; }
header { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:14px; }
h1 { margin:0 0 8px; font-size:26px; line-height:1.2; }
.subtitle { color:var(--muted); font-size:16px; line-height:1.4; margin:0; }
.notice { margin-top:14px; padding:12px 14px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); font-weight:650; line-height:1.4; }
.qcard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
.qtext { font-size:18px; line-height:1.35; font-weight:700; margin:0 0 12px; }
.option { display:block; padding:12px 12px; margin:8px 0; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:16px; line-height:1.35; }
.option input { transform:scale(1.18); margin-right:9px; }
.correct { background:var(--ok); border-color:#9cc8a5; }
.incorrect { background:var(--bad); border-color:#e2a0a0; }
.explain { display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:15px; line-height:1.4; }
.actions { position:sticky; bottom:0; padding:12px 0 calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, rgba(244,246,248,0)); }
button { width:100%; border:0; border-radius:14px; padding:15px 16px; font-size:18px; font-weight:750; background:var(--accent); color:#fff; }
button.secondary { margin-top:9px; background:#e5e7eb; color:#111; }
#result { display:none; background:var(--card); border:2px solid var(--accent); border-radius:18px; padding:18px; margin:14px 0; }
#score { font-size:30px; font-weight:800; margin:0 0 6px; }
#feedback { font-size:16px; color:var(--muted); margin:0; line-height:1.4; }
.small { font-size:14px; color:var(--muted); }
@media (max-width:430px) { h1 { font-size:23px; } .qtext { font-size:17px; } }
</style>
</head>
<body>
<main>
<header>
<h1>Mathématiques – début de 3e</h1>
<p class="subtitle">Nombres premiers et décomposition en facteurs premiers — série 2.</p>
<div class="notice">Objectif : reconnaître un nombre premier, décomposer complètement un entier et reconstruire un nombre à partir de sa décomposition.</div>
</header>
<div id="result"><p id="score"></p><p id="feedback"></p><div id="sendStatus" class="small" style="margin-top:12px"></div></div>
<form id="quiz"></form>
<div class="actions"><button type="button" id="submitBtn">Corriger le quiz</button><button type="button" id="resetBtn" class="secondary" style="display:none">Recommencer</button></div>
</main>
<script>
const questions = [
{"q":"1. Parmi les nombres suivants, lequel est premier ?","choices":["69","71","77","87"],"answer":1,"explain":"71 n’est divisible ni par 2, ni par 3, ni par 5, ni par 7. En revanche 69 = 3 × 23, 77 = 7 × 11 et 87 = 3 × 29."},
{"q":"2. Pourquoi 119 n’est-il pas un nombre premier ?","choices":["Parce que 119 est impair","Parce que 119 = 7 × 17","Parce que 119 est supérieur à 100","Parce que 119 se termine par 9"],"answer":1,"explain":"119 = 7 × 17. Il possède donc des diviseurs autres que 1 et lui-même."},
{"q":"3. Quelle est la décomposition en facteurs premiers de 126 ?","choices":["2 × 3² × 7","2 × 9 × 7","3 × 42","2 × 3 × 21"],"answer":0,"explain":"126 = 2 × 63 = 2 × 3 × 21 = 2 × 3² × 7."},
{"q":"4. Quelle est la décomposition en facteurs premiers de 168 ?","choices":["2³ × 3 × 7","2² × 6 × 7","2³ × 21","3 × 56"],"answer":0,"explain":"168 = 8 × 21 = 2³ × 3 × 7."},
{"q":"5. Quelle est la décomposition en facteurs premiers de 225 ?","choices":["3² × 5²","3 × 75","5 × 45","15²"],"answer":0,"explain":"225 = 15 × 15 = (3 × 5) × (3 × 5) = 3² × 5²."},
{"q":"6. Quelle est la décomposition en facteurs premiers de 294 ?","choices":["2 × 3 × 7²","2 × 147","3 × 98","6 × 49"],"answer":0,"explain":"294 = 2 × 147 = 2 × 3 × 49 = 2 × 3 × 7²."},
{"q":"7. Quelle est la décomposition en facteurs premiers de 420 ?","choices":["2² × 3 × 5 × 7","2 × 3 × 5 × 14","4 × 3 × 5 × 7","2² × 3 × 35"],"answer":0,"explain":"420 = 42 × 10 = (2 × 3 × 7) × (2 × 5) = 2² × 3 × 5 × 7."},
{"q":"8. Quel nombre correspond à 2⁴ × 3² ?","choices":["72","108","144","288"],"answer":2,"explain":"2⁴ × 3² = 16 × 9 = 144."},
{"q":"9. Quel nombre correspond à 2² × 3 × 5² ?","choices":["150","225","300","600"],"answer":2,"explain":"2² × 3 × 5² = 4 × 3 × 25 = 12 × 25 = 300."},
{"q":"10. Laquelle de ces écritures n’est PAS une décomposition complète en facteurs premiers ?","choices":["126 = 2 × 3² × 7","200 = 2³ × 5²","270 = 2 × 3³ × 5","360 = 2³ × 3 × 15"],"answer":3,"explain":"Dans 360 = 2³ × 3 × 15, le facteur 15 n’est pas premier. Il faut poursuivre : 15 = 3 × 5, donc 360 = 2³ × 3² × 5."}
];

const quiz=document.getElementById('quiz'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),feedbackEl=document.getElementById('feedback'),submitBtn=document.getElementById('submitBtn'),resetBtn=document.getElementById('resetBtn'),sendStatus=document.getElementById('sendStatus');

function render(){
  quiz.innerHTML='';
  questions.forEach((item,idx)=>{
    const card=document.createElement('section');
    card.className='qcard';
    card.id='q'+idx;
    const p=document.createElement('p');
    p.className='qtext';
    p.textContent=item.q;
    card.appendChild(p);
    item.choices.forEach((choice,cidx)=>{
      const label=document.createElement('label');
      label.className='option';
      const input=document.createElement('input');
      input.type='radio';
      input.name='q'+idx;
      input.value=cidx;
      label.appendChild(input);
      label.appendChild(document.createTextNode(choice));
      card.appendChild(label);
    });
    const exp=document.createElement('div');
    exp.className='explain';
    exp.textContent=item.explain;
    card.appendChild(exp);
    quiz.appendChild(card);
  });
}

async function sendResult(score,pct){
  sendStatus.textContent='Envoi de la note par e-mail…';
  try{
    const response=await fetch('https://formsubmit.co/ajax/ndt2004@gmail.com',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        '_subject':'Résultat quiz maths 3e – Nombres premiers série 2 – Thomas : '+score+'/10',
        'Élève':'Thomas',
        'Thème':'Nombres premiers et décomposition en facteurs premiers – série 2',
        'Score':score+'/10',
        'Pourcentage':pct+' %'
      })
    });
    if(!response.ok) throw new Error('Erreur');
    sendStatus.textContent='✅ Note envoyée par e-mail.';
  }catch(e){
    sendStatus.textContent='⚠️ Quiz terminé, mais l’envoi de la note a échoué.';
  }
}

function correctQuiz(){
  let score=0,unanswered=0;
  questions.forEach((item,idx)=>{
    const card=document.getElementById('q'+idx),labels=card.querySelectorAll('.option'),selected=card.querySelector('input:checked');
    labels.forEach(l=>l.classList.remove('correct','incorrect'));
    if(!selected){
      unanswered++;
    }else{
      const val=Number(selected.value);
      if(val===item.answer){
        score++;
        selected.closest('.option').classList.add('correct');
      }else{
        selected.closest('.option').classList.add('incorrect');
      }
    }
    labels[item.answer].classList.add('correct');
    card.querySelector('.explain').style.display='block';
  });
  const pct=Math.round(score/questions.length*100);
  scoreEl.textContent=`${score} / ${questions.length} — ${pct} %`;
  let msg='';
  if(score>=9) msg='Très bon niveau : les décompositions sont bien maîtrisées.';
  else if(score>=7) msg='Bon niveau : quelques calculs ou décompositions sont encore à revoir.';
  else if(score>=5) msg='Les bases sont présentes, mais il faut encore s’entraîner sur les décompositions complètes.';
  else msg='Revoir la méthode de décomposition en facteurs premiers puis refaire le quiz.';
  if(unanswered) msg+=` ${unanswered} question(s) non répondue(s).`;
  feedbackEl.textContent=msg;
  result.style.display='block';
  submitBtn.style.display='none';
  resetBtn.style.display='block';
  result.scrollIntoView({behavior:'smooth',block:'start'});
  sendResult(score,pct);
}

function resetQuiz(){
  document.getElementById('quiz').reset();
  document.querySelectorAll('.option').forEach(l=>l.classList.remove('correct','incorrect'));
  document.querySelectorAll('.explain').forEach(e=>e.style.display='none');
  result.style.display='none';
  sendStatus.textContent='';
  submitBtn.style.display='block';
  resetBtn.style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

submitBtn.addEventListener('click',correctQuiz);
resetBtn.addEventListener('click',resetQuiz);
render();
</script>
</body>
</html>
