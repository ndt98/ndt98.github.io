<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Quiz Néolithique – Anne</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--ink:#26221f;--muted:#6d655e;--accent:#7a5434;--accent2:#f1e3d3;--ok:#246c37;--okbg:#eaf6ed;--bad:#9d2929;--badbg:#fdecec;--line:#e8ded4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:760px;margin:auto;padding:14px}.hero,.card{background:var(--card);border-radius:20px;box-shadow:0 4px 16px #0000000d}.hero{padding:20px;margin-bottom:14px}h1{margin:0 0 6px;font-size:1.55rem}.sub{color:var(--muted)}.progress{height:10px;background:#eee5dc;border-radius:999px;margin-top:16px;overflow:hidden}#bar{height:100%;width:0;background:var(--accent);transition:.25s}.card{padding:20px}#qnum{font-size:.92rem;color:var(--muted);margin-bottom:7px}#question{font-size:1.2rem;font-weight:750;line-height:1.35;margin:0 0 16px}.answers{display:grid;gap:10px}.choice{width:100%;padding:14px;border:1px solid #d9cec3;border-radius:14px;background:#fff;text-align:left;font:inherit;color:var(--ink)}.choice.selected{background:var(--accent2);border-color:var(--accent)}.choice:disabled{opacity:1}.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}.feedback.ok{display:block;background:var(--okbg);color:#175929}.feedback.bad{display:block;background:var(--badbg);color:#821f1f}.actions{display:flex;gap:10px;margin-top:18px}.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}.secondary{background:#eee7df;color:var(--ink)}.primary{background:var(--accent);color:#fff}.hidden{display:none!important}.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}.center{text-align:center}.small{font-size:.9rem;color:var(--muted)}#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f7f4f0;line-height:1.4}.review{margin-top:18px}.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.12rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🌾 Quiz Histoire – Anne</h1>
<div class="sub">La révolution néolithique • 10 questions</div>
<div class="progress"><div id="bar"></div></div>
</section>
<section class="card" id="quizCard">
<div id="qnum"></div><div id="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div>
<div class="actions"><button class="action secondary" id="prev">← Précédent</button><button class="action primary" id="next">Valider</button></div>
</section>
<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div><div class="score" id="score"></div><div class="center" id="message"></div><div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions"><button class="action secondary" id="retrySend">Renvoyer le résultat</button><button class="action primary" id="restart">Recommencer</button></div><div class="review" id="review"></div>
</section>
</main>
<script>
const questions=[
{q:"Vers quelle date commence la révolution néolithique étudiée dans le cours ?",c:["Vers -10 000","Vers -3 000","Vers -30 000","Vers -300 000"],a:0,e:"Le Néolithique commence vers -10 000 dans le cours."},
{q:"Quelle définition correspond le mieux à la révolution néolithique ?",c:["Le passage progressif d’un mode de vie nomade à un mode de vie sédentaire fondé sur l’agriculture et l’élevage","Le passage de l’agriculture à la chasse et à la cueillette","L’invention de l’écriture et des villes","La disparition de tous les animaux sauvages"],a:0,e:"La révolution néolithique correspond au passage progressif vers la sédentarité, l’agriculture et l’élevage."},
{q:"Que signifie « sédentaire » ?",c:["Une personne qui vit dans un habitat fixe","Une personne qui se déplace sans cesse","Une personne qui fabrique uniquement des outils","Une personne qui chasse seulement"],a:0,e:"Un sédentaire vit dans un habitat fixe, contrairement au nomade."},
{q:"Quel grand foyer du Néolithique est étudié comme point de départ vers -10 000 ?",c:["Le Proche-Orient","L’Europe du Nord","L’Australie","L’Amérique du Sud"],a:0,e:"Le Proche-Orient est le premier grand foyer étudié pour l’apparition de l’agriculture et de l’élevage."},
{q:"Que font les hommes lorsqu’ils défrichent une terre ?",c:["Ils détruisent la végétation avant de la mettre en culture","Ils construisent une tombe collective","Ils déplacent leur village","Ils fabriquent une poterie"],a:0,e:"Défricher consiste à enlever ou détruire la végétation avant de cultiver une terre."},
{q:"Quelle nouveauté technique caractérise particulièrement le Néolithique ?",c:["Le polissage de la pierre","La fabrication du fer","L’imprimerie","Le moteur"],a:0,e:"Le Néolithique est notamment l’âge de la pierre polie."},
{q:"Quel ensemble correspond aux nouvelles techniques du Néolithique ?",c:["Pierre polie, céramique, filage et tissage de la laine","Bronze, papier et imprimerie","Fer, verre et moteur","Écriture, monnaie et navigation"],a:0,e:"Le cours cite la pierre polie, la céramique ainsi que le filage et le tissage de la laine."},
{q:"Qu’est-ce qu’un artisan ?",c:["Une personne qui fabrique des objets à la main","Une personne qui cultive uniquement du blé","Une personne qui dirige obligatoirement le village","Une personne qui vit toujours seule"],a:0,e:"Un artisan fabrique des objets à la main."},
{q:"Que sont les mégalithes ?",c:["De grandes pierres dressées ou de grandes constructions en pierre","Des outils en bois destinés à la chasse","Des champs réservés au blé","Des maisons en terre uniquement"],a:0,e:"Les mégalithes sont de grandes pierres dressées ou de grandes constructions en pierre ; certains sont liés à des tombes collectives."},
{q:"Quelle synthèse décrit le mieux les transformations du Néolithique ?",c:["Villages, sédentarité, agriculture, élevage, nouvelles techniques et société plus organisée","Nomadisme renforcé, disparition de l’agriculture et retour exclusif à la chasse","Fin de l’élevage et abandon des villages","Apparition immédiate de l’écriture au début du Néolithique"],a:0,e:"Le Néolithique transforme le mode de vie, les activités, les techniques et l’organisation des sociétés."}
];
let index=0,answers=Array(questions.length).fill(null),validated=Array(questions.length).fill(false);const $=id=>document.getElementById(id);function correct(i){return answers[i]===questions[i].a}
function render(){const q=questions[index];$("qnum").textContent=`Question ${index+1} sur ${questions.length}`;$("question").textContent=q.q;$("answers").innerHTML="";q.c.forEach((choice,n)=>{const b=document.createElement("button");b.className="choice"+(answers[index]===n?" selected":"");b.textContent=choice;b.disabled=validated[index];b.addEventListener("click",()=>{answers[index]=n;render()});$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";if(validated[index]){if(correct(index)){$("feedback").className="feedback ok";$("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e}else{$("feedback").className="feedback bad";$("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e}$("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante"}else $("next").textContent="Valider";$("prev").disabled=index===0;$("prev").style.opacity=index===0?".45":"1";$("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%"}
$("next").addEventListener("click",()=>{if(!validated[index]){if(answers[index]===null){$("feedback").className="feedback bad";$("feedback").textContent="Choisis une réponse avant de valider.";return}validated[index]=true;render();return}if(index<questions.length-1){index++;render()}else showResult()});$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){return questions.map((q,i)=>{const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];return `${i+1}. ${correct(i)?"OK":"ERREUR"} | Réponse Anne : ${given} | Bonne réponse : ${q.c[q.a]}`}).join("\n")}
async function sendResult(){const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);const status=$("sendStatus");status.textContent="Envoi du résultat par e-mail…";const localDate=new Date().toLocaleString("fr-FR");const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");try{const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({"_subject":"Résultat Quiz Néolithique – Anne : "+total+"/10","_template":"table","Élève":"Anne","Quiz":"La révolution néolithique – 10 questions","Score":total+"/10","Pourcentage":(total*10)+" %","Date":localDate,"Détail des réponses":buildDetails()})});if(!response.ok)throw new Error("send");status.innerHTML="✅ Résultat envoyé par e-mail."}catch(e){status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat »."}}
function showResult(){$("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");$("bar").style.width="100%";const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);$("score").textContent=total+" / 10";$("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques notions sont à revoir.":"Il faut encore revoir la fiche de révision.";$("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>`<div class='reviewItem'><b>${i+1}. ${correct(i)?"✅":"❌"}</b> ${q.e}</div>`).join("");sendResult()}
$("retrySend").addEventListener("click",sendResult);$("restart").addEventListener("click",()=>{index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);$("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render()});render();
</script>
</body>
</html>
