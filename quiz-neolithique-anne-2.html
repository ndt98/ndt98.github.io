<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Quiz Néolithique difficile – Anne</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--ink:#26221f;--muted:#6d655e;--accent:#72502f;--accent2:#f1e3d3;--ok:#246c37;--okbg:#eaf6ed;--bad:#9d2929;--badbg:#fdecec;--line:#e8ded4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:760px;margin:auto;padding:14px}.hero,.card{background:var(--card);border-radius:20px;box-shadow:0 4px 16px #0000000d}.hero{padding:20px;margin-bottom:14px}h1{margin:0 0 6px;font-size:1.55rem}.sub{color:var(--muted)}.badge{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#f3dfc9;font-size:.9rem;font-weight:700}.progress{height:10px;background:#eee5dc;border-radius:999px;margin-top:16px;overflow:hidden}#bar{height:100%;width:0;background:var(--accent);transition:.25s}.card{padding:20px}#qnum{font-size:.92rem;color:var(--muted);margin-bottom:7px}#question{font-size:1.2rem;font-weight:750;line-height:1.35;margin:0 0 16px}.answers{display:grid;gap:10px}.choice{width:100%;padding:14px;border:1px solid #d9cec3;border-radius:14px;background:#fff;text-align:left;font:inherit;color:var(--ink)}.choice.selected{background:var(--accent2);border-color:var(--accent)}.choice:disabled{opacity:1}.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}.feedback.ok{display:block;background:var(--okbg);color:#175929}.feedback.bad{display:block;background:var(--badbg);color:#821f1f}.actions{display:flex;gap:10px;margin-top:18px}.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}.secondary{background:#eee7df;color:var(--ink)}.primary{background:var(--accent);color:#fff}.action:disabled{opacity:.5}.hidden{display:none!important}.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}.center{text-align:center}.small{font-size:.9rem;color:var(--muted)}#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f7f4f0;line-height:1.4}.review{margin-top:18px}.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.12rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🌾 Quiz Histoire – Anne</h1>
<div class="sub">La révolution néolithique • 10 questions</div>
<div class="badge">Niveau plus difficile</div>
<div class="progress"><div id="bar"></div></div>
</section>
<section class="card" id="quizCard">
<div id="qnum"></div><div id="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div>
<div class="actions"><button class="action secondary" id="prev">← Précédent</button><button class="action primary" id="next">Valider</button></div>
</section>
<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div><div class="score" id="score"></div><div class="center" id="message"></div><div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions"><button class="action secondary" id="retrySend" disabled>Renvoyer si échec</button><button class="action primary" id="restart">Recommencer</button></div><div class="review" id="review"></div>
</section>
</main>
<script>
const questions=[
{q:"Le Néolithique étudié va approximativement de -10 000 à -3 000. Combien de temps cette période dure-t-elle environ ?",c:["3 000 ans","7 000 ans","10 000 ans","13 000 ans"],a:1,e:"De -10 000 à -3 000, il s’écoule environ 7 000 ans."},
{q:"Pourquoi parle-t-on de « révolution néolithique » même si le changement n’a pas été instantané ?",c:["Parce qu’un changement progressif transforme profondément le mode de vie, les activités et la société","Parce qu’une guerre mondiale commence vers -10 000","Parce que tous les humains changent de mode de vie exactement la même année","Parce que l’écriture apparaît au début du Néolithique"],a:0,e:"Le mot « révolution » désigne ici une transformation profonde, mais progressive, vers la sédentarité, l’agriculture et l’élevage."},
{q:"Sur le planisphère du cours, l’Europe est indiquée comme zone de diffusion. Qu’est-ce que cela signifie ?",c:["L’agriculture et l’élevage y arrivent depuis d’autres foyers","L’Europe est le seul lieu où l’agriculture apparaît","L’agriculture y disparaît avant de gagner le Proche-Orient","L’Europe reste entièrement nomade pendant tout le Néolithique"],a:0,e:"Une zone de diffusion reçoit progressivement l’agriculture et l’élevage depuis des foyers néolithiques."},
{q:"Quelle association concernant le Proche-Orient est entièrement conforme au cours ?",c:["Vers -10 000 ; culture du blé ; domestication notamment des moutons, chèvres et bœufs","Vers -3 000 ; culture du maïs ; domestication du lama","Vers -30 000 ; culture du riz ; domestication du cheval uniquement","Vers -300 000 ; culture du blé ; aucune domestication"],a:0,e:"Le Proche-Orient est étudié comme un grand foyer dès environ -10 000, avec notamment le blé et la domestication d’animaux."},
{q:"Quel enchaînement décrit correctement le passage à l’agriculture ?",c:["Défricher la végétation → mettre la terre en culture → produire des plantes","Polir une pierre → construire un dolmen → inventer l’écriture","Domestiquer un mouton → devenir automatiquement artisan → quitter le village","Construire une tombe → devenir nomade → abandonner les cultures"],a:0,e:"Défricher consiste à enlever la végétation avant de pouvoir mettre une terre en culture."},
{q:"Quel ensemble contient uniquement des techniques nouvelles étudiées pour le Néolithique ?",c:["Pierre polie, céramique, filage et tissage de la laine","Pierre taillée, imprimerie, monnaie et verre","Fer, acier, écriture et moteur","Bronze, papier, navigation et photographie"],a:0,e:"Le cours retient le polissage de la pierre, la céramique, le filage et le tissage de la laine."},
{q:"Quelle proposition décrit le mieux la transformation de la société au Néolithique ?",c:["Un chef peut organiser le groupe, des artisans apparaissent, des croyances existent et des mégalithes sont construits","Tous les métiers disparaissent et chaque famille vit isolée","Les villages disparaissent au profit d’un retour au nomadisme","Les artisans deviennent uniquement des chasseurs"],a:0,e:"Le cours montre une société plus organisée, avec chef, artisans, croyances et constructions collectives."},
{q:"Quelle différence entre un menhir et un dolmen est correcte ?",c:["Le menhir est une grande pierre dressée ; le dolmen est une construction de pierre pouvant servir de tombe collective","Le menhir est une poterie ; le dolmen est un outil agricole","Le menhir est une maison ; le dolmen est un champ cultivé","Le menhir est une arme ; le dolmen est un tissu"],a:0,e:"Le menhir est une pierre dressée ; le dolmen est une construction mégalithique pouvant correspondre à une tombe collective."},
{q:"Que permet surtout de comprendre la construction de grands mégalithes ?",c:["Qu’une main-d’œuvre organisée et collective pouvait être mobilisée","Que les hommes étaient redevenus entièrement nomades","Que les artisans avaient disparu","Que l’agriculture n’existait plus"],a:0,e:"Déplacer et dresser de très grandes pierres suppose une organisation collective du travail."},
{q:"Quel résumé relie correctement les principales transformations du Néolithique ?",c:["Nomades → sédentaires ; chasse-cueillette seules → agriculture-élevage ; pierre taillée seule → nouvelles techniques ; groupes simples → société plus organisée","Sédentaires → nomades ; agriculture → chasse seule ; villages → disparition de l’habitat","Agriculture → abandon des plantes ; élevage → disparition des animaux domestiques ; artisanat → fin des outils","Villages → grottes uniquement ; pierre polie → abandon des techniques ; mégalithes → absence de croyances"],a:0,e:"Le Néolithique combine sédentarisation, production de nourriture, nouvelles techniques et transformation de la société."}
];
let index=0,answers=Array(questions.length).fill(null),validated=Array(questions.length).fill(false);
let resultShown=false,mailState="idle",attemptId="";
const $=id=>document.getElementById(id);
function newAttemptId(){return "anne-neo2-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function correct(i){return answers[i]===questions[i].a}
function render(){const q=questions[index];$("qnum").textContent=`Question ${index+1} sur ${questions.length}`;$("question").textContent=q.q;$("answers").innerHTML="";q.c.forEach((choice,n)=>{const b=document.createElement("button");b.className="choice"+(answers[index]===n?" selected":"");b.textContent=choice;b.disabled=validated[index];b.addEventListener("click",()=>{answers[index]=n;render()});$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";if(validated[index]){if(correct(index)){$("feedback").className="feedback ok";$("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e}else{$("feedback").className="feedback bad";$("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e}$("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante"}else $("next").textContent="Valider";$("prev").disabled=index===0;$("prev").style.opacity=index===0?".45":"1";$("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%"}
$("next").addEventListener("click",()=>{if(!validated[index]){if(answers[index]===null){$("feedback").className="feedback bad";$("feedback").textContent="Choisis une réponse avant de valider.";return}validated[index]=true;render();return}if(index<questions.length-1){index++;render()}else showResult()});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){return questions.map((q,i)=>{const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];return `${i+1}. ${correct(i)?"OK":"ERREUR"} | Réponse Anne : ${given} | Bonne réponse : ${q.c[q.a]}`}).join("\n")}
async function sendResult(force=false){if(mailState==="sending"||mailState==="sent")return;if(mailState==="failed"&&!force)return;mailState="sending";$("retrySend").disabled=true;const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);const status=$("sendStatus");status.textContent="Envoi du résultat par e-mail…";const localDate=new Date().toLocaleString("fr-FR");if(!attemptId)attemptId=newAttemptId();const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");try{const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({"_subject":"Résultat Quiz Néolithique difficile – Anne : "+total+"/10","_template":"table","Élève":"Anne","Quiz":"Révolution néolithique – niveau difficile","Score":total+"/10","Pourcentage":(total*10)+" %","Date":localDate,"Identifiant tentative":attemptId,"Détail des réponses":buildDetails()})});if(!response.ok)throw new Error("send");mailState="sent";status.innerHTML="✅ Résultat envoyé une seule fois par e-mail."}catch(e){mailState="failed";$("retrySend").disabled=false;status.innerHTML="⚠️ L’envoi a échoué. Tu peux utiliser « Renvoyer si échec »."}}
function showResult(){if(resultShown)return;resultShown=true;$("next").disabled=true;$("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");$("bar").style.width="100%";const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);$("score").textContent=total+" / 10";$("message").textContent=total>=9?"Excellent : contrôle difficile maîtrisé !":total>=7?"Très bien !":total>=5?"Bon début, mais quelques notions fines sont à revoir.":"Il faut reprendre les deux fiches de révision.";$("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>`<div class='reviewItem'><b>${i+1}. ${correct(i)?"✅":"❌"}</b> ${q.e}</div>`).join("");sendResult()}
$("retrySend").addEventListener("click",()=>sendResult(true));
$("restart").addEventListener("click",()=>{index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);resultShown=false;mailState="idle";attemptId="";$("next").disabled=false;$("retrySend").disabled=true;$("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render()});
render();
</script>
</body>
</html>
