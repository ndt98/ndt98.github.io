<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contrôle Néolithique graphique – Anne</title>
<style>:root{--bg:#f3efe6;--card:#fff;--ink:#26221f;--muted:#6d655e;--accent:#765035;--sel:#f1e3d3;--ok:#eaf6ed;--bad:#fdecec;--line:#e5dbd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:820px;margin:auto;padding:14px}.hero,.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #0000000d}h1{margin:0 0 6px;font-size:1.5rem}.sub{color:var(--muted)}.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f8f2ea;font-size:.94rem}.progress{height:10px;background:#eee5dc;border-radius:999px;margin-top:16px;overflow:hidden}#bar{height:100%;width:0;background:var(--accent)}.qnum{font-size:.92rem;color:var(--muted);margin-bottom:7px}.question{font-size:1.18rem;font-weight:760;line-height:1.35;margin:0 0 16px}.answers{display:grid;gap:12px}.choice{width:100%;padding:12px;border:1px solid #d9cec3;border-radius:15px;background:#fff;text-align:left;font:inherit;color:var(--ink)}.choice.selected{background:var(--sel);border-color:var(--accent)}.choice:disabled{opacity:1}.choiceLabel{font-weight:800;margin-bottom:8px}.visual{border:1px solid #eadfd5;border-radius:12px;background:#fbfaf8;padding:8px;overflow:hidden}.visual svg{display:block;width:100%;height:auto}.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}.ok{display:block;background:var(--ok);color:#175929}.bad{display:block;background:var(--bad);color:#821f1f}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.action{flex:1;min-width:140px;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}.secondary{background:#eee7df}.primary{background:var(--accent);color:#fff}.hidden{display:none!important}.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0}.reviewItem{border-top:1px solid var(--line);padding:12px 0}@media(max-width:520px){main{padding:10px}.hero,.card{padding:16px;border-radius:17px}.question{font-size:1.08rem}.choice{padding:10px}}</style></head>
<body><main><section class="hero"><h1>🌾 Contrôle très difficile – Révolution néolithique</h1><div class="sub">10 questions • choix graphiques • niveau difficile</div><div class="note"><b>Important :</b> à chaque tentative, les propositions sont mélangées ET les lettres A/B/C/D sont réattribuées après le mélange. Il n’existe donc aucun « bon schéma A » fixe.</div><div class="progress"><div id="bar"></div></div></section>
<section class="card" id="quizCard"><div id="qnum" class="qnum"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="actions"><button class="action secondary" id="prev">← Précédent</button><button class="action primary" id="next">Valider</button></div></section>
<section class="card hidden" id="resultCard"><div style="text-align:center;color:#6d655e">Résultat final</div><div class="score" id="score"></div><div style="text-align:center" id="message"></div><div class="actions"><button class="action secondary" id="share">Partager le résultat</button><button class="action primary" id="restart">Recommencer</button></div><div id="review"></div></section></main>
<script>
const svg=t=>`<svg viewBox="0 0 360 120"><rect x="5" y="5" width="350" height="110" rx="12" fill="#fbfaf8" stroke="#e6ddd4"/><text x="180" y="62" text-anchor="middle" font-size="15" fill="#333">${t}</text></svg>`;
const timeline=(a,b,name)=>`<svg viewBox="0 0 360 115"><line x1="35" y1="55" x2="325" y2="55" stroke="#555" stroke-width="3"/><circle cx="70" cy="55" r="7" fill="#67a46a"/><circle cx="285" cy="55" r="7" fill="#b77b52"/><text x="45" y="32" font-size="14">${a}</text><text x="258" y="32" font-size="14">${b}</text><text x="135" y="88" font-size="15">${name}</text></svg>`;
const flow=(a,b,c)=>`<svg viewBox="0 0 360 120"><rect x="10" y="40" width="100" height="40" rx="10" fill="#f3dfbd"/><text x="60" y="64" text-anchor="middle" font-size="13">${a}</text><path d="M115 60H145" stroke="#555" stroke-width="3"/><polygon points="145,60 136,55 136,65" fill="#555"/><rect x="150" y="40" width="100" height="40" rx="10" fill="#d9ead2"/><text x="200" y="64" text-anchor="middle" font-size="13">${b}</text><path d="M255 60H282" stroke="#555" stroke-width="3"/><polygon points="282,60 273,55 273,65" fill="#555"/><text x="318" y="64" text-anchor="middle" font-size="12">${c}</text></svg>`;
const map=(mid,europe,other)=>`<svg viewBox="0 0 360 155"><rect width="360" height="155" fill="#eaf4f6"/><ellipse cx="80" cy="65" rx="46" ry="31" fill="#e8dccb"/><ellipse cx="165" cy="75" rx="37" ry="35" fill="#e8dccb"/><ellipse cx="255" cy="58" rx="62" ry="31" fill="#e8dccb"/><ellipse cx="307" cy="114" rx="27" ry="17" fill="#e8dccb"/><circle cx="205" cy="67" r="7" fill="#4f9e68"/><text x="183" y="91" font-size="11">${mid}</text><text x="129" y="31" font-size="12">${europe}</text><text x="237" y="126" font-size="11">${other}</text></svg>`;
const mega=(left,right)=>`<svg viewBox="0 0 360 130"><g transform="translate(55,12)"><path d="M30 85 L40 18 L58 12 L70 85Z" fill="#979187"/><text x="48" y="112" text-anchor="middle" font-size="13">${left}</text></g><g transform="translate(190,12)"><rect x="20" y="42" width="25" height="48" fill="#979187"/><rect x="90" y="42" width="25" height="48" fill="#979187"/><rect x="10" y="25" width="115" height="25" rx="4" fill="#878177"/><text x="68" y="112" text-anchor="middle" font-size="13">${right}</text></g></svg>`;
const cards=(a,b,c)=>`<svg viewBox="0 0 360 135"><rect x="10" y="18" width="100" height="85" rx="12" fill="#f4dfbc"/><rect x="130" y="18" width="100" height="85" rx="12" fill="#dcebd7"/><rect x="250" y="18" width="100" height="85" rx="12" fill="#dae7f3"/><text x="60" y="63" text-anchor="middle" font-size="12">${a}</text><text x="180" y="63" text-anchor="middle" font-size="12">${b}</text><text x="300" y="63" text-anchor="middle" font-size="12">${c}</text></svg>`;
const base=[
{kind:"Schéma",q:"Quel schéma situe correctement le Néolithique ?",opts:[{v:timeline("-10 000","-3 000","Néolithique"),ok:1},{v:timeline("-3 000","-10 000","Néolithique")},{v:timeline("-300 000","-10 000","Néolithique")},{v:timeline("-10 000","-3 000","Paléolithique")}],e:"Le Néolithique est situé approximativement entre -10 000 et -3 000 dans le cours."},
{kind:"Plan",q:"Quel planisphère simplifié correspond le mieux à la naissance et à la diffusion du Néolithique étudiées ?",opts:[{v:map("Proche-Orient","Europe = diffusion","autres foyers ailleurs"),ok:1},{v:map("Proche-Orient = diffusion","Europe = foyer principal","aucun autre foyer")},{v:map("aucun foyer","Europe = seul foyer","tout part d’Europe")},{v:map("Proche-Orient","Europe = aucun lien","un seul foyer mondial")}],e:"Le Proche-Orient est un foyer majeur étudié ; l’Europe reçoit ensuite l’agriculture et l’élevage par diffusion, et d’autres foyers existent dans le monde."},
{kind:"Schéma",q:"Quel enchaînement traduit le mieux le changement de mode de vie ?",opts:[{v:flow("Nomadisme","Sédentarité","Villages"),ok:1},{v:flow("Sédentarité","Nomadisme","Grottes")},{v:flow("Agriculture","Nomadisme","Chasse")},{v:flow("Villages","Nomadisme","Déplacements")}],e:"La révolution néolithique s’accompagne d’un passage progressif du nomadisme à la sédentarité et à la vie en villages."},
{kind:"Schéma",q:"Quel enchaînement explique correctement le rôle du défrichement ?",opts:[{v:flow("Défricher","Cultiver","Produire"),ok:1},{v:flow("Défricher","Construire","Mégalithe")},{v:flow("Défricher","Domestiquer","Mouton")},{v:flow("Cultiver","Défricher","Nomadisme")}],e:"Défricher signifie enlever la végétation avant de mettre une terre en culture."},
{kind:"Schéma",q:"Quel trio représente uniquement de nouvelles activités de production du Néolithique ?",opts:[{v:cards("Cultiver","Élever","Produire"),ok:1},{v:cards("Chasser","Cueillir","Nomadiser")},{v:cards("Imprimer","Monnayer","Naviguer")},{v:cards("Écrire","Forger fer","Imprimer")}],e:"L’agriculture et l’élevage permettent de produire une partie de la nourriture."},
{kind:"Schéma",q:"Quel trio correspond aux nouvelles techniques citées dans la leçon ?",opts:[{v:cards("Pierre polie","Céramique","Filage/tissage"),ok:1},{v:cards("Fer","Imprimerie","Monnaie")},{v:cards("Papier","Boussole","Poudre")},{v:cards("Moteur","Verre","Acier")}],e:"Le cours retient notamment la pierre polie, la céramique, le filage et le tissage de la laine."},
{kind:"Schéma",q:"Quel schéma correspond aux transformations de la société néolithique ?",opts:[{v:cards("Chef","Artisans","Croyances"),ok:1},{v:cards("Nomadisme","Aucun métier","Aucune croyance")},{v:cards("Imprimerie","Banque","Usine")},{v:cards("Chasse seule","Grottes","Aucun village")}],e:"Le cours mentionne une organisation autour d’un chef, l’apparition d’artisans et des croyances."},
{kind:"Schéma",q:"Quel dessin nomme correctement ces deux mégalithes ?",opts:[{v:mega("Menhir","Dolmen"),ok:1},{v:mega("Dolmen","Menhir")},{v:mega("Hache","Poterie")},{v:mega("Village","Champ")}],e:"Le menhir est une pierre dressée ; le dolmen est une construction en grandes pierres, souvent associée à une tombe collective."},
{kind:"Réponse",q:"Quelle définition de « artisan » est conforme à la fiche du contrôle ?",opts:[{label:"Personne qui fabrique des objets à la main",ok:1},{label:"Personne qui se déplace régulièrement"},{label:"Personne qui cultive uniquement le blé"},{label:"Personne qui dirige obligatoirement le village"}],e:"Un artisan fabrique des objets à la main."},
{kind:"Plan",q:"Quel plan de réponse serait le plus complet pour expliquer les conséquences de la révolution néolithique au contrôle ?",opts:[{v:cards("1. Mode de vie","2. Activités/techniques","3. Société"),label:"Sédentarité et villages → agriculture/élevage et techniques → organisation sociale, artisans, croyances et mégalithes",ok:1},{v:cards("1. Dates","2. Dates","3. Dates"),label:"Parler uniquement de -10 000 et -3 000"},{v:cards("1. Mégalithes","2. Mégalithes","3. Mégalithes"),label:"Parler uniquement des menhirs et dolmens"},{v:cards("1. Carte","2. Carte","3. Carte"),label:"Décrire uniquement le planisphère"}],e:"La fiche demande d’expliquer le nouveau mode de vie, les nouvelles activités, les nouvelles techniques et la transformation de la société."}
];
function mix(q){const opts=q.opts.map(o=>({...o}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return {...q,opts,a:opts.findIndex(o=>o.ok)}}
let questions=base.map(mix),index=0,answers=Array(base.length).fill(null),validated=Array(base.length).fill(false);const $=id=>document.getElementById(id),letters=["A","B","C","D"],correct=i=>answers[i]===questions[i].a;
function render(){const q=questions[index];$("qnum").textContent=`Question ${index+1} sur ${questions.length}`;$("question").textContent=q.q;$("answers").innerHTML="";q.opts.forEach((o,n)=>{const b=document.createElement("button");b.className="choice"+(answers[index]===n?" selected":"");b.disabled=validated[index];let h=`<div class='choiceLabel'>${q.kind} ${letters[n]}</div>`;if(o.label)h+=`<div>${o.label}</div>`;if(o.v)h+=`<div class='visual'>${o.v}</div>`;b.innerHTML=h;b.onclick=()=>{answers[index]=n;render()};$("answers").appendChild(b)});$("feedback").className="feedback";$("feedback").innerHTML="";if(validated[index]){$("feedback").className="feedback "+(correct(index)?"ok":"bad");const good=`${q.kind} ${letters[q.a]}`;$("feedback").innerHTML=correct(index)?"✅ Bonne réponse !<br>"+q.e:`❌ À revoir.<br><b>Bonne réponse : ${good}</b><br>${q.e}`;$("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante"}else $("next").textContent="Valider";$("prev").disabled=index===0;$("prev").style.opacity=index===0?".45":"1";$("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%"}
$("next").onclick=()=>{if(!validated[index]){if(answers[index]===null){$("feedback").className="feedback bad";$("feedback").textContent="Choisis une réponse avant de valider.";return}validated[index]=true;render();return}if(index<questions.length-1){index++;render()}else showResult()};$("prev").onclick=()=>{if(index>0){index--;render()}};
function total(){return questions.reduce((s,_,i)=>s+(correct(i)?1:0),0)}function showResult(){$("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");$("bar").style.width="100%";const t=total();$("score").textContent=t+" / "+questions.length;$("message").textContent=t>=9?"Excellent : niveau contrôle très bien maîtrisé !":t>=7?"Très bien : revois surtout les erreurs.":t>=5?"Bon début, mais plusieurs liens entre notions sont encore à consolider.":"Reprends les deux fiches de révision avant de recommencer.";$("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>`<div class='reviewItem'><b>${i+1}. ${correct(i)?"✅":"❌"}</b> ${q.e}</div>`).join("")}
$("share").onclick=async()=>{const text=`Anne – Contrôle Néolithique graphique difficile : ${total()}/${questions.length}`;if(navigator.share){try{await navigator.share({title:"Résultat quiz Anne",text})}catch(e){}}else alert(text)};$("restart").onclick=()=>{questions=base.map(mix);index=0;answers=Array(base.length).fill(null);validated=Array(base.length).fill(false);$("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render()};render();
</script></body></html>
