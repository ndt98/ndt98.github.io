<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priorités des opérations – Anne</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#171717}main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:22px;font-weight:700}.q input{width:110px;font-size:20px;padding:9px;text-align:center;border:1px solid #bbb;border-radius:10px}.tip{display:none;color:#666;margin-top:8px;font-size:14px}.ok{background:#e9f7ed}.bad{background:#fdecec}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:700;background:#172033;color:white;margin-top:10px}.secondary{background:#e6e9ee;color:#111}#result{display:none}</style></head><body><main><div class="card"><h1>Priorités des opérations – Anne</h1><p>10 calculs simples, avec ou sans parenthèses.</p><p><b>Ordre :</b> parenthèses → × et ÷ → + et −. À même priorité : de gauche à droite.</p></div><div id="result" class="card"></div><form id="quiz"></form><button type="button" id="correct">Corriger et envoyer la note</button><button type="button" id="again" class="secondary">Nouvelle série</button></main><script>const EMAIL=['ndt2004','gmail.com'].join('@');const quiz=document.getElementById('quiz'),result=document.getElementById('result');let questions=[],sent=false,locked=false;const bank=[['8 + 3 × 4',20,'3 × 4 = 12, puis 8 + 12.'],['(8 + 3) × 4',44,'8 + 3 = 11, puis 11 × 4.'],['18 − 2 × 5',8,'2 × 5 = 10, puis 18 − 10.'],['(18 − 2) × 5',80,'18 − 2 = 16, puis 16 × 5.'],['24 ÷ 6 + 3',7,'24 ÷ 6 = 4, puis 4 + 3.'],['24 ÷ (6 + 2)',3,'6 + 2 = 8, puis 24 ÷ 8.'],['7 + 12 ÷ 3',11,'12 ÷ 3 = 4, puis 7 + 4.'],['(6 + 12) ÷ 3',6,'6 + 12 = 18, puis 18 ÷ 3.'],['5 × 4 − 7',13,'5 × 4 = 20, puis 20 − 7.'],['5 × (4 − 1)',15,'4 − 1 = 3, puis 5 × 3.'],['30 − 18 ÷ 3',24,'18 ÷ 3 = 6, puis 30 − 6.'],['(30 − 18) ÷ 3',4,'30 − 18 = 12, puis 12 ÷ 3.'],['6 + 2 × 9',24,'2 × 9 = 18, puis 6 + 18.'],['(6 + 2) × 9',72,'6 + 2 = 8, puis 8 × 9.'],['40 ÷ 5 × 2',16,'Même priorité : 40 ÷ 5 = 8, puis 8 × 2.'],['40 ÷ (5 × 2)',4,'5 × 2 = 10, puis 40 ÷ 10.'],['3 × 8 + 6',30,'3 × 8 = 24, puis 24 + 6.'],['3 × (8 + 6)',42,'8 + 6 = 14, puis 3 × 14.'],['50 − 4 × 7',22,'4 × 7 = 28, puis 50 − 28.'],['(50 − 8) ÷ 7',6,'50 − 8 = 42, puis 42 ÷ 7.'],['12 + 4 × 5',32,'4 × 5 = 20, puis 12 + 20.'],['(12 + 4) × 5',80,'12 + 4 = 16, puis 16 × 5.'],['36 ÷ 6 + 2',8,'36 ÷ 6 = 6, puis 6 + 2.'],['36 ÷ (6 + 3)',4,'6 + 3 = 9, puis 36 ÷ 9.']];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){questions=shuffle(bank).slice(0,10);quiz.innerHTML='';result.style.display='none';sent=false;locked=false;questions.forEach((x,i)=>quiz.insertAdjacentHTML('beforeend','<div class="card" id="c'+i+'"><div class="q"><span>'+x[0]+' =</span><input type="number" inputmode="numeric" id="a'+i+'"></div><div id="s'+i+'"></div><div class="tip" id="t'+i+'">Méthode : '+x[2]+'</div></div>'))}async function send(score,details){if(sent)return;sent=true;try{await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Priorités des opérations – Anne – '+score+'/10','Élève':'Anne','Score':score+'/10','Détail':details})})}catch(e){}}document.getElementById('correct').onclick=()=>{if(locked)return;locked=true;let score=0,details=[];questions.forEach((x,i)=>{let input=document.getElementById('a'+i),v=input.value.trim(),c=document.getElementById('c'+i),s=document.getElementById('s'+i),t=document.getElementById('t'+i);if(v!==''&&Number(v)===x[1]){score++;c.classList.add('ok');s.textContent='Juste.'}else{c.classList.add('bad');s.textContent='Réponse : '+x[1]}t.style.display='block';input.disabled=true;details.push(x[0]+' = '+(v||'—')+' ; attendu '+x[1])});result.style.display='block';result.innerHTML='<h2>'+score+' / 10</h2><p>'+(score>=9?'Très bien.':score>=7?'Bon niveau, encore une série.':'Revoir : parenthèses, puis × et ÷, puis + et −.')+'</p><p>Résultat envoyé par e-mail.</p>';send(score,details.join('\n'));scrollTo({top:0,behavior:'smooth'})};document.getElementById('again').onclick=render;render();</script></body></html>
