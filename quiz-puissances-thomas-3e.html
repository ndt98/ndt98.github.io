<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Puissances – Thomas – début 3e</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#d9dee6;--text:#17191d;--muted:#646b75;--accent:#172033;--ok:#eaf7ed;--bad:#fdecec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}main{max-width:760px;margin:auto;padding:16px 14px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}h1{font-size:25px;margin:0 0 7px}.sub{margin:0;color:var(--muted);line-height:1.45}.rule{margin-top:12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;line-height:1.45}.qtext{font-size:19px;font-weight:760;line-height:1.4;margin:0 0 11px}.option{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;background:#fff;font-size:17px;line-height:1.35}.option input{transform:scale(1.15);margin-right:8px}.correct{background:var(--ok);border-color:#99c5a3}.incorrect{background:var(--bad);border-color:#e0a0a0}.explain{display:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);line-height:1.4}.actions{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 74%,rgba(245,247,251,0))}button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:800;background:var(--accent);color:#fff}button.secondary{margin-top:8px;background:#e5e9ef;color:#111}#result{display:none;border:2px solid var(--accent)}#score{font-size:30px;font-weight:850;margin:0 0 6px}#feedback{margin:0;color:var(--muted);line-height:1.4}#mail{margin-top:10px;font-size:14px;color:var(--muted)}sup{font-size:.68em}
</style>
</head>
<body><main>
<div class="card"><h1>Puissances – Thomas</h1><p class="sub">Début de 3e · 10 exercices tirés au hasard. Simplification, exposants négatifs, puissances de 10, signes et fractions.</p><div class="rule"><b>À retenir :</b> même base et produit → on additionne les exposants ; quotient → on les soustrait ; puissance d'une puissance → on multiplie les exposants.</div></div>
<div id="result" class="card"><p id="score"></p><p id="feedback"></p><div id="mail"></div></div>
<form id="quiz"></form>
<div class="actions"><button type="button" id="correctBtn">Corriger et envoyer la note</button><button type="button" id="againBtn" class="secondary">Nouvelle série</button></div>
</main>
<script>
const EMAIL='ndt2004@gmail.com';
const bank=[
{q:'Simplifier : 2<sup>3</sup> × 2<sup>4</sup>',c:['2<sup>7</sup>','2<sup>12</sup>','4<sup>7</sup>','2<sup>1</sup>'],a:'2<sup>7</sup>',e:'Même base et multiplication : 3 + 4 = 7.'},
{q:'Simplifier : 5<sup>6</sup> ÷ 5<sup>2</sup>',c:['5<sup>4</sup>','5<sup>8</sup>','1','5<sup>3</sup>'],a:'5<sup>4</sup>',e:'Même base et division : 6 − 2 = 4.'},
{q:'Simplifier : (3<sup>2</sup>)<sup>4</sup>',c:['3<sup>8</sup>','3<sup>6</sup>','9<sup>4</sup>','3<sup>2</sup>'],a:'3<sup>8</sup>',e:'Puissance d’une puissance : 2 × 4 = 8.'},
{q:'Simplifier : 10<sup>−3</sup> × 10<sup>5</sup>',c:['10<sup>2</sup>','10<sup>−8</sup>','10<sup>8</sup>','10<sup>−2</sup>'],a:'10<sup>2</sup>',e:'On additionne les exposants : −3 + 5 = 2.'},
{q:'Calculer : 7<sup>−2</sup>',c:['1/49','−49','49','1/14'],a:'1/49',e:'Un exposant négatif donne l’inverse : 7⁻² = 1/7² = 1/49.'},
{q:'Calculer : (2/5)<sup>−2</sup>',c:['25/4','4/25','−25/4','10/4'],a:'25/4',e:'On inverse la fraction puis on élève au carré : (5/2)² = 25/4.'},
{q:'Calculer : −3<sup>2</sup>',c:['−9','9','−6','6'],a:'−9',e:'Sans parenthèses, la puissance est prioritaire : −3² = −(3²) = −9.'},
{q:'Calculer : (−3)<sup>2</sup>',c:['9','−9','6','−6'],a:'9',e:'Les parenthèses font partie de la base : (−3)² = 9.'},
{q:'Compléter : (2 × 5)<sup>3</sup> = ...',c:['2<sup>3</sup> × 5<sup>3</sup>','2<sup>3</sup> × 5','2 × 5<sup>3</sup>','2<sup>6</sup> × 5<sup>6</sup>'],a:'2<sup>3</sup> × 5<sup>3</sup>',e:'La puissance d’un produit s’applique à chaque facteur.'},
{q:'Calculer : (3/4)<sup>2</sup>',c:['9/16','6/8','9/8','3/16'],a:'9/16',e:'On élève le numérateur et le dénominateur au carré.'},
{q:'Écrire sous forme décimale : 10<sup>−4</sup>',c:['0,0001','0,001','0,00001','10 000'],a:'0,0001',e:'10⁻⁴ = 1/10 000 = 0,0001.'},
{q:'Écrire comme puissance de 10 : 0,00001',c:['10<sup>−5</sup>','10<sup>5</sup>','10<sup>−4</sup>','10<sup>−6</sup>'],a:'10<sup>−5</sup>',e:'Il faut cinq rangs pour passer de 1 à 0,00001.'},
{q:'Simplifier en une seule puissance : 2<sup>−3</sup> × 2<sup>5</sup> ÷ 2<sup>−1</sup>',c:['2<sup>3</sup>','2<sup>1</sup>','2<sup>−9</sup>','2<sup>−3</sup>'],a:'2<sup>3</sup>',e:'−3 + 5 − (−1) = 3.'},
{q:'Simplifier : 3<sup>4</sup> ÷ 3<sup>−2</sup>',c:['3<sup>6</sup>','3<sup>2</sup>','3<sup>−6</sup>','3<sup>−2</sup>'],a:'3<sup>6</sup>',e:'4 − (−2) = 4 + 2 = 6.'},
{q:'Simplifier : (5<sup>−2</sup>)<sup>−3</sup>',c:['5<sup>6</sup>','5<sup>−6</sup>','5<sup>−5</sup>','5<sup>1</sup>'],a:'5<sup>6</sup>',e:'On multiplie les exposants : (−2) × (−3) = 6.'},
{q:'Simplifier : 10<sup>7</sup> ÷ 10<sup>9</sup>',c:['10<sup>−2</sup>','10<sup>2</sup>','10<sup>16</sup>','10<sup>−16</sup>'],a:'10<sup>−2</sup>',e:'7 − 9 = −2.'},
{q:'Calculer : 4<sup>0</sup>',c:['1','0','4','−1'],a:'1',e:'Pour toute base non nulle, a⁰ = 1.'},
{q:'Compléter : (ab)<sup>4</sup> = ...',c:['a<sup>4</sup>b<sup>4</sup>','ab<sup>4</sup>','a<sup>4</sup>b','a<sup>8</sup>b<sup>8</sup>'],a:'a<sup>4</sup>b<sup>4</sup>',e:'La puissance d’un produit s’applique à chacun des facteurs.'},
{q:'Simplifier : (a<sup>3</sup>)<sup>2</sup> × a<sup>−1</sup>',c:['a<sup>5</sup>','a<sup>4</sup>','a<sup>6</sup>','a<sup>−5</sup>'],a:'a<sup>5</sup>',e:'(a³)² = a⁶ puis a⁶ × a⁻¹ = a⁵.'},
{q:'Simplifier : 2<sup>3</sup> × 5<sup>3</sup>',c:['10<sup>3</sup>','10<sup>6</sup>','7<sup>3</sup>','2<sup>15</sup>'],a:'10<sup>3</sup>',e:'Même exposant : 2³ × 5³ = (2 × 5)³ = 10³.'}
];
const quiz=document.getElementById('quiz'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),feedback=document.getElementById('feedback'),mail=document.getElementById('mail');
let questions=[],sent=false,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newSeries(){questions=shuffle(bank).slice(0,10);sent=false;locked=false;quiz.innerHTML='';result.style.display='none';mail.textContent='';questions.forEach((item,i)=>{const card=document.createElement('section');card.className='card';card.id='card'+i;const p=document.createElement('p');p.className='qtext';p.innerHTML=item.q;card.appendChild(p);shuffle(item.c).forEach(choice=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=choice;label.appendChild(input);const span=document.createElement('span');span.innerHTML=choice;label.appendChild(span);card.appendChild(label)});const ex=document.createElement('div');ex.className='explain';ex.innerHTML=item.e;card.appendChild(ex);quiz.appendChild(card)})}
async function sendMail(score,details){if(sent)return;sent=true;mail.textContent='Envoi de la note par e-mail…';try{const r=await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'Quiz puissances 3e – Thomas – '+score+'/10','Élève':'Thomas','Thème':'Puissances – début de 3e','Score':score+'/10','Détail':details})});if(!r.ok)throw new Error();mail.textContent='✅ Note envoyée par e-mail.'}catch(e){mail.textContent='⚠️ Quiz corrigé, mais l’envoi de la note a échoué.'}}
document.getElementById('correctBtn').onclick=()=>{if(locked)return;locked=true;let score=0,details=[];questions.forEach((item,i)=>{const card=document.getElementById('card'+i),opts=card.querySelectorAll('.option'),sel=card.querySelector('input:checked');let chosen='—';opts.forEach(l=>{l.classList.remove('correct','incorrect');const inp=l.querySelector('input');if(inp.value===item.a)l.classList.add('correct')});if(sel){chosen=sel.value;if(sel.value===item.a)score++;else sel.closest('.option').classList.add('incorrect')}card.querySelector('.explain').style.display='block';details.push(item.q.replace(/<[^>]+>/g,'')+' | réponse Thomas : '+chosen.replace(/<[^>]+>/g,'')+' | attendu : '+item.a.replace(/<[^>]+>/g,''))});scoreEl.textContent=score+' / 10';feedback.textContent=score>=9?'Très bon niveau.':score>=7?'Bon niveau, mais certaines règles doivent encore devenir automatiques.':score>=5?'Les bases sont là, mais il faut encore manipuler les exposants.':'Revoir les règles essentielles puis refaire une nouvelle série.';result.style.display='block';sendMail(score,details.join('\n'));result.scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('againBtn').onclick=newSeries;newSeries();
</script></body></html>
