<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ef">
<title>Quiz SVT 2 – Anne</title>
<style>
:root{--bg:#eef7ef;--card:#fff;--ink:#203126;--muted:#68756c;--accent:#2f7d4a;--accent2:#e2f2e6;--ok:#21733b;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#dfe9e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted);line-height:1.4}
.progress{height:10px;background:#dfeadf;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.35;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #cddbd0;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink)}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}
.secondary{background:#e7eee8;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f3f7f3;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🌿 Quiz SVT 2 – Anne</h1>
<div class="sub">Biodiversité et changements du peuplement au cours des saisons • 10 nouvelles questions</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Au printemps, avant que les chênes aient toutes leurs feuilles, pourquoi trouve-t-on beaucoup de lumière au niveau du sol ?",c:["Les arbres produisent eux-mêmes de la lumière","Le feuillage des arbres n'est pas encore complètement développé","Les jours sont plus courts","Les plantes du sol repoussent la lumière"],a:1,e:"Avant le développement complet des feuilles des arbres, davantage de lumière atteint le sous-bois."},
 {q:"Une plante passe l'hiver sous forme de bulbe puis refait des feuilles au printemps. Qu'est-ce que cela montre ?",c:["Elle a disparu définitivement en hiver","Elle change de forme ou d'état au cours des saisons","Elle migre comme un oiseau","Elle devient un champignon"],a:1,e:"Certains végétaux restent présents mais sous une forme moins visible, par exemple un bulbe souterrain."},
 {q:"Un animal quitte l'Europe en hiver puis revient au printemps pour se reproduire. Comment appelle-t-on ce comportement ?",c:["Une germination","Une migration","Une hibernation","Une reproduction végétative"],a:1,e:"Un déplacement saisonnier vers une autre région est une migration."},
 {q:"Quelle situation correspond le mieux à une hibernation ?",c:["Un animal reste actif et cherche sa nourriture chaque nuit","Un animal passe l'hiver dans un abri avec une activité fortement ralentie","Un animal perd ses feuilles","Un animal change de continent chaque saison"],a:1,e:"Pendant l'hibernation, l'animal passe une partie de l'hiver à l'abri avec une activité très réduite."},
 {q:"Pourquoi dit-on que le peuplement d'une forêt change au cours de l'année ?",c:["Parce que les roches se déplacent","Parce que toutes les espèces meurent chaque hiver","Parce que certaines espèces deviennent visibles, disparaissent temporairement, migrent ou hibernent selon la saison","Parce que le sol change de couleur"],a:2,e:"La présence visible et l'activité des êtres vivants varient avec les saisons."},
 {q:"En automne, de nombreux arbres à feuilles caduques perdent leurs feuilles. Que signifie « caduques » ?",c:["Qui tombent à une certaine saison","Qui restent vertes toute l'année","Qui poussent uniquement sous terre","Qui appartiennent aux champignons"],a:0,e:"Des feuilles caduques tombent à une période de l'année, généralement en automne."},
 {q:"Lequel de ces exemples montre un animal qui reste actif toute l'année plutôt qu'un animal migrateur ou hibernant ?",c:["Un oiseau qui part en Afrique en hiver","Une salamandre cachée et inactive en hiver","Un animal observé en train de se nourrir en hiver comme en été","Un animal qui dort plusieurs mois dans son terrier"],a:2,e:"Rester actif toute l'année signifie continuer à se déplacer et à se nourrir au fil des saisons."},
 {q:"Deux individus se ressemblent mais ne peuvent pas avoir ensemble une descendance fertile. Peut-on affirmer qu'ils appartiennent à la même espèce ?",c:["Oui, la ressemblance suffit toujours","Non, la capacité à produire une descendance fertile fait partie du critère d'espèce","Oui, s'ils vivent dans la même forêt","Oui, s'ils ont la même taille"],a:1,e:"La ressemblance seule ne suffit pas : la reproduction donnant une descendance fertile est un critère important de l'espèce."},
 {q:"Parmi ces ensembles, lequel illustre le mieux la biodiversité d'une forêt ?",c:["Un seul chêne","Des chênes, des champignons, des oiseaux, des salamandres et des bactéries","Seulement les animaux visibles","Uniquement les plantes à fleurs"],a:1,e:"La biodiversité correspond à la variété des êtres vivants présents dans un milieu."},
 {q:"Quelle phrase résume le mieux l'effet des saisons sur les êtres vivants d'une forêt ?",c:["Tous réagissent de la même manière au froid","Les saisons n'ont aucun effet sur leur activité","Selon les espèces, on observe différentes stratégies : perte des feuilles, vie sous forme de bulbe, migration, hibernation ou maintien de l'activité","Tous quittent la forêt en hiver"],a:2,e:"Les espèces utilisent des stratégies différentes pour traverser les saisons."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   } else {
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 } else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()} else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz SVT 2 – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"SVT 2 – Biodiversité et saisons",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques points sont à revoir.":"Il faut encore revoir le cours.";
 $("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
