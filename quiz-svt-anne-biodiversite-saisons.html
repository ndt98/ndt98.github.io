<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ef">
<title>Quiz SVT – Anne – Biodiversité et saisons</title>
<style>
:root{--bg:#eef7ef;--card:#fff;--ink:#203126;--muted:#68756c;--accent:#2f7d4a;--accent2:#e2f2e6;--ok:#21733b;--okbg:#eaf6ed;--bad:#a42828;--badbg:#fdecec;--line:#dfe9e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 5px 18px #0000000d}
.hero{padding:20px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:1.55rem}.sub{color:var(--muted);line-height:1.4}
.progress{height:10px;background:#dfeadf;border-radius:99px;margin-top:16px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{padding:20px}
#qnum{color:var(--muted);font-size:.92rem;margin-bottom:7px}
#question{font-size:1.22rem;font-weight:750;line-height:1.35;margin:0 0 16px}
.answers{display:grid;gap:10px}
.choice{width:100%;border:1px solid #cddbd0;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink)}
.choice.selected{background:var(--accent2);border-color:var(--accent)}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;line-height:1.4}
.feedback.ok{display:block;background:var(--okbg);color:#175b2b}
.feedback.bad{display:block;background:var(--badbg);color:#821f1f}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{flex:1;border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:750}
.secondary{background:#e7eee8;color:var(--ink)}.primary{background:var(--accent);color:#fff}
.hidden{display:none!important}
.score{text-align:center;font-size:3.2rem;font-weight:850;margin:12px 0 4px}
.center{text-align:center}
#sendStatus{margin:16px 0;padding:12px;border-radius:12px;background:#f3f7f3;line-height:1.4}
.review{margin-top:18px}
.reviewItem{border-top:1px solid var(--line);padding:12px 0;line-height:1.4}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px}.hero,.card{border-radius:18px}#question{font-size:1.14rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🌿 Quiz SVT – Anne</h1>
<div class="sub">Biodiversité • êtres vivants • changements du peuplement au fil des saisons • 10 questions</div>
<div class="progress"><div id="bar"></div></div>
</section>

<section class="card" id="quizCard">
<div id="qnum"></div>
<div id="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action secondary" id="prev">← Précédent</button>
<button class="action primary" id="next">Valider</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<div class="center small">Résultat final</div>
<div class="score" id="score"></div>
<div class="center" id="message"></div>
<div id="sendStatus">Envoi du résultat par e-mail…</div>
<div class="actions">
<button class="action secondary" id="retrySend">Renvoyer le résultat</button>
<button class="action primary" id="restart">Recommencer</button>
</div>
<div class="review" id="review"></div>
</section>
</main>

<script>
const questions=[
 {q:"Quelle définition correspond le mieux à un être vivant ?",c:["Un objet qui se déplace tout seul","Un individu qui naît, se nourrit, se développe, se reproduit puis meurt","Tout ce qui est visible à l'œil nu","Un animal uniquement"],a:1,e:"Un être vivant naît, se nourrit, se développe, se reproduit et finit par mourir."},
 {q:"Qu'est-ce qu'une espèce ?",c:["Un groupe d'êtres vivants qui vivent au même endroit","Un groupe d'êtres vivants qui se ressemblent et peuvent se reproduire entre eux en donnant une descendance fertile","Tous les animaux d'une forêt","Tous les êtres vivants ayant la même taille"],a:1,e:"Des individus d'une même espèce se ressemblent et peuvent se reproduire entre eux en donnant une descendance fertile."},
 {q:"Que signifie « une descendance fertile » ?",c:["Des petits capables, à leur tour, de se reproduire","Des petits qui vivent forcément longtemps","Des petits tous identiques à leurs parents","Des petits qui naissent uniquement au printemps"],a:0,e:"« Fertile » signifie que la descendance est elle-même capable de se reproduire."},
 {q:"Qu'appelle-t-on biodiversité dans un milieu ?",c:["La quantité de lumière reçue","La variété des espèces présentes","Le nombre d'arbres seulement","La température moyenne"],a:1,e:"La biodiversité correspond à la diversité, donc à la variété des espèces présentes dans un milieu."},
 {q:"Quels sont les quatre grands groupes d'êtres vivants cités dans le cours ?",c:["Animaux, végétaux, champignons et bactéries","Animaux, roches, eau et végétaux","Végétaux, insectes, poissons et oiseaux","Champignons, mammifères, arbres et reptiles"],a:0,e:"Le cours distingue notamment quatre grands groupes : animaux, végétaux, champignons et bactéries."},
 {q:"Comment les jacinthes des bois passent-elles l'hiver ?",c:["Sous forme de graines dans les arbres","Sous forme de bulbes souterrains","En restant fleuries tout l'hiver","En migrant vers une région plus chaude"],a:1,e:"Les jacinthes des bois passent l'hiver sous forme de bulbes souterrains."},
 {q:"Pourquoi les jacinthes des bois font-elles leurs feuilles et leurs fleurs au printemps avant que les arbres aient toutes leurs feuilles ?",c:["Pour profiter de la lumière qui atteint encore le sous-bois","Pour empêcher les arbres de pousser","Parce qu'elles ne supportent aucune lumière","Pour attirer les animaux qui hibernent"],a:0,e:"Au début du printemps, la lumière arrive encore bien dans le sous-bois avant le développement complet des feuilles des arbres."},
 {q:"Que fait le hibou petit-duc pendant l'hiver ?",c:["Il hiberne sous terre","Il reste toute l'année dans la même forêt","Il passe l'hiver en Afrique équatoriale puis revient en Europe au printemps pour se reproduire","Il vit sous forme de larve"],a:2,e:"Le petit-duc passe l'hiver en Afrique équatoriale et revient en Europe au printemps pour se reproduire : c'est une migration saisonnière."},
 {q:"Quel comportement saisonnier est décrit pour la salamandre tachetée ?",c:["Elle migre vers l'Afrique","Elle hiberne sous terre ou dans des galeries et ressort au printemps","Elle reste active sans interruption toute l'année","Elle perd ses feuilles en automne"],a:1,e:"La salamandre tachetée hiberne sous terre ou dans des galeries, puis ressort au printemps."},
 {q:"Quelle conclusion résume le mieux le peuplement d'une forêt au cours de l'année ?",c:["Il reste exactement identique en toute saison","Il change : certains végétaux perdent leurs feuilles, certains animaux migrent ou hibernent et d'autres restent actifs","Tous les animaux hibernent en hiver","Toutes les espèces disparaissent en automne"],a:1,e:"Le peuplement de la forêt change avec les saisons : les êtres vivants n'ont pas tous la même stratégie face aux variations saisonnières."}
];

let index=0;
let answers=Array(questions.length).fill(null);
let validated=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function correct(i){return answers[i]===questions[i].a}
function render(){
 const q=questions[index];
 $("qnum").textContent="Question "+(index+1)+" sur "+questions.length;
 $("question").textContent=q.q;
 $("answers").innerHTML="";
 q.c.forEach((choice,n)=>{
   const b=document.createElement("button");
   b.className="choice"+(answers[index]===n?" selected":"");
   b.textContent=choice;
   b.disabled=validated[index];
   b.addEventListener("click",()=>{answers[index]=n;render()});
   $("answers").appendChild(b);
 });
 $("feedback").className="feedback";
 $("feedback").innerHTML="";
 if(validated[index]){
   if(correct(index)){
     $("feedback").className="feedback ok";
     $("feedback").innerHTML="✅ Bonne réponse !<br>"+q.e;
   } else {
     $("feedback").className="feedback bad";
     $("feedback").innerHTML="❌ À revoir.<br><b>Bonne réponse :</b> "+q.c[q.a]+"<br>"+q.e;
   }
   $("next").textContent=index===questions.length-1?"Voir le résultat":"Question suivante";
 } else $("next").textContent="Valider";
 $("prev").disabled=index===0;
 $("prev").style.opacity=index===0?".45":"1";
 $("bar").style.width=((index+(validated[index]?1:0))/questions.length*100)+"%";
}
$("next").addEventListener("click",()=>{
 if(!validated[index]){
   if(answers[index]===null){
     $("feedback").className="feedback bad";
     $("feedback").textContent="Choisis une réponse avant de valider.";
     return;
   }
   validated[index]=true;render();return;
 }
 if(index<questions.length-1){index++;render()} else showResult();
});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
function buildDetails(){
 return questions.map((q,i)=>{
   const given=answers[i]===null?"Aucune réponse":q.c[answers[i]];
   return (i+1)+". "+(correct(i)?"OK":"ERREUR")+" | Réponse Anne : "+given+" | Bonne réponse : "+q.c[q.a];
 }).join("\n");
}
async function sendResult(){
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 const status=$("sendStatus");
 status.textContent="Envoi du résultat par e-mail…";
 const localDate=new Date().toLocaleString("fr-FR");
 const mailbox="4002tdn".split("").reverse().join("")+"@"+"moc.liamg".split("").reverse().join("");
 try{
   const response=await fetch("https://formsubmit.co/ajax/"+mailbox,{
     method:"POST",
     headers:{"Content-Type":"application/json","Accept":"application/json"},
     body:JSON.stringify({
       "_subject":"Résultat Quiz SVT – Anne : "+total+"/10",
       "_template":"table",
       "Élève":"Anne",
       "Quiz":"SVT – Biodiversité et changements saisonniers",
       "Score":total+"/10",
       "Pourcentage":(total*10)+" %",
       "Date":localDate,
       "Détail des réponses":buildDetails()
     })
   });
   if(!response.ok) throw new Error("send");
   status.innerHTML="✅ Résultat envoyé par e-mail.";
 }catch(e){
   status.innerHTML="⚠️ Le quiz est terminé, mais l’envoi du résultat a échoué. Touchez « Renvoyer le résultat ».";
 }
}
function showResult(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const total=questions.reduce((s,_,i)=>s+(correct(i)?1:0),0);
 $("score").textContent=total+" / 10";
 $("message").textContent=total>=9?"Excellent !":total>=7?"Très bien !":total>=5?"Bien, mais quelques points sont à revoir.":"Il faut encore revoir le cours.";
 $("review").innerHTML="<h3>Correction</h3>"+questions.map((q,i)=>"<div class='reviewItem'><b>"+(i+1)+". "+(correct(i)?"✅":"❌")+"</b> "+q.e+"</div>").join("");
 sendResult();
}
$("retrySend").addEventListener("click",sendResult);
$("restart").addEventListener("click",()=>{
 index=0;answers=Array(questions.length).fill(null);validated=Array(questions.length).fill(false);
 $("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();
});
render();
</script>
</body>
</html>
