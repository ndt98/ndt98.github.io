<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test mail Thomas</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;color:#171717}main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{font-size:22px;font-weight:700}.o{display:block;border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}.ok{background:#e9f7ed}.bad{background:#fdecec}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:700;background:#172033;color:white;margin-top:10px}#result{display:none}</style></head><body><main><div class="card"><h1>Test envoi mail – Thomas</h1><p>Une seule question pour vérifier FormSubmit.</p></div><div id="result" class="card"></div><div class="card" id="card"><div class="q">Quel est le résultat de 7 × 8 ?</div><label class="o"><input type="radio" name="q" value="54"> 54</label><label class="o"><input type="radio" name="q" value="56"> 56</label><label class="o"><input type="radio" name="q" value="64"> 64</label><label class="o"><input type="radio" name="q" value="48"> 48</label></div><button type="button" id="correct">Corriger et envoyer la note</button></main><script>const EMAIL=['ndt2004','gmail.com'].join('@');const result=document.getElementById('result');let sent=false,locked=false;async function send(score,details){if(sent)return;sent=true;try{await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({'_subject':'TEST MAIL – Thomas – '+score+'/1','Élève':'Thomas','Score':score+'/1','Détail':details})})}catch(e){}}document.getElementById('correct').onclick=()=>{if(locked)return;locked=true;const a=document.querySelector('input[name="q"]:checked');const card=document.getElementById('card');let score=0,answer='—';if(a){answer=a.value;if(a.value==='56'){score=1;a.closest('.o').classList.add('ok')}else{a.closest('.o').classList.add('bad')}}card.querySelectorAll('.o').forEach(o=>{if(o.querySelector('input').value==='56')o.classList.add('ok')});card.querySelectorAll('input').forEach(x=>x.disabled=true);result.style.display='block';result.innerHTML='<h2>'+score+' / 1</h2><p>Test envoyé par e-mail.</p>';send(score,'7 × 8 = '+answer+' ; attendu 56');scrollTo({top:0,behavior:'smooth'})};</script></body></html>
