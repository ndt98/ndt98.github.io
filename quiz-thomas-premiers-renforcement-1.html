<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thomas – renforcement nombres premiers</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;margin:0;color:#17191d}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{font-size:19px;font-weight:750;margin-bottom:10px}.o{display:block;border:1px solid #ddd;border-radius:11px;padding:10px;margin:7px 0}.ok{background:#e9f7ed}.bad{background:#fdecec}.e{display:none;color:#666;font-size:14px;margin-top:8px;line-height:1.4}.rule{background:#f8fafc}.tag{font-size:13px;color:#666;font-weight:700;margin-bottom:6px}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:800;background:#172033;color:#fff;margin-top:8px}.secondary{background:#e5e9ef;color:#111}#r{display:none;border:2px solid #172033}</style></head><body><main><div class="card"><h1>Maths 3e – Thomas</h1><p>Renforcement après 7/10 : priorité aux nombres premiers et aux décompositions complètes.</p><div class="card rule"><b>Réflexes :</b><br>• impair ne veut pas dire premier<br>• pour tester un nombre, cherche un diviseur<br>• une décomposition est terminée seulement si tous les facteurs sont premiers</div></div><div id="r" class="card"></div><form id="quiz"></form><button type="button" id="b">Corriger</button><button type="button" id="n" class="secondary">Nouvelle série</button><script>
const Q=[
{t:'Nombres premiers',q:'Le nombre 39 est-il premier ?',c:['Oui','Non, car 39 = 3 × 13','Non, car il est pair','Oui, car il est impair'],a:'Non, car 39 = 3 × 13',e:'39 est impair mais il est divisible par 3. Donc il n’est pas premier.'},
{t:'Nombres premiers',q:'Le nombre 91 est-il premier ?',c:['Oui','Non, car 91 = 7 × 13','Non, car il est divisible par 3','Oui, car il finit par 1'],a:'Non, car 91 = 7 × 13',e:'91 possède les diviseurs 7 et 13. Il n’est donc pas premier.'},
{t:'Nombres premiers',q:'Lequel de ces nombres est premier ?',c:['41','51','57','63'],a:'41',e:'51, 57 et 63 sont divisibles par 3. 41 est premier.'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 36 ?',c:['2² × 3²','2 × 18','4 × 9','6 × 6'],a:'2² × 3²',e:'36 = 2 × 2 × 3 × 3. Les autres écritures contiennent encore des facteurs composés.'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 72 ?',c:['2³ × 3²','2 × 36','8 × 9','2² × 3³'],a:'2³ × 3²',e:'72 = 8 × 9 = 2³ × 3².'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 90 ?',c:['2 × 3² × 5','2 × 45','3 × 30','2² × 3 × 5'],a:'2 × 3² × 5',e:'90 = 2 × 45 = 2 × 3 × 3 × 5.'},
{t:'Nombres premiers',q:'Le nombre 49 est-il premier ?',c:['Oui','Non, car 49 = 7 × 7','Non, car il est pair','Oui, car il n’est pas divisible par 3'],a:'Non, car 49 = 7 × 7',e:'49 possède un diviseur autre que 1 et 49 : 7.'},
{t:'Développement',q:'Développe : 4(3x − 2)',c:['12x − 8','12x − 2','7x − 8','12x + 8'],a:'12x − 8',e:'4 × 3x = 12x et 4 × (−2) = −8.'},
{t:'Développement',q:'Développe : −5(x − 3)',c:['−5x + 15','−5x − 15','5x − 15','−5x + 3'],a:'−5x + 15',e:'−5 × x = −5x et −5 × (−3) = +15.'},
{t:'Développement',q:'Développe et réduis : 2(3x + 4) + x',c:['7x + 8','6x + 9','7x + 4','6x + 8'],a:'7x + 8',e:'2(3x + 4)=6x+8, puis 6x+x=7x.'}
];
const quiz=document.getElementById('quiz'),r=document.getElementById('r');let locked=false;
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){quiz.innerHTML='';r.style.display='none';locked=false;Q.forEach((x,i)=>{const d=document.createElement('section');d.className='card';d.id='c'+i;d.innerHTML='<div class="tag">'+x.t+'</div><div class="q">'+x.q+'</div>';sh(x.c).forEach(v=>{const l=document.createElement('label');l.className='o';const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=v;l.appendChild(inp);l.appendChild(document.createTextNode(' '+v));d.appendChild(l)});const e=document.createElement('div');e.className='e';e.textContent=x.e;d.appendChild(e);quiz.appendChild(d)})}
b.onclick=()=>{if(locked)return;locked=true;let s=0;Q.forEach((x,i)=>{const c=document.getElementById('c'+i),a=c.querySelector('input:checked');c.querySelectorAll('.o').forEach(o=>{if(o.querySelector('input').value===x.a)o.classList.add('ok')});if(a){if(a.value===x.a)s++;else a.closest('.o').classList.add('bad')}c.querySelector('.e').style.display='block';c.querySelectorAll('input').forEach(z=>z.disabled=true)});r.style.display='block';r.innerHTML='<h2>'+s+'/10</h2><p>'+(s>=9?'Très bien. Si les nombres premiers sont réussis, on pourra remonter le niveau.':s>=7?'Encore une série ciblée pour automatiser les nombres premiers.':'On reste sur ces réflexes avant de monter.')+'</p>';scrollTo({top:0,behavior:'smooth'})};n.onclick=draw;draw();</script></main></body></html>
