<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thomas – renforcement nombres premiers 2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;margin:0;color:#17191d}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}.q{font-size:19px;font-weight:750;margin-bottom:10px}.o{display:block;border:1px solid #ddd;border-radius:11px;padding:10px;margin:7px 0}.ok{background:#e9f7ed}.bad{background:#fdecec}.e{display:none;color:#666;font-size:14px;margin-top:8px;line-height:1.4}.rule{background:#f8fafc}.tag{font-size:13px;color:#666;font-weight:700;margin-bottom:6px}button{width:100%;padding:14px;border:0;border-radius:13px;font-size:18px;font-weight:800;background:#172033;color:#fff;margin-top:8px}.secondary{background:#e5e9ef;color:#111}#r{display:none;border:2px solid #172033}</style></head><body><main><div class="card"><h1>Maths 3e – Thomas</h1><p>Nouvelle série après 8/10 : mêmes notions, nouvelles questions.</p><div class="card rule"><b>Réflexes :</b><br>• impair ≠ forcément premier<br>• chercher un diviseur simple avant de conclure<br>• une décomposition est finie seulement quand tous les facteurs sont premiers</div></div><div id="r" class="card"></div><form id="quiz"></form><button type="button" id="b">Corriger</button><button type="button" id="n" class="secondary">Refaire</button><script>
const Q=[
{t:'Nombres premiers',q:'Le nombre 51 est-il premier ?',c:['Oui','Non, car 51 = 3 × 17','Non, car 51 est pair','Oui, car 51 est impair'],a:'Non, car 51 = 3 × 17',e:'51 est impair mais divisible par 3 : 5 + 1 = 6.'},
{t:'Nombres premiers',q:'Le nombre 97 est-il premier ?',c:['Oui','Non, car 97 = 7 × 13','Non, car il est divisible par 3','Non, car il finit par 7'],a:'Oui',e:'Aucun des nombres premiers 2, 3, 5 ou 7 ne divise 97. Comme √97 < 10, cela suffit.'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 84 ?',c:['2² × 3 × 7','2 × 42','4 × 3 × 7','2³ × 3 × 7'],a:'2² × 3 × 7',e:'84 = 2 × 42 = 2 × 2 × 21 = 2² × 3 × 7.'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 100 ?',c:['2² × 5²','10 × 10','2 × 50','2³ × 5²'],a:'2² × 5²',e:'100 = 4 × 25 = 2² × 5².'},
{t:'Nombres premiers',q:'Lequel de ces nombres est premier ?',c:['43','45','49','55'],a:'43',e:'45 est divisible par 5 et 3, 49 = 7² et 55 = 5 × 11. 43 est premier.'},
{t:'Nombres premiers',q:'Le nombre 77 est-il premier ?',c:['Oui','Non, car 77 = 7 × 11','Non, car il est divisible par 3','Non, car il est pair'],a:'Non, car 77 = 7 × 11',e:'77 possède les diviseurs 7 et 11.'},
{t:'Décomposition',q:'Quelle est la décomposition en facteurs premiers de 126 ?',c:['2 × 3² × 7','2 × 63','3 × 42','2² × 3 × 7'],a:'2 × 3² × 7',e:'126 = 2 × 63 = 2 × 3 × 21 = 2 × 3² × 7.'},
{t:'Développement',q:'Développe : 6(2x + 3)',c:['12x + 18','12x + 3','8x + 18','12x − 18'],a:'12x + 18',e:'6 × 2x = 12x et 6 × 3 = 18.'},
{t:'Développement',q:'Développe : −4(3x − 5)',c:['−12x + 20','−12x − 20','12x − 20','−7x + 20'],a:'−12x + 20',e:'−4 × 3x = −12x et −4 × (−5) = +20.'},
{t:'Développement',q:'Développe et réduis : 2(4x − 3) + 3x',c:['11x − 6','8x','11x − 3','8x − 6'],a:'11x − 6',e:'2(4x − 3)=8x−6, puis 8x+3x=11x.'}
];
const quiz=document.getElementById('quiz'),r=document.getElementById('r');let locked=false;
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){quiz.innerHTML='';r.style.display='none';locked=false;Q.forEach((x,i)=>{const d=document.createElement('section');d.className='card';d.id='c'+i;d.innerHTML='<div class="tag">'+x.t+'</div><div class="q">'+x.q+'</div>';sh(x.c).forEach(v=>{const l=document.createElement('label');l.className='o';const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=v;l.appendChild(inp);l.appendChild(document.createTextNode(' '+v));d.appendChild(l)});const e=document.createElement('div');e.className='e';e.textContent=x.e;d.appendChild(e);quiz.appendChild(d)})}
b.onclick=()=>{if(locked)return;locked=true;let s=0;Q.forEach((x,i)=>{const c=document.getElementById('c'+i),a=c.querySelector('input:checked');c.querySelectorAll('.o').forEach(o=>{if(o.querySelector('input').value===x.a)o.classList.add('ok')});if(a){if(a.value===x.a)s++;else a.closest('.o').classList.add('bad')}c.querySelector('.e').style.display='block';c.querySelectorAll('input').forEach(z=>z.disabled=true)});r.style.display='block';r.innerHTML='<h2>'+s+'/10</h2><p>'+(s>=9?'Très bien. On pourra commencer à monter légèrement le niveau.':s===8?'Encore une série de consolidation : ce n’est pas encore totalement automatisé.':'On garde ce niveau pour consolider.')+'</p>';scrollTo({top:0,behavior:'smooth'})};n.onclick=draw;draw();</script></main></body></html>
