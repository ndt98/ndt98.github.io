<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Vrai/Faux – Le monde habité</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe7;color:#28231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:auto;padding:12px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0001}
h1{font-size:1.5rem;margin:0 0 6px}
.muted{color:#6b625b;line-height:1.45}
.q{padding:16px 0;border-top:1px solid #ece4dc}
.q:first-child{border-top:0}
.statement{font-weight:750;line-height:1.4;margin-bottom:10px}
.choices{display:flex;gap:10px}
.choice{flex:1;border:1px solid #d7cbc0;border-radius:13px;padding:13px;background:#fff;font:inherit;font-weight:800}
.choice.selected{background:#ead8c6;border-color:#765035}
.submit{width:100%;border:0;border-radius:14px;padding:14px;background:#765035;color:white;font:inherit;font-weight:850;margin-top:12px}
.hidden{display:none!important}
.score{text-align:center;font-size:3rem;font-weight:850;margin:10px 0}
.review{border-top:1px solid #eadfd5;padding:12px 0;line-height:1.45}
.ok{color:#17632e;font-weight:800}
.bad{color:#8a2020;font-weight:800}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Quiz Vrai / Faux – Le monde habité</h1>
<div class="muted">Anne • Géographie 6e • niveau difficile</div>
<div class="muted">20 affirmations. Certaines sont très proches du cours mais comportent un détail faux.</div>
</section>

<section class="card" id="quiz"></section>
<section class="card hidden" id="result">
<div class="muted" style="text-align:center">Résultat</div>
<div class="score" id="score"></div>
<div id="message" style="text-align:center"></div>
<div id="mailStatus" class="muted" style="text-align:center;margin-top:10px"></div>
<div id="review"></div>
<button class="submit" id="restart" type="button">Recommencer</button>
</section>
</main>

<script>
const qs=[
["Le relief est l’ensemble des irrégularités présentes à la surface de la Terre.",true,"C’est la définition du cours."],
["Une plaine est une surface plane située obligatoirement à haute altitude.",false,"Une plaine est une surface plane de faible altitude."],
["Sur un plateau, les cours d’eau peuvent avoir creusé des vallées profondes.",true,"C’est ce qui distingue notamment le plateau de la plaine dans le cours."],
["Une montagne se caractérise par des altitudes élevées et des pentes raides.",true,"C’est la définition retenue dans le cours."],
["Une contrainte naturelle est un obstacle créé uniquement par les activités humaines.",false,"Elle est posée par la nature et peut limiter l’implantation humaine."],
["L’aridité correspond à un manque d’eau permanent ou durable.",true,"C’est la définition du cours."],
["Un littoral est une région située au contact de la mer et de la terre.",true,"C’est la définition du cours."],
["La densité de population correspond au nombre d’habitants par kilomètre carré.",true,"La densité s’exprime en habitants par km²."],
["Un foyer de peuplement est une région très densément peuplée depuis longtemps.",true,"Le cours insiste sur la forte densité et l’ancienneté du peuplement."],
["Un désert humain est un espace totalement dépourvu d’habitants.",false,"Il s’agit d’un espace très faiblement peuplé, pas forcément vide."],
["Le mot urbain désigne ce qui est en rapport avec la campagne.",false,"Urbain renvoie à la ville ; rural renvoie à la campagne."],
["Les plaines et les grandes vallées sont souvent des espaces de fortes densités.",true,"Le cours les cite parmi les espaces fortement peuplés."],
["Les hautes montagnes sont généralement favorables à de fortes densités de population.",false,"Elles constituent souvent une contrainte naturelle et sont faiblement peuplées."],
["Les régions polaires peuvent être des déserts humains en raison de fortes contraintes naturelles.",true,"Le froid extrême limite fortement le peuplement."],
["Le Sahara est un exemple de désert humain étudié dans le cours.",true,"Il figure parmi les exemples du cours."],
["L’Amazonie est citée comme région de forêt dense pouvant avoir de faibles densités.",true,"La forêt dense peut constituer une contrainte au peuplement."],
["Les littoraux sont toujours faiblement peuplés car la mer empêche les activités humaines.",false,"Au contraire, de nombreux littoraux concentrent de fortes densités."],
["Un facteur historique est un élément du passé qui peut aider à expliquer la répartition actuelle de la population.",true,"Les héritages du passé influencent le peuplement actuel."],
["Les fortes densités d’Europe s’expliquent seulement par le relief.",false,"Le cours évoque aussi des facteurs historiques, économiques et humains."],
["Les foyers de peuplement asiatiques et européens sont anciens.",true,"Le cours indique que ces grands foyers sont très anciens."]
];

let answers=Array(qs.length).fill(null);

function render(){
 const box=document.getElementById("quiz");
 box.innerHTML="";
 qs.forEach((q,i)=>{
   const d=document.createElement("div");
   d.className="q";
   d.innerHTML='<div class="statement">'+(i+1)+'. '+q[0]+'</div><div class="choices">'+
   '<button type="button" class="choice '+(answers[i]===true?'selected':'')+'" data-i="'+i+'" data-v="true">Vrai</button>'+
   '<button type="button" class="choice '+(answers[i]===false?'selected':'')+'" data-i="'+i+'" data-v="false">Faux</button></div>';
   box.appendChild(d);
 });
 const b=document.createElement("button");
 b.type="button"; b.className="submit"; b.textContent="Corriger le quiz";
 b.onclick=finish;
 box.appendChild(b);
 box.querySelectorAll(".choice").forEach(btn=>{
   btn.onclick=()=>{
     const i=Number(btn.dataset.i);
     answers[i]=btn.dataset.v==="true";
     render();
   };
 });
}

async function sendMail(score){
 const st=document.getElementById("mailStatus");
 st.textContent="Envoi automatique du résultat…";
 try{
  const r=await fetch("https://formsubmit.co/ajax/ndt2004@gmail.com",{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({
    "_subject":"Quiz Vrai/Faux Géographie – Anne : "+score+"/20",
    "Élève":"Anne",
    "Quiz":"Le monde habité – Vrai/Faux",
    "Score":score+"/20"
   })
  });
  if(!r.ok)throw new Error();
  st.textContent="Résultat envoyé automatiquement par e-mail.";
 }catch(e){
  st.textContent="Résultat affiché, mais l’envoi du mail a échoué.";
 }
}

function finish(){
 if(answers.some(v=>v===null)){alert("Réponds à toutes les affirmations avant de corriger.");return;}
 let score=0, html="<h2>Correction détaillée</h2>";
 qs.forEach((q,i)=>{
   const ok=answers[i]===q[1];
   if(ok)score++;
   html+='<div class="review"><div class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+(ok?'✓':'✗')+' '+(q[1]?'Vrai':'Faux')+'</div><div>'+q[2]+'</div></div>';
 });
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+" / 20";
 document.getElementById("message").textContent=score>=18?"Excellente maîtrise.":score>=15?"Très bon niveau.":score>=12?"Bon ensemble, quelques notions à revoir.":"Reprends les définitions et les facteurs de peuplement.";
 document.getElementById("review").innerHTML=html;
 window.scrollTo(0,0);
 sendMail(score);
}

document.getElementById("restart").onclick=()=>{
 answers=Array(qs.length).fill(null);
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("mailStatus").textContent="";
 render();
 window.scrollTo(0,0);
};

render();
</script>
</body>
</html>
