<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dernier résultat – Thomas (GitHub)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:800px;margin:auto;padding:16px}.card{background:white;border:1px solid #dae0e8;border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:25px}.score{font-size:32px;font-weight:800}.muted{color:#687587;line-height:1.45}.correct{border-left:5px solid #44a266}.incorrect{border-left:5px solid #cf6060}
button{width:100%;padding:13px;background:#172033;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:750;margin:8px 0}
textarea{width:100%;min-height:210px;border:1px solid #c7cfdc;border-radius:9px;padding:10px;line-height:1.5}
a{color:#174b87;overflow-wrap:anywhere}.question{font-weight:800}.answers{line-height:1.55}
</style></head>
<body><main>
<section class="card"><h1>Dernier résultat de Thomas</h1><p class="muted">Cette page consulte le fichier réellement enregistré dans le dépôt GitHub, quel que soit l'appareil sur lequel le quiz a été effectué.</p>
<button type="button" id="reload">Relire le résultat dans GitHub</button>
<p id="status" aria-live="polite">Lecture de GitHub en cours…</p>
<p class="muted"><a href="https://github.com/ndt98/ndt98.github.io/blob/master/resultat-thomas.json" target="_blank" rel="noopener">Ouvrir le fichier resultat-thomas.json sur GitHub</a></p></section>
<section id="result" class="card" hidden><h2 id="title"></h2><div id="score" class="score"></div><p id="date" class="muted"></p><div id="items"></div><button type="button" id="copy">Copier le résultat complet</button><textarea id="all" readonly></textarea></section>
</main>
<script>
(function(){
"use strict";
const API="https://api.github.com/repos/ndt98/ndt98.github.io/contents/resultat-thomas.json";
const $=id=>document.getElementById(id);
function decodeBase64(s){const bin=atob(s.replace(/\s/g,""));const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b)}
function display(data,sha){
 $("result").hidden=false;
 $("title").textContent=data.subject||data.quiz_id||"Quiz de Thomas";
 $("score").textContent=data.score+" / "+data.total;
 $("date").textContent="Date : "+(data.completed_at?new Date(data.completed_at).toLocaleString("fr-FR"):"non fournie")+" · Version GitHub : "+(sha||"").slice(0,12);
 const root=$("items");root.replaceChildren();
 const lines=["Thomas – "+(data.subject||"quiz"),"Score : "+data.score+"/"+data.total,"Date : "+(data.completed_at||"")];
 (data.items||[]).forEach((item,i)=>{
  const card=document.createElement("div");card.className="card "+(item.correct?"correct":"incorrect");
  const q=document.createElement("p");q.className="question";q.textContent=(i+1)+". "+item.question;card.appendChild(q);
  const ans=document.createElement("p");ans.className="answers";ans.textContent="Réponse Thomas : "+item.given+" | Attendu : "+item.expected;card.appendChild(ans);
  root.appendChild(card);
  lines.push((i+1)+". "+item.question+" | réponse Thomas : "+item.given+" | attendu : "+item.expected);
 });
 $("all").value=lines.join("\n");
 $("status").textContent="Résultat lu dans le dépôt GitHub.";
}
async function load(){
 $("status").textContent="Lecture de GitHub en cours…";$("result").hidden=true;
 try{
  const response=await fetch(API+"?ref=master&v="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
  if(!response.ok)throw Error("GitHub HTTP "+response.status);
  const record=await response.json();
  const data=JSON.parse(decodeBase64(record.content));
  if(data.status!=="enregistre"||!Array.isArray(data.items)||data.items.length===0){$("status").textContent="Le fichier existe, mais aucun résultat de quiz n'y a encore été enregistré.";return}
  display(data,record.sha);
 }catch(e){$("status").textContent="Impossible de lire le fichier GitHub : "+e.message}
}
$("reload").onclick=load;
$("copy").onclick=async function(){try{await navigator.clipboard.writeText($("all").value);$("copy").textContent="Résultat copié"}catch(e){$("all").select();document.execCommand("copy")}};
load();
})();
</script></body></html>
